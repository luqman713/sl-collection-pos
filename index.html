<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SL Collection POS</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--ink:#1A0A00;--ink2:#3D1F08;--ink3:#6B3E1A;--cream:#FAF6F0;--cream2:#F2E9DC;--gold:#B8860B;--sage:#2D4A2D;--red:#8B1A1A;--border:#D4C4A8;--r:12px;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:'Segoe UI',sans-serif;}
html,body{height:100%;background:var(--cream);color:var(--ink);max-width:480px;margin:0 auto;}
/* LOGIN */
#ls{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px;background:linear-gradient(150deg,#1A0A00,#3D1F08 60%,#8B3A1A);}
.lb1{text-align:center;margin-bottom:36px;color:white;}
.lb1 h1{font-size:2.4rem;font-weight:300;letter-spacing:.04em;}
.lb1 p{font-size:.6rem;letter-spacing:.3em;opacity:.4;margin-top:6px;}
.lc{background:white;border-radius:20px;padding:28px 22px;width:100%;max-width:320px;box-shadow:0 24px 60px rgba(0,0,0,.4);}
.lc h2{font-size:.68rem;font-weight:600;color:var(--ink3);margin-bottom:20px;text-align:center;letter-spacing:.15em;text-transform:uppercase;}
.le{color:var(--red);font-size:.68rem;text-align:center;margin-top:8px;display:none;}
/* APP */
#app{display:none;}
#tb{background:var(--ink);padding:10px 14px 0;position:sticky;top:0;z-index:100;}
.tbr{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.brand{color:white;font-size:1rem;font-weight:600;letter-spacing:.03em;}
.brand small{display:block;font-size:.52rem;color:rgba(255,255,255,.35);letter-spacing:.08em;font-weight:300;}
.uc{background:rgba(255,255,255,.1);color:white;font-size:.6rem;padding:4px 10px;border-radius:16px;border:1px solid rgba(255,255,255,.1);}
.xb{background:none;border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.6);border-radius:6px;padding:4px 9px;font-size:.6rem;cursor:pointer;margin-left:6px;}
.nt{display:flex;gap:1px;overflow-x:auto;scrollbar-width:none;padding-bottom:0;}
.nt::-webkit-scrollbar{display:none;}
.ni{color:rgba(255,255,255,.4);font-size:.57rem;font-weight:500;letter-spacing:.06em;text-transform:uppercase;padding:8px 11px;border-radius:8px 8px 0 0;cursor:pointer;white-space:nowrap;flex-shrink:0;}
.ni.on{background:var(--cream);color:var(--ink);font-weight:700;}
#ct{padding:14px;padding-bottom:80px;}
/* FORMS */
.fg{margin-bottom:11px;}
.lb{font-size:.58rem;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px;display:block;}
.ip,.sl{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:10px 12px;font-size:.85rem;color:var(--ink);background:white;outline:none;}
.ip:focus,.sl:focus{border-color:var(--gold);}
/* BUTTONS */
.btn{border:none;border-radius:10px;padding:11px 16px;font-size:.76rem;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;width:100%;}
.btn:active{transform:scale(.97);}
.bi{background:var(--ink);color:white;}
.bg{background:var(--gold);color:white;}
.bs{background:var(--sage);color:white;}
.br{background:var(--red);color:white;}
.bh{background:var(--cream2);color:var(--ink2);border:1px solid var(--border);}
.bsm{width:auto;padding:7px 12px;font-size:.66rem;border-radius:8px;}
.bxs{width:auto;padding:4px 9px;font-size:.6rem;border-radius:6px;}
/* CARDS */
.card{background:white;border-radius:var(--r);padding:14px;margin-bottom:12px;border:1px solid #E8D8C0;box-shadow:0 2px 12px rgba(26,10,0,.06);}
.ct{font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--ink3);margin-bottom:11px;padding-bottom:8px;border-bottom:1px solid #E8D8C0;}
/* STATS */
.sg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.sc{background:white;border-radius:var(--r);padding:12px 13px;border-left:3px solid var(--ink3);box-shadow:0 2px 12px rgba(26,10,0,.06);}
.sc.go{border-left-color:var(--gold);} .sc.sg2{border-left-color:var(--sage);} .sc.rd{border-left-color:var(--red);}
.sl2{font-size:.54rem;text-transform:uppercase;letter-spacing:.1em;color:var(--ink3);font-weight:600;}
.sv{font-size:1.05rem;font-weight:700;color:var(--ink);margin-top:3px;}
/* PILLS */
.pr{display:flex;gap:5px;flex-wrap:wrap;}
.pl{border:1.5px solid var(--border);border-radius:18px;padding:5px 12px;font-size:.63rem;font-weight:600;cursor:pointer;color:var(--ink3);background:white;white-space:nowrap;}
.pl.on{background:var(--ink);color:white;border-color:var(--ink);}
/* PRODUCTS */
.pc{background:white;border:1.5px solid #E8D8C0;border-radius:var(--r);padding:10px 11px;margin-bottom:8px;cursor:pointer;display:flex;align-items:center;gap:9px;}
.pc:active{border-color:var(--gold);}
.pt{width:46px;height:46px;border-radius:8px;background:var(--cream2);display:flex;align-items:center;justify-content:center;font-size:1.4rem;flex-shrink:0;}
.psk{font-size:.53rem;font-weight:700;font-family:monospace;background:var(--ink);color:white;padding:2px 5px;border-radius:3px;display:inline-block;margin-bottom:2px;}
.pn{font-size:.76rem;font-weight:600;color:var(--ink);}
.pa{font-size:.56rem;color:var(--ink3);margin-top:1px;}
.pp{font-size:.55rem;background:var(--cream2);color:var(--ink3);padding:2px 6px;border-radius:3px;margin-top:2px;display:inline-block;}
.pad{width:34px;height:34px;border-radius:8px;background:var(--sage);color:white;display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0;font-weight:700;}
/* CART */
.ci{background:white;border:1px solid #E8D8C0;border-radius:var(--r);padding:10px 12px;margin-bottom:8px;}
.qc{display:flex;align-items:center;gap:5px;background:var(--cream2);border-radius:7px;padding:3px 7px;border:1px solid #E8D8C0;}
.qb{background:none;border:none;font-size:.85rem;cursor:pointer;font-weight:700;width:20px;height:20px;display:flex;align-items:center;justify-content:center;}
.qn{font-size:.78rem;font-weight:700;min-width:18px;text-align:center;}
.pi{flex:1;border:1.5px solid var(--border);border-radius:7px;padding:6px 9px;font-size:.82rem;font-weight:700;color:var(--gold);outline:none;}
.pi:focus{border-color:var(--gold);}
/* TOAST */
.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:white;padding:9px 20px;border-radius:20px;font-size:.74rem;font-weight:500;opacity:0;transition:all .3s;z-index:999;white-space:nowrap;max-width:92vw;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.ok{background:var(--sage);} .toast.err{background:var(--red);} .toast.warn{background:var(--gold);}
/* MODAL */
.mo{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:flex-end;}
.mo.show{display:flex;}
.mb{background:white;border-radius:20px 20px 0 0;padding:20px;width:100%;max-height:86vh;overflow-y:auto;}
.mt{font-size:1.05rem;font-weight:600;color:var(--ink);margin-bottom:14px;}
.mx{background:none;border:none;font-size:1.1rem;cursor:pointer;color:var(--ink3);padding:2px 6px;}
/* REPORT */
.rh{background:var(--ink);color:white;padding:8px 12px;border-radius:9px 9px 0 0;display:flex;justify-content:space-between;}
.rh div{font-size:.6rem;font-weight:700;}
.rr{display:flex;justify-content:space-between;padding:7px 12px;border-bottom:1px solid var(--cream2);background:white;font-size:.7rem;}
.rf{display:flex;justify-content:space-between;padding:8px 12px;background:var(--cream2);border-radius:0 0 9px 9px;font-size:.72rem;font-weight:700;color:var(--ink2);}
/* EMPTY */
.em{text-align:center;padding:28px 16px;color:var(--ink3);}
.ei{font-size:2.4rem;margin-bottom:8px;}
/* G2 */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
/* SPIN */
.sp{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-radius:50%;border-top-color:white;animation:sp .8s linear infinite;}
@keyframes sp{to{transform:rotate(360deg)}}
/* SKU */
.sku-prev{background:var(--cream2);border:1.5px solid var(--gold);border-radius:var(--r);padding:11px 13px;margin-bottom:12px;}
.sku-code{font-family:monospace;font-size:.9rem;font-weight:700;color:var(--gold);}
/* INV */
.ih{display:grid;grid-template-columns:1.8fr .6fr .8fr .8fr;background:var(--ink);color:white;padding:6px 11px;border-radius:8px 8px 0 0;}
.ih div{font-size:.54rem;font-weight:700;text-transform:uppercase;}
.ir{display:grid;grid-template-columns:1.8fr .6fr .8fr .8fr;padding:8px 11px;border-top:1px solid var(--cream2);background:white;cursor:pointer;}
.if{display:grid;grid-template-columns:1.8fr .6fr .8fr .8fr;padding:7px 11px;background:var(--cream2);}
/* DATE */
.df{display:flex;gap:8px;margin-bottom:12px;}
.df .ip{font-size:.73rem;padding:7px 10px;flex:1;}
/* INFO */
.ib{background:var(--cream2);border:1px solid var(--border);border-radius:9px;padding:9px 12px;margin-bottom:11px;font-size:.66rem;color:var(--ink2);}
.wb{background:#FFF8E4;border:1.5px solid var(--gold);border-radius:9px;padding:9px 12px;margin-bottom:11px;font-size:.68rem;color:var(--ink2);}
</style>
</head>
<body>
<!-- LOGIN -->
<div id="ls">
  <div class="lb1"><h1>SL Collection</h1><p>POINT OF SALE · RAWALPINDI</p></div>
  <div class="lc">
    <h2>Sign In</h2>
    <div class="fg"><label class="lb">Email</label><input class="ip" id="em" type="email" value="owner@slcollection.com"></div>
    <div class="fg"><label class="lb">Password</label><input class="ip" id="pw" type="password" placeholder="Password"></div>
    <button class="btn bi" id="lb2" onclick="login()">Sign In</button>
    <div class="le" id="le">Invalid credentials</div>
  </div>
</div>
<!-- APP -->
<div id="app">
  <div id="tb">
    <div class="tbr">
      <div class="brand">SL Collection<small>POS · Rawalpindi</small></div>
      <div style="display:flex;align-items:center;">
        <div class="uc" id="uc">👤 Owner</div>
        <button class="xb" onclick="logout()">Exit</button>
      </div>
    </div>
    <div class="nt" id="nt"></div>
  </div>
  <div id="ct"></div>
</div>
<!-- TOAST -->
<div class="toast" id="tst"></div>
<!-- MODAL -->
<div class="mo" id="mo">
  <div class="mb">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:13px;">
      <div class="mt" id="mtitle"></div>
      <button class="mx" onclick="cmo()">✕</button>
    </div>
    <div id="mc"></div>
  </div>
</div>
<script>
const{createClient}=supabase;
const sb=createClient('https://fqubaesqzfmxvbtqconu.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZxdWJhZXNxemZteHZidHFjb251Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxODIwNTMsImV4cCI6MjA5NDc1ODA1M30.vqDRl0LGYOukQBRK7aegaXgCKxi-r65IwyNZKvGnUIk');
const $=id=>document.getElementById(id);
const fmt=n=>'Rs'+Number(n||0).toLocaleString();
const td=()=>new Date().toISOString().split('T')[0];
const CATS=['3PC','2PC','Shirt','Jeans','Trouser','Dupatta','Abaya','Scarf'];
const CCOD={'3PC':'3PC','2PC':'2PC','Shirt':'SHT','Jeans':'JNS','Trouser':'TRS','Dupatta':'DPT','Abaya':'ABY','Scarf':'SCF'};
const CEMI={'3PC':'👗','2PC':'👘','Shirt':'👚','Jeans':'👖','Trouser':'👖','Dupatta':'🧣','Abaya':'🖤','Scarf':'🧤'};
let CU=null,CUP=null,cart=[],payMode='cash',purPayMode='cash',prods=[],accs=[],parties=[],bCat='',pPhoto=null;
function toast(m,t,d){const el=$('tst');el.textContent=m;el.className='toast show '+(t||'');setTimeout(()=>el.className='toast',d||3000);}
function omo(t,h){$('mtitle').textContent=t;$('mc').innerHTML=h;$('mo').classList.add('show');}
function cmo(){$('mo').classList.remove('show');}
function emo2(c){return CEMI[c]||'📦';}
function colCode(c){if(!c)return'CLR';const m={black:'BLK',white:'WHT',blue:'BLU','navy blue':'NVY',navy:'NVY',red:'RED',green:'GRN',pink:'PNK',yellow:'YLW',orange:'ORG',brown:'BRN',maroon:'MRN',grey:'GRY',gray:'GRY',multi:'MLT'};const l=c.toLowerCase().trim();if(m[l])return m[l];for(const[k,v]of Object.entries(m)){if(l.includes(k))return v;}return c.replace(/[^a-zA-Z]/g,'').toUpperCase().substring(0,3)||'CLR';}
function szCode(s){if(!s)return'STD';const m={SMALL:'S',MEDIUM:'M',LARGE:'L','EXTRA LARGE':'XL','FREE SIZE':'FRE'};return m[s.toUpperCase().trim()]||s.toUpperCase().substring(0,3);}

// AUTH
async function login(){
  const email=$('em').value.trim(),pw=$('pw').value;
  if(!email||!pw){$('le').style.display='block';return;}
  const btn=$('lb2');btn.innerHTML='<div class="sp"></div>';btn.disabled=true;
  const{data,error}=await sb.auth.signInWithPassword({email,password:pw});
  if(error){$('le').style.display='block';$('le').textContent='Error: '+error.message;btn.innerHTML='Sign In';btn.disabled=false;return;}
  CU=data.user;
  const{data:u}=await sb.from('users').select('*').eq('auth_id',CU.id).single();
  CUP=u;
  await loadData();
  $('ls').style.display='none';
  $('app').style.display='block';
  $('uc').textContent=(CUP?.role==='owner'?'👑':'👤')+' '+(CUP?.full_name||'User');
  buildNav();
  btn.innerHTML='Sign In';btn.disabled=false;
  toast('Welcome '+( CUP?.full_name||'')+'!','ok');
}
$('pw').addEventListener('keypress',function(e){if(e.key==='Enter')login();});
sb.auth.getSession().then(async function(res){if(res.data.session){CU=res.data.session.user;const{data:u}=await sb.from('users').select('*').eq('auth_id',CU.id).single();CUP=u;await loadData();$('ls').style.display='none';$('app').style.display='block';$('uc').textContent=(CUP?.role==='owner'?'👑':'👤')+' '+(CUP?.full_name||'User');buildNav();}});
async function logout(){await sb.auth.signOut();CU=null;CUP=null;cart=[];$('app').style.display='none';$('ls').style.display='flex';}

// DATA
async function loadData(){
  const[p,a,pa]=await Promise.all([
    sb.from('product_variants').select('*,products(name,categories(name,code))').eq('is_active',true),
    sb.from('cashflow_accounts').select('*').eq('is_active',true).order('sort_order'),
    sb.from('parties').select('*').eq('is_active',true).order('name')
  ]);
  prods=(p.data||[]).map(function(v){return{id:v.id,sku:v.sku,name:v.products?.name||'',cat:v.products?.categories?.name||'',colour:v.colour||'',size:v.size||'',cost:Number(v.purchase_price)||0,photo:v.photo_url||'',stock:0,age:0};});
  accs=a.data||[];parties=pa.data||[];
  const{data:inv}=await sb.from('inventory').select('variant_id,qty_available,age_days,last_purchase_date');
  (inv||[]).forEach(function(i){const p=prods.find(function(p){return p.id===i.variant_id;});if(p){p.stock=Number(i.qty_available)||0;p.age=i.age_days||0;}});
}

// NAV
function buildNav(){
  const tabs=CUP?.role==='owner'
    ?[{id:'dash',l:'📊'},{id:'bill',l:'🧾 Bill'},{id:'inv',l:'📋 Stock'},{id:'buy',l:'📦 Buy'},{id:'led',l:'📒 Ledger'},{id:'rep',l:'📈 Reports'},{id:'cash',l:'💵 Cash'}]
    :[{id:'bill',l:'🧾 Bill'},{id:'inv',l:'📋 Stock'},{id:'buy',l:'📦 Buy'}];
  $('nt').innerHTML=tabs.map(function(t,i){return'<div class="ni '+(i===0?'on':'')+'" onclick="showTab(\''+t.id+'\',this)">'+t.l+'</div>';}).join('');
  showTab(tabs[0].id,null);
}
function showTab(id,el){
  if(el){document.querySelectorAll('.ni').forEach(function(n){n.classList.remove('on');});el.classList.add('on');}
  const c=$('ct');
  if(id==='dash')c.innerHTML=rDash(),iDash();
  else if(id==='bill')c.innerHTML=rBill(),iBill();
  else if(id==='inv')c.innerHTML=rInv(),iInv();
  else if(id==='buy')c.innerHTML=rBuy();
  else if(id==='led')c.innerHTML=rLed(),iLed();
  else if(id==='rep')c.innerHTML=rRep(),iRep();
  else if(id==='cash')c.innerHTML=rCash(),iCash();
}

// DASHBOARD
function rDash(){return'<div id="ob" class="wb" style="display:none"><div class="ct">Opening Balance</div><div style="display:flex;gap:8px"><input class="ip" id="ob-v" type="number" placeholder="Cash in drawer"><button class="btn bg bsm" onclick="setOB()">Set</button></div></div><div class="sg" id="ds"></div><div class="card" id="dr"></div><div style="font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--ink3);margin-bottom:8px">Today Sales</div><div id="dd"></div>';}
async function iDash(){
  const ca=accs.find(function(a){return a.name==='Cash Drawer';});
  if(ca){const{data:ob}=await sb.from('opening_balances').select('id').eq('balance_date',td()).eq('account_id',ca.id).maybeSingle();if(!ob)$('ob').style.display='block';}
  const{data:s}=await sb.rpc('get_dashboard_summary',{p_date:td()});
  if(s){
    $('ds').innerHTML='<div class="sc"><div class="sl2">Today Sales</div><div class="sv">'+fmt(s.today_sales)+'</div><div style="font-size:.54rem;color:var(--ink3)">'+s.today_bills+' bills</div></div><div class="sc sg2"><div class="sl2">Profit</div><div class="sv">'+fmt(s.today_profit)+'</div></div><div class="sc go"><div class="sl2">Cash</div><div class="sv">'+fmt(s.cash_balance)+'</div></div><div class="sc rd"><div class="sl2">Expenses</div><div class="sv">'+fmt(s.today_expenses)+'</div></div><div class="sc"><div class="sl2">Monthly Sales</div><div class="sv">'+fmt(s.monthly_sales)+'</div></div><div class="sc sg2"><div class="sl2">Monthly Profit</div><div class="sv">'+fmt(s.monthly_profit)+'</div></div><div class="sc" style="border-left-color:var(--ink3)"><div class="sl2">Receivables</div><div class="sv">'+fmt(s.total_receivables)+'</div></div><div class="sc rd"><div class="sl2">Payables</div><div class="sv">'+fmt(s.total_payables)+'</div></div>';
    const ob2=ca?ca.opening_balance:0;
    $('dr').innerHTML='<div class="ct" style="color:var(--gold)">Cash Reconciliation</div><div style="display:flex;justify-content:space-between;font-size:.72rem;margin-bottom:5px"><span>Opening</span><span>'+fmt(ob2)+'</span></div><div style="display:flex;justify-content:space-between;font-size:.72rem;margin-bottom:5px"><span>+ Sales</span><span>'+fmt(s.today_sales)+'</span></div><div style="display:flex;justify-content:space-between;font-size:.72rem;margin-bottom:5px"><span>- Expenses</span><span>- '+fmt(s.today_expenses)+'</span></div><div style="display:flex;justify-content:space-between;font-size:.75rem;font-weight:700;border-top:1px dashed var(--border);padding-top:7px;margin-top:5px;color:var(--sage)"><span>Expected</span><span>'+fmt(ob2+Number(s.today_sales)-Number(s.today_expenses))+'</span></div>';
  }
  const{data:sl}=await sb.from('sales').select('*,transactions(transaction_no)').eq('sale_date',td()).order('created_at',{ascending:false}).limit(10);
  const dd=$('dd');
  if(!dd)return;
  if(!(sl||[]).length){dd.innerHTML='<div class="em"><div class="ei">🧾</div><p style="font-size:.75rem">No sales today</p></div>';return;}
  dd.innerHTML=(sl||[]).map(function(s){return'<div class="card" style="padding:10px 12px;margin-bottom:8px"><div style="display:flex;justify-content:space-between"><div><div style="font-size:.72rem;font-weight:600">'+( s.transactions?.transaction_no||'')+'</div><div style="font-size:.58rem;color:var(--ink3)">'+s.customer_name+' · '+s.payment_mode+'</div></div><div style="text-align:right"><div style="font-size:.72rem;font-weight:700">'+fmt(s.total_amount)+'</div><div style="font-size:.58rem;color:var(--sage)">+'+fmt(s.gross_profit)+'</div></div></div></div>';}).join('');
}
async function setOB(){
  const amt=Number($('ob-v')?.value||0);
  const ca=accs.find(function(a){return a.name==='Cash Drawer';});
  if(!ca)return;
  await sb.from('opening_balances').upsert({balance_date:td(),account_id:ca.id,amount:amt,set_by:CUP?.id},{onConflict:'balance_date,account_id'});
  await sb.from('cashflow_accounts').update({opening_balance:amt,current_balance:amt}).eq('id',ca.id);
  accs=accs.map(function(a){return a.id===ca.id?Object.assign({},a,{opening_balance:amt,current_balance:amt}):a;});
  $('ob').style.display='none';toast('Opening balance set: '+fmt(amt),'ok');iDash();
}

// BILLING
function rBill(){
  return'<div class="card"><div class="ct">New Sale</div><div class="fg"><label class="lb">Customer</label><div style="display:flex;gap:6px"><input class="ip" id="bc" placeholder="Walk-in Customer" style="flex:1" oninput="onCI()"><button class="btn bh bsm" onclick="pickP(\'customer\')">📋</button><button class="btn bh bsm" onclick="newPM(\'customer\')">➕</button></div><div id="cb" style="display:none;font-size:.6rem;margin-top:3px"></div></div><div class="fg"><label class="lb">Payment</label><div class="pr" id="pp"><div class="pl on" onclick="setPM(\'cash\',this)">💵 Cash</div><div class="pl" onclick="setPM(\'bank\',this)">🏦 Bank</div><div class="pl" onclick="setPM(\'emoney\',this)">📱 EMoney</div><div class="pl" onclick="setPM(\'credit\',this)">📋 Credit</div><div class="pl" onclick="setPM(\'split\',this)">⚡ Split</div></div></div><div id="pd"></div><div class="fg" style="margin-bottom:0"><label class="lb"><input type="checkbox" id="ia" style="accent-color:var(--gold);margin-right:4px">Acquaintance sale</label></div></div><input class="ip" id="bs" placeholder="Search products..." oninput="srch()" style="margin-bottom:8px"><div class="pr" id="cp" style="margin-bottom:10px"><div class="pl on" onclick="setBC(\'\',this)">All</div>'+CATS.map(function(c){return'<div class="pl" onclick="setBC(\''+c+'\',this)">'+c+'</div>';}).join('')+'</div><div id="br"></div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:5px;margin-bottom:7px"><div style="font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--ink3)">Cart <span id="cb2" style="background:var(--ink);color:white;border-radius:10px;padding:1px 6px;font-size:.55rem">0</span></div></div><div id="ci"></div><div id="bs2" style="display:none"></div><div id="ba" style="display:none"></div>';
}
function iBill(){srch();renderCart();}
function setPM(m,el){payMode=m;document.querySelectorAll('#pp .pl').forEach(function(p){p.classList.remove('on');});el.classList.add('on');const d=$('pd');if(!d)return;const ca=accs.find(function(a){return a.name==='Cash Drawer';});if(m==='cash'){d.innerHTML='<div class="ib">Cash Drawer: <strong>'+fmt(ca?.current_balance||0)+'</strong></div>';}else if(m==='bank'){d.innerHTML='<div class="fg"><label class="lb">Bank</label><select class="sl" id="bnk">'+accs.filter(function(a){return a.account_type==='bank';}).map(function(b){return'<option value="'+b.id+'">'+b.name+' ('+fmt(b.current_balance)+')</option>';}).join('')+'</select></div>';}else if(m==='emoney'){d.innerHTML='<div class="fg"><label class="lb">E-Money</label><select class="sl" id="em2">'+accs.filter(function(a){return a.account_type==='emoney';}).map(function(e){return'<option value="'+e.id+'">'+e.name+'</option>';}).join('')+'</select></div>';}else if(m==='credit'){d.innerHTML='<div class="ib" style="border-color:var(--gold)">Posted to Customer Ledger</div>';}else if(m==='split'){d.innerHTML='<div class="g2"><div class="fg"><label class="lb">Cash Rs</label><input class="ip" id="sc2" type="number" placeholder="0" oninput="updS()"></div><div class="fg"><label class="lb">Balance via</label><select class="sl" id="ss"><option value="credit">Credit</option><option value="bank">Bank</option></select></div></div><div id="sp2"></div>';};}
function updS(){const c=Number($('sc2')?.value||0);const t=cart.reduce(function(s,i){return s+i.price*i.qty;},0);const p=$('sp2');if(p&&t>0)p.innerHTML='<div class="ib">Cash: '+fmt(c)+' + Credit: '+fmt(Math.max(0,t-c))+'</div>';}
function onCI(){const n=($('bc')?.value||'').trim();const el=$('cb');if(!el)return;const p=parties.find(function(p){return p.name===n&&p.party_type==='customer';});if(p&&p.current_balance!==0){el.style.display='block';el.innerHTML='<span style="color:'+(p.current_balance>0?'var(--red)':'var(--sage)')+'">Outstanding: '+fmt(Math.abs(p.current_balance))+' '+(p.current_balance>0?'(owes)':'(credit)')+'</span>';}else el.style.display='none';}
function setBC(c,el){bCat=c;document.querySelectorAll('#cp .pl').forEach(function(p){p.classList.remove('on');});el.classList.add('on');srch();}
function srch(){const q=($('bs')?.value||'').toLowerCase();const r=$('br');if(!r)return;const f=prods.filter(function(p){return(p.stock||0)>0&&(!bCat||p.cat===bCat)&&(!q||(p.sku||'').toLowerCase().includes(q)||(p.name||'').toLowerCase().includes(q)||(p.colour||'').toLowerCase().includes(q));});if(!f.length){r.innerHTML='<div class="em"><div class="ei">🔍</div><p style="font-size:.72rem">No items</p></div>';return;}r.innerHTML=f.map(function(p){return'<div class="pc" onclick="addC(\''+p.id+'\')"><div class="pt">'+emo2(p.cat)+'</div><div style="flex:1;min-width:0"><div class="psk">'+p.sku+'</div><div class="pn">'+p.name+'</div><div class="pa">'+p.cat+(p.colour?' · '+p.colour:'')+(p.size?' · '+p.size:'')+' · Stock: <strong style="color:'+(p.stock<=2?'var(--red)':'var(--sage)')+'">'+p.stock+'</strong></div><div class="pp">Cost: '+fmt(p.cost)+' 🔒 '+(p.age>=90?'🔴 Dead':p.age>=60?'🟠 Slow':p.age>=30?'🟡 Ageing':'🟢 Fresh')+'</div></div><div class="pad">+</div></div>';}).join('');}
function addC(id){const p=prods.find(function(p){return p.id===id;});if(!p)return;const ic=cart.filter(function(c){return c.id===id;}).reduce(function(s,c){return s+c.qty;},0);if(ic>=(p.stock||0)){toast('Only '+p.stock+' in stock','err');return;}const ex=cart.find(function(c){return c.id===id;});if(ex)ex.qty++;else cart.push({id,sku:p.sku,name:p.name,cat:p.cat,colour:p.colour,size:p.size,cost:p.cost,price:0,qty:1});renderCart();toast('Added: '+p.name,'ok');}
function remC(id){cart=cart.filter(function(c){return c.id!==id;});renderCart();}
function updQ(id,d){const it=cart.find(function(c){return c.id===id;});if(!it)return;const p=prods.find(function(p){return p.id===id;});const nq=it.qty+d;if(nq<=0){remC(id);return;}if(p&&nq>p.stock){toast('Not enough stock','err');return;}it.qty=nq;renderCart();}
function updP(id,v){const it=cart.find(function(c){return c.id===id;});if(it)it.price=Number(v)||0;updSum();}
function renderCart(){const b=$('cb2');if(b)b.textContent=cart.length;const ci=$('ci');if(!ci)return;if(!cart.length){ci.innerHTML='<div class="em"><div class="ei">🛒</div><p style="font-size:.72rem">Add products</p></div>';const bs=$('bs2');const ba=$('ba');if(bs)bs.style.display='none';if(ba)ba.style.display='none';return;}ci.innerHTML=cart.map(function(it){const mg=it.price>0?(it.price-it.cost)*it.qty:null;return'<div class="ci"><div style="display:flex;align-items:center;gap:8px"><div class="pt" style="width:38px;height:38px;font-size:.9rem">'+emo2(it.cat)+'</div><div style="flex:1"><div style="font-size:.72rem;font-weight:600">'+it.name+'</div><div style="font-size:.56rem;color:var(--ink3)">'+it.cat+(it.colour?' · '+it.colour:'')+(it.size?' · '+it.size:'')+'</div></div><button onclick="remC(\''+it.id+'\')" style="background:none;border:none;color:var(--red);cursor:pointer;font-size:.85rem;padding:2px 5px">✕</button></div><div style="display:flex;gap:7px;align-items:center;margin-top:8px"><div class="qc"><button class="qb" onclick="updQ(\''+it.id+'\',-1)">−</button><span class="qn">'+it.qty+'</span><button class="qb" onclick="updQ(\''+it.id+'\',1)">+</button></div><input class="pi" type="number" placeholder="Sale Rs" value="'+(it.price||'')+'" oninput="updP(\''+it.id+'\',this.value)"><div style="font-size:.6rem;font-weight:700;padding:3px 7px;border-radius:5px;background:'+(mg===null?'var(--cream2)':mg>=0?'#E8F5E8':'#FDEAEA')+';color:'+(mg===null?'var(--ink3)':mg>=0?'var(--sage)':'var(--red)')+'">'+( mg===null?'—':fmt(mg))+'</div></div><div style="background:var(--cream2);border-radius:6px;padding:4px 9px;margin-top:6px;font-size:.58rem;color:var(--ink3)">Cost: <strong>'+fmt(it.cost)+'</strong> 🔒 Internal</div></div>';}).join('');updSum();}
function updSum(){const t=cart.reduce(function(s,c){return s+c.price*c.qty;},0);const cst=cart.reduce(function(s,c){return s+c.cost*c.qty;},0);const mg=t-cst;const bs=$('bs2');const ba=$('ba');if(!bs||!ba)return;if(!cart.length){bs.style.display='none';ba.style.display='none';return;}bs.style.display='block';bs.innerHTML='<div class="card" style="padding:12px"><div style="display:flex;justify-content:space-between;font-size:.72rem;margin-bottom:4px"><span>Total</span><span style="font-weight:700">'+fmt(t)+'</span></div><div style="display:flex;justify-content:space-between;font-size:.72rem;color:var(--sage);font-weight:600"><span>Margin</span><span>'+fmt(mg)+'</span></div></div>';ba.style.display='block';ba.innerHTML='<button class="btn bs" id="cb3" onclick="completeSale()" style="margin-bottom:8px">✅ Complete Sale</button><div class="g3"><button class="btn bh" onclick="oRet()">🔄 Return</button><button class="btn bh" onclick="oExchange()">🔁 Exchange</button><button class="btn bh" onclick="oExp()">💸 Expense</button></div>';}
async function completeSale(){
  if(!cart.length){toast('Cart empty','err');return;}
  const mp=cart.find(function(c){return!c.price||c.price<=0;});
  if(mp){toast('Enter price for: '+mp.name,'err');return;}
  for(let i=0;i<cart.length;i++){const it=cart[i];if(it.price<it.cost){if(!confirm('Price below cost for '+it.name+'. Loss! Continue?'))return;}}
  const cust=($('bc')?.value||'').trim()||'Walk-in Customer';
  if((payMode==='credit'||payMode==='split')&&cust==='Walk-in Customer'){toast('Enter customer name','err');$('bc')?.focus();return;}
  const btn=$('cb3');if(btn){btn.innerHTML='<div class="sp"></div>';btn.disabled=true;}
  const tot=cart.reduce(function(s,c){return s+c.price*c.qty;},0);
  const cst2=cart.reduce(function(s,c){return s+c.cost*c.qty;},0);
  const mg=tot-cst2;
  const bankId=$('bnk')?.value||null;const emId=$('em2')?.value||null;
  const splitCash=Number($('sc2')?.value||0);
  const ca=accs.find(function(a){return a.name==='Cash Drawer';});
  let custId=null;
  if(payMode==='credit'||payMode==='split'){
    let cp=parties.find(function(p){return p.name===cust&&p.party_type==='customer';});
    if(!cp){const{data:np}=await sb.from('parties').insert({party_type:'customer',name:cust,created_by:CUP?.id}).select().single();if(np){parties.push(np);cp=np;}}
    custId=cp?.id||null;
  }
  try{
    const{data:bn}=await sb.rpc('generate_transaction_no',{p_prefix:'BILL'});
    const{data:txn,error:te}=await sb.from('transactions').insert({transaction_no:bn,transaction_type:'sale',transaction_date:td(),party_id:custId,total_amount:tot,paid_amount:payMode==='credit'?0:tot,payment_status:payMode==='credit'?'credit':payMode==='split'?'partial':'paid',performed_by:CUP?.id}).select().single();
    if(te)throw te;
    const{data:sale,error:se}=await sb.from('sales').insert({transaction_id:txn.id,customer_party_id:custId,customer_name:cust,sale_date:td(),subtotal:tot,total_amount:tot,paid_amount:payMode==='credit'?0:payMode==='split'?splitCash:tot,payment_mode:payMode,primary_account_id:payMode==='cash'?ca?.id:payMode==='bank'?bankId:payMode==='emoney'?emId:ca?.id,gross_profit:mg}).select().single();
    if(se)throw se;
    const{error:ie}=await sb.from('sale_items').insert(cart.map(function(it){return{sale_id:sale.id,transaction_id:txn.id,variant_id:it.id,qty:it.qty,purchase_price:it.cost,sale_price:it.price};}));
    if(ie)throw ie;
    // ── POSTING ENGINE: guaranteed double-entry ──
    const accId2=payMode==='cash'?ca?.id:payMode==='bank'?bankId:payMode==='emoney'?emId:ca?.id;
    const{data:sp2}=await sb.rpc('post_transaction_ledger',{p_txn_id:txn.id,p_txn_type:'sale',p_payment_mode:payMode,p_total:tot,p_paid:payMode==='credit'?0:tot,p_party_id:custId,p_account_id:accId2,p_split_cash:splitCash,p_user_id:CUP?.id});
    if(!sp2?.posted)toast('⚠️ Ledger issue: '+(sp2?.error||'unknown'),'warn');
    // COGS entry
    await sb.from('ledger_entries').insert({transaction_id:txn.id,entry_date:td(),entry_type:'debit',account_category:'expense',amount:cst2,description:'COGS '+bn,created_by:CUP?.id});
    await loadData();
    toast('Done: '+bn+' | '+fmt(tot)+' | Margin: '+fmt(mg),'ok',5000);
    cart=[];if($('bc'))$('bc').value='';renderCart();srch();
  }catch(e){toast('Error: '+e.message,'err');}
  if(btn){btn.innerHTML='✅ Complete Sale';btn.disabled=false;}
}
function pickP(t){const list=parties.filter(function(p){return p.party_type===t;});if(!list.length){toast('No '+t+' found','warn');return;}omo('Select '+t,list.map(function(p){return'<div class="pc" onclick="selP(\''+p.name.replace(/'/g,"\\'")+"','"+t+'\')">'+p.name+(p.current_balance?' <span style="font-size:.6rem;color:var(--gold)">'+fmt(Math.abs(p.current_balance))+'</span>':'')+'</div>';}).join(''));}
function selP(n,t){const inp=t==='customer'?$('bc'):$('ps2');if(inp)inp.value=n;cmo();onCI();}
function newPM(t){omo('New '+t,'<div class="fg"><label class="lb">Name</label><input class="ip" id="np-n" placeholder="Full name"></div><div class="fg"><label class="lb">Phone</label><input class="ip" id="np-p" placeholder="03XX"></div><div class="fg"><label class="lb">Opening Balance Rs</label><input class="ip" id="np-b" type="number" placeholder="0"></div><button class="btn bi" onclick="saveNP(\''+t+'\')">Create</button>');}
async function saveNP(t){const n=$('np-n')?.value?.trim();if(!n){toast('Enter name','err');return;}const{data:p,error}=await sb.from('parties').insert({party_type:t,name:n,phone:$('np-p')?.value||'',opening_balance:Number($('np-b')?.value||0),current_balance:Number($('np-b')?.value||0),created_by:CUP?.id}).select().single();if(error){toast('Error: '+error.message,'err');return;}parties.push(p);if(t==='customer'&&$('bc'))$('bc').value=n;if(t==='supplier'&&$('ps2'))$('ps2').value=n;cmo();toast('Created: '+n,'ok');}
function oRet(){omo('Return',returnHTML());}
function returnHTML(){return'<div class="fg"><label class="lb">Bill No</label><input class="ip" id="sr-b" placeholder="BILL-0001"></div><div class="fg"><label class="lb">Product</label><select class="sl" id="sr-s"><option value="">Select...</option>'+prods.map(function(p){return'<option value="'+p.id+'">'+p.name+' ('+p.sku+')</option>';}).join('')+'</select></div><div class="g2"><div class="fg"><label class="lb">Qty</label><input class="ip" id="sr-q" type="number" placeholder="0"></div><div class="fg"><label class="lb">Price Rs</label><input class="ip" id="sr-p" type="number" placeholder="0"></div></div><div class="fg"><label class="lb">Reason</label><input class="ip" id="sr-r" placeholder="Defective..."></div><button class="btn bi" onclick="processReturn()">Process Return</button>';}
async function processReturn(){const bn=$('sr-b')?.value?.trim();const vid=$('sr-s')?.value;const qty=Number($('sr-q')?.value||0);const pr=Number($('sr-p')?.value||0);const rsn=$('sr-r')?.value||'';if(!bn||!vid||!qty||!pr){toast('Fill all fields','err');return;}const{data:ot}=await sb.from('transactions').select('id').eq('transaction_no',bn).single();if(!ot){toast('Bill not found','err');return;}const{data:rn}=await sb.rpc('generate_transaction_no',{p_prefix:'RET'});const ca=accs.find(function(a){return a.name==='Cash Drawer';});const ra=qty*pr;try{const{data:txn}=await sb.from('transactions').insert({transaction_no:rn,transaction_type:'sale_return',transaction_date:td(),total_amount:ra,paid_amount:ra,payment_status:'paid',reference_transaction_id:ot.id,performed_by:CUP?.id,notes:rsn}).select().single();const{data:ret}=await sb.from('sale_returns').insert({transaction_id:txn.id,original_sale_transaction_id:ot.id,return_date:td(),return_type:'refund',total_return_amount:ra,refund_mode:'cash',refund_account_id:ca?.id,reason:rsn}).select().single();await sb.from('sale_return_items').insert({sale_return_id:ret.id,variant_id:vid,qty,original_sale_price:pr});await loadData();toast('Return done: '+rn,'ok');cmo();}catch(e){toast('Error: '+e.message,'err');}}
function oExp(){const cats=['Daily Operating Expenses','Rent Expense','Utility Expenses','Committee Savings 1','Committee Savings 2','Shopping Bag Expenses','Security Guard Expenses','Sweeper Expenses','Battery Expenses','Miscellaneous Expenses'];omo('Expense','<div class="fg"><label class="lb">Category</label><select class="sl" id="ec">'+cats.map(function(c){return'<option>'+c+'</option>';}).join('')+'</select></div><div class="fg"><label class="lb">Description</label><input class="ip" id="ed" placeholder="Details"></div><div class="fg"><label class="lb">Amount Rs</label><input class="ip" id="ea" type="number" placeholder="0"></div><div class="fg"><label class="lb">Paid From</label><select class="sl" id="es">'+accs.map(function(a){return'<option value="'+a.id+'">'+a.name+' ('+fmt(a.current_balance)+')</option>';}).join('')+'</select></div><button class="btn br" onclick="saveExp()">Save Expense</button>');}
async function saveExp(){const cat=$('ec')?.value;const desc=$('ed')?.value?.trim();const amt=Number($('ea')?.value||0);const src=$('es')?.value;if(!amt||!desc){toast('Fill all','err');return;}const{data:ec}=await sb.from('expense_categories').select('id').eq('name',cat).maybeSingle();const{data:en}=await sb.rpc('generate_transaction_no',{p_prefix:'EXP'});try{const{data:t}=await sb.from('transactions').insert({transaction_no:en,transaction_type:'expense',transaction_date:td(),total_amount:amt,paid_amount:amt,payment_status:'paid',performed_by:CUP?.id,notes:desc}).select().single();if(ec?.id)await sb.from('cash_entries').insert({transaction_id:t.id,category_id:ec.id,entry_date:td(),amount:amt,direction:'out',account_id:src,description:desc});await sb.from('ledger_entries').insert({transaction_id:t.id,entry_date:td(),entry_type:'debit',account_category:'cashflow',cashflow_account_id:src,amount:amt,description:'Expense: '+desc,created_by:CUP?.id});toast('Expense saved: '+fmt(amt),'ok');cmo();await loadData();}catch(e){toast('Error: '+e.message,'err');}}

// INVENTORY
function rInv(){const ac=prods.filter(function(p){return(p.stock||0)>0;});const tv=ac.reduce(function(s,p){return s+p.cost*(p.stock||0);},0);return(CUP?.role==='owner'?'<button class="btn bi" style="margin-bottom:10px" onclick="openStockTake()">🔍 Physical Verification</button>':'')+'<div class="sg"><div class="sc"><div class="sl2">Active SKUs</div><div class="sv">'+ac.length+'</div></div><div class="sc go"><div class="sl2">Stock Value</div><div class="sv">'+fmt(tv)+'</div></div><div class="sc rd"><div class="sl2">Low Stock</div><div class="sv">'+ac.filter(function(p){return p.stock<=2;}).length+'</div></div><div class="sc" style="border-left-color:var(--red)"><div class="sl2">Dead Stock</div><div class="sv">'+ac.filter(function(p){return p.age>=90;}).length+'</div></div></div><div class="fg"><input class="ip" id="is" placeholder="Search..." oninput="iInv()"></div><div id="il"></div>';}
function iInv(){const q=($('is')?.value||'').toLowerCase();const c=$('il');if(!c)return;let p=prods.filter(function(p){return(p.stock||0)>0&&(!q||p.name.toLowerCase().includes(q)||p.sku.toLowerCase().includes(q));});if(!p.length){c.innerHTML='<div class="em"><div class="ei">📦</div><p style="font-size:.72rem">No items</p></div>';return;}const cats={};p.forEach(function(pr){if(!cats[pr.cat])cats[pr.cat]={items:[],qty:0,val:0};cats[pr.cat].items.push(pr);cats[pr.cat].qty+=pr.stock||0;cats[pr.cat].val+=(pr.stock||0)*pr.cost;});const tv2=p.reduce(function(s,pr){return s+(pr.stock||0)*pr.cost;},0);c.innerHTML=Object.entries(cats).map(function(e){const cat=e[0];const d=e[1];return'<div style="margin-bottom:14px"><div class="rh"><div>'+emo2(cat)+' '+cat+'</div><div>'+d.qty+' pcs · '+fmt(d.val)+'</div></div><div style="border:1px solid #E8D8C0;border-top:none;border-radius:0 0 9px 9px"><div class="ih"><div>Item</div><div style="text-align:center">Qty</div><div style="text-align:right">Age</div><div style="text-align:right">Value</div></div>'+d.items.map(function(pr){return'<div class="ir"><div><div style="font-size:.7rem;font-weight:600">'+pr.name+'</div><div style="font-size:.55rem;color:var(--ink3)">'+( pr.colour||'')+(pr.size?' · '+pr.size:'')+'</div><div style="font-family:monospace;font-size:.5rem;color:var(--ink3)">'+pr.sku+'</div></div><div style="text-align:center"><span style="font-size:.85rem;font-weight:700;color:'+(pr.stock<=2?'var(--red)':'var(--sage)')+'">'+pr.stock+'</span>'+(pr.stock<=2?'<div style="font-size:.48rem;color:var(--red)">LOW</div>':'')+'</div><div style="text-align:right;font-size:.58rem;font-weight:700;color:'+(pr.age>=90?'var(--red)':pr.age>=60?'var(--gold)':pr.age>=30?'#7A6000':'var(--sage)')+'">'+pr.age+'d</div><div style="text-align:right;font-size:.68rem;font-weight:600">'+fmt((pr.stock||0)*pr.cost)+'</div></div>';}).join('')+'<div class="if"><div style="font-size:.63rem;font-weight:700;color:var(--ink2)">Total</div><div style="text-align:center;font-size:.7rem;font-weight:700;color:var(--ink2)">'+d.qty+'</div><div></div><div style="text-align:right;font-size:.7rem;font-weight:700;color:var(--ink2)">'+fmt(d.val)+'</div></div></div></div>';}).join('')+'<div style="background:var(--ink);color:white;border-radius:9px;padding:11px 13px;display:grid;grid-template-columns:1.8fr .6fr .8fr .8fr"><div style="font-size:.72rem;font-weight:700">TOTAL</div><div style="text-align:center;font-size:.72rem;font-weight:700">'+p.reduce(function(s,pr){return s+(pr.stock||0);},0)+'</div><div></div><div style="text-align:right;font-size:.72rem;font-weight:700">'+fmt(tv2)+'</div></div>';}

// PURCHASE
function rBuy(){return'<div class="card"><div class="ct">New Purchase</div><div class="fg"><label class="lb">Product Name</label><input class="ip" id="pn" placeholder="e.g. Lawn 3PC"></div><div class="g2"><div class="fg"><label class="lb">Category</label><select class="sl" id="pc2" onchange="updSKU()"><option value="">Select...</option>'+CATS.map(function(c){return'<option>'+c+'</option>';}).join('')+'</select></div><div class="fg"><label class="lb">Size</label><input class="ip" id="pz" placeholder="M/L/XL" oninput="updSKU()"></div></div><div class="fg"><label class="lb">Colour</label><input class="ip" id="pcl" placeholder="Navy Blue..." oninput="updSKU()"></div><div class="sku-prev"><div style="font-size:.55rem;color:var(--ink3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px">SKU Preview</div><div class="sku-code" id="sku">Select category...</div></div><div class="g2"><div class="fg"><label class="lb">Qty</label><input class="ip" id="pq" type="number" placeholder="0"></div><div class="fg"><label class="lb">Cost Rs</label><input class="ip" id="pcs" type="number" placeholder="0"></div></div><div class="fg"><label class="lb">Supplier</label><div style="display:flex;gap:6px"><input class="ip" id="ps2" placeholder="Supplier name" style="flex:1"><button class="btn bh bsm" onclick="pickP(\'supplier\')">📋</button><button class="btn bh bsm" onclick="newPM(\'supplier\')">➕</button></div></div><div class="ib">Sale price negotiated at billing — not entered here.</div><div class="fg"><label class="lb">Payment</label><div class="pr" id="ppm"><div class="pl on" onclick="setPurPM(\'cash\',this)">💵 Cash</div><div class="pl" onclick="setPurPM(\'credit\',this)">📋 Credit</div><div class="pl" onclick="setPurPM(\'partial\',this)">⚡ Partial</div><div class="pl" onclick="setPurPM(\'owner\',this)">👑 Owner</div></div></div><div id="ppd"></div><div id="pprev" style="display:none;background:#FDF5E4;border:1.5px solid var(--gold);border-radius:9px;padding:10px 12px;margin-bottom:12px"></div><button class="btn bg" onclick="savePur()">✅ Save Purchase</button></div>';}
function updSKU(){const cat=$('pc2')?.value||'';const cl=$('pcl')?.value||'';const sz=$('pz')?.value||'';const sk=$('sku');if(!sk)return;if(!cat){sk.textContent='Select category...';return;}sk.textContent=(CCOD[cat]||cat.substring(0,3).toUpperCase())+'-'+colCode(cl)+'-'+szCode(sz)+'-###';}
function setPurPM(m,el){purPayMode=m;document.querySelectorAll('#ppm .pl').forEach(function(p){p.classList.remove('on');});el.classList.add('on');const d=$('ppd');if(!d)return;const ca=accs.find(function(a){return a.name==='Cash Drawer';});if(m==='cash')d.innerHTML='<div class="ib">Cash: '+fmt(ca?.current_balance||0)+'</div>';else if(m==='credit')d.innerHTML='<div class="ib" style="border-color:var(--gold)">Posted to Supplier Payable</div>';else if(m==='partial')d.innerHTML='<div class="fg"><label class="lb">Paid Now Rs</label><input class="ip" id="ppd2" type="number" placeholder="0" oninput="updPP()"></div>';else if(m==='owner')d.innerHTML='<div class="ib">Posted to Owner Payable</div>';updPP();}
function updPP(){const q=Number($('pq')?.value||0);const c=Number($('pcs')?.value||0);const t=q*c;const pd=purPayMode==='partial'?Number($('ppd2')?.value||0):purPayMode==='cash'?t:0;const pay=Math.max(0,t-pd);const p=$('pprev');if(!p)return;if(t>0){p.style.display='block';p.innerHTML='<div style="display:flex;justify-content:space-between;font-size:.72rem;margin-bottom:4px"><span>Total</span><span style="font-weight:700">'+fmt(t)+'</span></div><div style="display:flex;justify-content:space-between;font-size:.72rem;color:var(--sage)"><span>Paid</span><span>'+fmt(pd)+'</span></div><div style="display:flex;justify-content:space-between;font-size:.75rem;font-weight:700;border-top:1px dashed var(--border);padding-top:6px;margin-top:5px;color:var(--red)"><span>Payable</span><span>'+fmt(pay)+'</span></div>';}else p.style.display='none';}
async function savePur(){
  const nm=$('pn')?.value?.trim();const cat=$('pc2')?.value;const qty=Number($('pq')?.value||0);const cst=Number($('pcs')?.value||0);const sup=$('ps2')?.value?.trim()||'';
  if(!nm||!cat||!qty||!cst){toast('Fill Name, Category, Qty, Cost','err');return;}
  // ── STEP 1: Supplier Ledger Validation ──
  if(purPayMode!=='owner'&&!sup){toast('Enter supplier name','err');$('ps2')?.focus();return;}
  const tot=qty*cst;
  // ── STEP 2: Validate/Create Supplier ──
  if(purPayMode!=='owner'&&sup){
    let sp=parties.find(function(p){return p.name===sup&&p.party_type==='supplier';});
    if(!sp){
      const ok=confirm('Supplier "'+sup+'" not found.\nCreate new supplier ledger?');
      if(!ok){toast('Supplier ledger required','err');return;}
    }
  }
  // ── STEP 3: Validate Owner Account ──
  if(purPayMode==='owner'){
    const ownerParty=parties.find(function(p){return p.name==='Owner Account'||p.party_type==='owner';});
    if(!ownerParty){
      const ok=confirm('Owner ledger not found.\nCreate Owner Account ledger?');
      if(!ok){toast('Owner ledger required','err');return;}
      const{data:np,error:ne}=await sb.from('parties').insert({party_type:'owner',name:'Owner Account',opening_balance:0,current_balance:0,created_by:CUP?.id}).select().single();
      if(ne){toast('Error creating owner ledger: '+ne.message,'err');return;}
      parties.push(np);toast('Owner ledger created','ok');
    }
  }
  const catCode=CCOD[cat]||cat.substring(0,3).toUpperCase();
  const cl=$('pcl')?.value?.trim()||'';const sz=$('pz')?.value?.trim()||'';
  const clC=colCode(cl);const szC=szCode(sz);const prefix=catCode+'-'+clC+'-'+szC;
  const{data:purNo}=await sb.rpc('generate_transaction_no',{p_prefix:'PUR'});
  let sp=parties.find(function(p){return p.name===sup&&p.party_type==='supplier';});
  if(!sp){const{data:ns}=await sb.from('parties').insert({party_type:'supplier',name:sup,created_by:CUP?.id}).select().single();if(ns){parties.push(ns);sp=ns;}}
  const{data:cr}=await sb.from('categories').select('id').eq('name',cat).single();
  const ca=accs.find(function(a){return a.name==='Cash Drawer';});
  let pd=0,pybl=0,payAccId=null;
  if(purPayMode==='cash'){pd=tot;payAccId=ca?.id;const bal=ca?.current_balance||0;if(bal<tot){const ok=confirm('⚠️ Insufficient Cash!\nCash Drawer: '+fmt(bal)+'\nRequired: '+fmt(tot)+'\nShortfall: '+fmt(tot-bal)+'\n\nContinue anyway?');if(!ok){toast('Purchase cancelled — insufficient cash','warn');return;}}}
  else if(purPayMode==='credit'){pybl=tot;}
  else if(purPayMode==='partial'){pd=Number($('ppd2')?.value||0);pybl=Math.max(0,tot-pd);payAccId=ca?.id;}
  else if(purPayMode==='owner'){pybl=tot;}
  try{
    const{data:prod}=await sb.from('products').insert({name:nm,category_id:cr?.id,created_by:CUP?.id}).select().single();
    const{data:skuN}=await sb.rpc('generate_transaction_no',{p_prefix:prefix});
    const{data:variant}=await sb.from('product_variants').insert({product_id:prod.id,sku:skuN,colour:cl,colour_code:clC,size:sz,size_code:szC,purchase_price:cst,created_by:CUP?.id}).select().single();
    const{data:txn}=await sb.from('transactions').insert({transaction_no:purNo,transaction_type:'purchase',transaction_date:td(),party_id:sp?.id,total_amount:tot,paid_amount:pd,payment_status:purPayMode==='credit'?'credit':purPayMode==='partial'?'partial':'paid',performed_by:CUP?.id}).select().single();
    const{data:pur}=await sb.from('purchases').insert({transaction_id:txn.id,supplier_party_id:sp?.id,purchase_date:td(),total_amount:tot,paid_amount:pd,payment_mode:purPayMode,payment_source_account_id:payAccId}).select().single();
    await sb.from('purchase_items').insert({purchase_id:pur.id,transaction_id:txn.id,variant_id:variant.id,qty,purchase_price:cst});
    // ── POSTING ENGINE: guaranteed double-entry ──
    const ownerP=parties.find(function(p){return p.party_type==='owner';});
    const postPartyId=purPayMode==='credit'||purPayMode==='partial'?sp?.id:purPayMode==='owner'?ownerP?.id:null;
    const{data:pr}=await sb.rpc('post_transaction_ledger',{p_txn_id:txn.id,p_txn_type:'purchase',p_payment_mode:purPayMode,p_total:tot,p_paid:pd,p_party_id:postPartyId,p_account_id:payAccId,p_user_id:CUP?.id});
    if(!pr?.posted)toast('⚠️ Ledger posting issue: '+(pr?.error||'unknown'),'warn');
    await loadData();
    toast('SKU: '+skuN+' | Stock: '+qty+(pybl>0?' | Payable: '+fmt(pybl):''),'ok',6000);
    ['pn','pz','pcl','pq','pcs','ps2'].forEach(function(id){const e=$(id);if(e)e.value='';});
    if($('pc2'))$('pc2').value='';if($('sku'))$('sku').textContent='Select category...';if($('pprev'))$('pprev').style.display='none';
  }catch(e){toast('Error: '+e.message,'err');}
}

async function rStock(c){const{data:inv}=await sb.rpc('get_inventory_report');const tv=(inv||[]).reduce(function(s,p){return s+Number(p.stock_value||0);},0);c.innerHTML='<div class="sg"><div class="sc"><div class="sl2">SKUs</div><div class="sv">'+( inv||[]).length+'</div></div><div class="sc go"><div class="sl2">Value</div><div class="sv">'+fmt(tv)+'</div></div></div><div style="border:1px solid #E8D8C0;border-radius:9px;overflow:hidden">'+(inv||[]).map(function(p){return'<div class="rr"><span><div style="font-size:.72rem;font-weight:600">'+( p.product_name||'')+'</div><div style="font-size:.58rem;color:var(--ink3)">'+( p.sku||'')+' · '+(p.age_days||0)+'d</div></span><span style="text-align:right"><div style="font-size:.72rem;font-weight:700;color:'+(p.qty_available<=2?'var(--red)':'var(--sage)')+'">'+( p.qty_available||0)+'</div><div style="font-size:.58rem;color:var(--ink3)">'+fmt(p.stock_value||0)+'</div></span></div>';}).join('')+'<div class="rf"><span>Total Value</span><span>'+fmt(tv)+'</span></div></div>';}
async function rPL(f,t,c){const{data:s}=await sb.from('sales').select('total_amount,gross_profit').gte('sale_date',f).lte('sale_date',t);const{data:e}=await sb.from('cash_entries').select('amount').gte('entry_date',f).lte('entry_date',t).eq('direction','out');const rev=(s||[]).reduce(function(s,t){return s+Number(t.total_amount||0);},0);const gp=(s||[]).reduce(function(s,t){return s+Number(t.gross_profit||0);},0);const exp=(e||[]).reduce(function(s,t){return s+Number(t.amount||0);},0);const np=gp-exp;c.innerHTML='<div style="margin-bottom:14px"><div class="rh"><div>P&L: '+f+' to '+t+'</div></div><div class="rr"><span>Revenue</span><span style="font-weight:700">'+fmt(rev)+'</span></div><div class="rr"><span style="color:var(--red)">- Cost of Goods</span><span style="color:var(--red)">- '+fmt(rev-gp)+'</span></div><div class="rr" style="background:var(--cream2)"><span style="font-weight:700;color:var(--sage)">Gross Profit</span><span style="font-weight:700;color:var(--sage)">'+fmt(gp)+'</span></div><div class="rr"><span style="color:var(--red)">- Expenses</span><span style="color:var(--red)">- '+fmt(exp)+'</span></div><div class="rf" style="color:'+(np>=0?'var(--sage)':'var(--red)')+'"><span>Net Profit</span><span>'+fmt(np)+'</span></div></div><div class="sg"><div class="sc sg2"><div class="sl2">Gross %</div><div class="sv">'+(rev>0?((gp/rev)*100).toFixed(1):0)+'%</div></div><div class="sc '+(np>=0?'sg2':'rd')+'"><div class="sl2">Net %</div><div class="sv">'+(rev>0?((np/rev)*100).toFixed(1):0)+'%</div></div></div>';}
function rLedRep(c){const cr=parties.filter(function(p){return p.party_type==='customer'&&p.current_balance>0;});const sp2=parties.filter(function(p){return p.party_type==='supplier'&&p.current_balance>0;});c.innerHTML='<div class="sg"><div class="sc" style="border-left-color:var(--red)"><div class="sl2">Receivables</div><div class="sv">'+fmt(cr.reduce(function(s,p){return s+p.current_balance;},0))+'</div></div><div class="sc rd"><div class="sl2">Payables</div><div class="sv">'+fmt(sp2.reduce(function(s,p){return s+p.current_balance;},0))+'</div></div></div><div style="margin-bottom:14px"><div class="rh"><div>Customer Outstanding</div></div>'+cr.map(function(p){return'<div class="rr"><span>'+p.name+'</span><span style="font-weight:700;color:var(--red)">'+fmt(p.current_balance)+'</span></div>';}).join('')+'<div class="rf"><span>Total</span><span>'+fmt(cr.reduce(function(s,p){return s+p.current_balance;},0))+'</span></div></div><div style="margin-bottom:14px"><div class="rh"><div>Supplier Payables</div></div>'+sp2.map(function(p){return'<div class="rr"><span>'+p.name+'</span><span style="font-weight:700;color:var(--red)">'+fmt(p.current_balance)+'</span></div>';}).join('')+'<div class="rf"><span>Total</span><span>'+fmt(sp2.reduce(function(s,p){return s+p.current_balance;},0))+'</span></div></div>';}

// CASH
function rCash(){const ca=accs.find(function(a){return a.name==='Cash Drawer';});return'<div style="background:var(--ink);color:white;border-radius:16px;padding:16px;margin-bottom:14px"><div style="font-size:.58rem;text-transform:uppercase;letter-spacing:.12em;opacity:.5">Cash Balance</div><div style="font-size:2rem;font-weight:700;margin:5px 0">'+fmt(ca?.current_balance||0)+'</div><div style="display:flex;gap:12px;flex-wrap:wrap">'+accs.map(function(a){return'<div><div style="font-size:.55rem;opacity:.5">'+a.name+'</div><div style="font-size:.72rem;font-weight:600;color:'+(a.current_balance>=0?'#90EE90':'#FFB3B3')+'">'+fmt(a.current_balance)+'</div></div>';}).join('')+'</div></div><div class="card"><div class="ct">New Entry</div><div class="fg"><label class="lb">Date</label><input class="ip" id="cd" type="date" value="'+td()+'"></div><div class="fg"><label class="lb">Category</label><select class="sl" id="cc"></select></div><div class="fg"><label class="lb">Description</label><input class="ip" id="cdsc" placeholder="Details"></div><div class="fg"><label class="lb">Direction</label><select class="sl" id="cdr"><option value="out">Money Out</option><option value="in">Money In</option></select></div><div class="fg"><label class="lb">Amount Rs</label><input class="ip" id="camt" type="number" placeholder="0"></div><div class="fg"><label class="lb">Account</label><select class="sl" id="cacc">'+accs.map(function(a){return'<option value="'+a.id+'">'+a.name+' ('+fmt(a.current_balance)+')</option>';}).join('')+'</select></div><button class="btn bi" onclick="saveCash()">Save</button></div><div class="ct" style="margin-top:4px">Recent</div><div id="cl"></div>';}
async function iCash(){const{data:cats}=await sb.from('expense_categories').select('*').order('sort_order');const sel=$('cc');if(sel&&cats)sel.innerHTML=cats.map(function(c){return'<option value="'+c.id+'">'+c.name+'</option>';}).join('');loadCash();}
async function saveCash(){
  const dt=$('cd')?.value||td();const catId=$('cc')?.value;const dsc=$('cdsc')?.value?.trim();
  const amt=Number($('camt')?.value||0);const dir=$('cdr')?.value||'out';const accId=$('cacc')?.value;
  const partyName=($('cpty')?.value||'').trim();
  if(!amt||!dsc){toast('Fill description and amount','err');return;}
  let partyId=null;
  if(partyName){
    const ptype=dir==='in'?'customer':'supplier';
    let p=parties.find(function(p){return p.name===partyName;});
    if(!p){const{data:np}=await sb.from('parties').insert({party_type:ptype,name:partyName,created_by:CUP?.id}).select().single();if(np){parties.push(np);p=np;}}
    partyId=p?.id||null;
  }
  const{data:no}=await sb.rpc('generate_transaction_no',{p_prefix:'CASH'});
  try{
    const{data:t}=await sb.from('transactions').insert({transaction_no:no,transaction_type:dir==='in'?'receipt':'expense',transaction_date:dt,party_id:partyId,total_amount:amt,paid_amount:amt,payment_status:'paid',performed_by:CUP?.id,notes:dsc}).select().single();
    if(catId)await sb.from('cash_entries').insert({transaction_id:t.id,category_id:catId,entry_date:dt,amount:amt,direction:dir,account_id:accId,description:dsc});
    // Posting engine for guaranteed ledger entry
    await sb.rpc('post_transaction_ledger',{p_txn_id:t.id,p_txn_type:dir==='in'?'receipt':'expense',p_payment_mode:'cash',p_total:amt,p_paid:amt,p_party_id:partyId,p_account_id:accId,p_user_id:CUP?.id});
    // If party linked, also post to party ledger
    if(partyId){
      await sb.from('ledger_entries').insert({transaction_id:t.id,entry_date:dt,entry_type:dir==='in'?'credit':'debit',account_category:'party',party_id:partyId,amount:amt,description:dsc,created_by:CUP?.id});
    }
    toast((dir==='in'?'Receipt':'Payment')+': '+fmt(amt),'ok');
    if($('cdsc'))$('cdsc').value='';if($('camt'))$('camt').value='';if($('cpty'))$('cpty').value='';
    await loadData();iCash();
  }catch(e){toast('Error: '+e.message,'err');}
}
async function loadCash(){const c=$('cl');if(!c)return;const{data:e}=await sb.from('ledger_entries').select('*').eq('account_category','cashflow').order('created_at',{ascending:false}).limit(20);if(!(e||[]).length){c.innerHTML='<div class="em"><div class="ei">💵</div><p style="font-size:.72rem">No entries</p></div>';return;}c.innerHTML=(e||[]).map(function(en){return'<div class="card" style="padding:10px 12px;margin-bottom:8px"><div style="display:flex;justify-content:space-between"><div><div style="font-size:.72rem;font-weight:600">'+( en.description||'')+'</div><div style="font-size:.58rem;color:var(--ink3)">'+( en.entry_date||'')+'</div></div><div style="text-align:right">'+( en.credit>0?'<div style="font-size:.72rem;font-weight:700;color:var(--sage)">+'+fmt(en.credit)+'</div>':'')+( en.debit>0?'<div style="font-size:.72rem;font-weight:700;color:var(--red)">-'+fmt(en.debit)+'</div>':'')+'</div></div></div>';}).join('');}

function pickCashParty(){
  if(!parties.length){toast('No parties found','warn');return;}
  window._cashPties=parties;
  var h='';
  for(var i=0;i<parties.length;i++){
    h+='<div class="pc" onclick="selCashP('+i+')">'+parties[i].name+' <span style="font-size:.58rem;color:var(--ink3)">'+parties[i].party_type+'</span></div>';
  }
  omo('Select Party',h);
}
function selCashP(i){
  var p=window._cashPties[i];
  if(p&&$('cpty'))$('cpty').value=p.name;
  cmo();
}

function oExchange(){
  var h='';
  h+='<p style="font-size:.72rem;margin-bottom:10px">Exchange an old item for a new one.</p>';
  h+='<div class="fg"><label class="lb">Customer</label><input class="ip" id="ex-c" placeholder="Customer name"></div>';
  h+='<div class="fg"><label class="lb">Item Returned (old)</label><select class="sl" id="ex-ri"><option value="">Select...</option>';
  for(var i=0;i<prods.length;i++)h+='<option value="'+prods[i].id+'">'+prods[i].name+' ('+prods[i].sku+')</option>';
  h+='</select></div>';
  h+='<div class="g2"><div class="fg"><label class="lb">Qty</label><input class="ip" id="ex-rq" type="number" value="1"></div>';
  h+='<div class="fg"><label class="lb">Return Price</label><input class="ip" id="ex-rp" type="number" placeholder="0" oninput="calcDiff()"></div></div>';
  h+='<div class="fg"><label class="lb">Item Issued (new)</label><select class="sl" id="ex-ii"><option value="">Select...</option>';
  for(var i=0;i<prods.length;i++){if((prods[i].stock||0)>0)h+='<option value="'+prods[i].id+'">'+prods[i].name+' ('+prods[i].sku+') Qty:'+prods[i].stock+'</option>';}
  h+='</select></div>';
  h+='<div class="g2"><div class="fg"><label class="lb">Qty</label><input class="ip" id="ex-iq" type="number" value="1"></div>';
  h+='<div class="fg"><label class="lb">Issue Price</label><input class="ip" id="ex-ip" type="number" placeholder="0" oninput="calcDiff()"></div></div>';
  h+='<div id="ex-diff" class="ib" style="display:none;margin-top:8px"></div>';
  h+='<div class="fg"><label class="lb">Difference</label><select class="sl" id="ex-dm"><option value="cash_in">Customer Pays</option><option value="cash_out">Refund</option><option value="none">None</option></select></div>';
  h+='<button class="btn bs" onclick="saveExchange()">Process Exchange</button>';
  omo('Exchange',h);
}

function calcDiff(){
  var rp=Number($('ex-rp')&&$('ex-rp').value||0);
  var ip=Number($('ex-ip')&&$('ex-ip').value||0);
  var diff=ip-rp;
  var d=$('ex-diff');
  if(d&&(rp||ip)){
    d.style.display='block';
    d.textContent=diff>0?'Customer pays extra: '+fmt(diff):diff<0?'Refund: '+fmt(Math.abs(diff)):'No difference';
  }
}

async function saveExchange(){
  var cust=($('ex-c')&&$('ex-c').value||'Walk-in');
  var riId=$('ex-ri')&&$('ex-ri').value;
  var rq=Number($('ex-rq')&&$('ex-rq').value||1);
  var rp=Number($('ex-rp')&&$('ex-rp').value||0);
  var iiId=$('ex-ii')&&$('ex-ii').value;
  var iq=Number($('ex-iq')&&$('ex-iq').value||1);
  var ip=Number($('ex-ip')&&$('ex-ip').value||0);
  var dm=$('ex-dm')&&$('ex-dm').value||'none';
  if(!riId||!iiId){toast('Select both items','err');return;}
  var diff=ip-rp;
  var ca=accs.find(function(a){return a.name==='Cash Drawer';});
  var{data:exNo}=await sb.rpc('generate_transaction_no',{p_prefix:'EXC'});
  try{
    var{data:txn}=await sb.from('transactions').insert({transaction_no:exNo,transaction_type:'sale',transaction_date:td(),total_amount:Math.max(ip,0),paid_amount:Math.max(ip,0),payment_status:'paid',performed_by:CUP&&CUP.id}).select().single();
    var retP=prods.find(function(p){return p.id===riId;});
    var issP=prods.find(function(p){return p.id===iiId;});
    if(retP)await sb.from('inventory').update({qty_available:(retP.stock||0)+rq}).eq('variant_id',riId);
    if(issP)await sb.from('inventory').update({qty_available:Math.max(0,(issP.stock||0)-iq)}).eq('variant_id',iiId);
    if(Math.abs(diff)>0&&ca){
      if(dm==='cash_in')await sb.from('ledger_entries').insert({transaction_id:txn.id,entry_date:td(),entry_type:'credit',account_category:'cashflow',cashflow_account_id:ca.id,amount:diff,description:'Exchange diff: '+exNo,created_by:CUP&&CUP.id});
      else if(dm==='cash_out')await sb.from('ledger_entries').insert({transaction_id:txn.id,entry_date:td(),entry_type:'debit',account_category:'cashflow',cashflow_account_id:ca.id,amount:Math.abs(diff),description:'Exchange refund: '+exNo,created_by:CUP&&CUP.id});
    }
    await loadData();cmo();toast('Exchange done: '+exNo,'ok',5000);srch();
  }catch(e){toast('Error: '+e.message,'err');}
}

function openStockTake(){
  var ps=prods.filter(function(p){return(p.stock||0)>0;});
  var h='<div class="ib">Enter actual physical count per item.</div>';
  for(var i=0;i<ps.length;i++){
    h+='<div style="display:grid;grid-template-columns:1fr 65px 35px;gap:7px;align-items:center;padding:7px 0;border-bottom:1px solid var(--cream2)">';
    h+='<div><div style="font-size:.7rem;font-weight:600">'+ps[i].name+'</div>';
    h+='<div style="font-size:.55rem;color:var(--ink3)">'+ps[i].sku+' Book: '+ps[i].stock+'</div></div>';
    h+='<input type="number" id="st-'+i+'" placeholder="Count" style="border:1.5px solid var(--border);border-radius:7px;padding:5px 7px;font-size:.78rem;text-align:center;width:100%" oninput="chkD('+i+')">';
    h+='<div id="sd-'+i+'" style="font-size:.68rem;font-weight:700;text-align:right"></div>';
    h+='</div>';
  }
  h+='<button class="btn bi" style="margin-top:12px;width:100%" onclick="saveStockTake()">Save Report</button>';
  window._stProds=ps;
  omo('Physical Verification',h);
}

function chkD(i){
  var inp=$('st-'+i);var d=$('sd-'+i);
  if(!inp||!d)return;
  var ph=Number(inp.value);
  var bk=(window._stProds[i]&&window._stProds[i].stock)||0;
  if(inp.value===''){d.textContent='';return;}
  var df=ph-bk;
  d.textContent=df===0?'OK':(df>0?'+'+df:''+df);
  d.style.color=df===0?'var(--sage)':'var(--red)';
}

async function saveStockTake(){
  var ps=window._stProds||[];
  var adj=0;
  for(var i=0;i<ps.length;i++){
    var inp=$('st-'+i);
    if(!inp||inp.value==='')continue;
    var ph=Number(inp.value);
    if(ph===(ps[i].stock||0))continue;
    await sb.from('inventory').update({qty_available:ph}).eq('variant_id',ps[i].id);
    adj++;
  }
  cmo();await loadData();iInv();
  toast(adj+' items adjusted','ok');
}

</script>
