<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SL Collection POS</title>
<style>
:root{--br:#5C2E0E;--br2:#7A3D18;--cr:#FAF6F0;--cr2:#F2EAE0;--cr3:#E8D8C8;--go:#C8922A;--gn:#1E6B3C;--rd:#B02020;--bl:#1A4A7A;--tx:#1E0E04;--tx2:#5C3820;--tx3:#9B7055;--bd:#D8C4B0;--bd2:#EAD8C4;--sh:0 2px 12px rgba(92,46,14,.10)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Segoe UI',sans-serif;background:var(--cr);color:var(--tx);max-width:480px;margin:0 auto;min-height:100vh}
#ls{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px;background:linear-gradient(160deg,var(--br) 0%,var(--br2) 100%)}
#app{display:none;min-height:100vh;padding-bottom:72px}
.logo{color:white;font-size:2rem;font-weight:700;text-align:center;margin-bottom:4px}
.sub{color:rgba(255,255,255,.5);font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;margin-bottom:36px}
.lc{background:white;border-radius:18px;padding:26px 20px;width:100%;max-width:320px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.lc h2{font-size:.8rem;font-weight:700;color:var(--tx2);margin-bottom:18px;text-align:center;text-transform:uppercase;letter-spacing:.1em}
.le{color:var(--rd);font-size:.7rem;text-align:center;margin-top:8px;display:none}
.tb{background:var(--br);padding:12px 14px 0;position:sticky;top:0;z-index:100}
.tr{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.brand{color:white;font-size:1rem;font-weight:700}
.brand span{display:block;font-size:.58rem;opacity:.5;font-weight:300;letter-spacing:.05em;margin-top:1px}
.up{background:rgba(255,255,255,.15);color:white;font-size:.62rem;font-weight:600;padding:4px 10px;border-radius:20px}
.eb{background:rgba(255,255,255,.1);color:white;border:none;border-radius:6px;padding:4px 9px;font-size:.6rem;cursor:pointer;margin-left:6px}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nt{color:rgba(255,255,255,.45);font-size:.6rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:7px 11px;border-radius:8px 8px 0 0;cursor:pointer;white-space:nowrap;flex-shrink:0}
.nt.active{background:var(--cr);color:var(--br)}
.ct{padding:14px}
.sc{display:none}.sc.active{display:block}
.card{background:white;border-radius:12px;padding:14px;margin-bottom:12px;border:1px solid var(--bd2);box-shadow:var(--sh)}
.ctitle{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--br);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--bd2)}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.sc2{background:white;border-radius:12px;padding:12px;border-left:3px solid var(--br);box-shadow:var(--sh)}
.sc2.gn{border-left-color:var(--gn)}.sc2.go{border-left-color:var(--go)}.sc2.rd{border-left-color:var(--rd)}
.sl{font-size:.58rem;text-transform:uppercase;letter-spacing:.08em;color:var(--tx3);font-weight:600}
.sv{font-size:1.1rem;font-weight:700;color:var(--tx);margin-top:4px}
.ss{font-size:.58rem;color:var(--tx3);margin-top:2px}
.fg{margin-bottom:12px}
.lb{font-size:.62rem;font-weight:600;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px;display:block}
.ip,.sl2{width:100%;border:1.5px solid var(--bd);border-radius:10px;padding:10px 12px;font-size:.85rem;font-family:inherit;color:var(--tx);background:white;outline:none;transition:border-color .2s}
.ip:focus,.sl2:focus{border-color:var(--br)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.btn{border:none;border-radius:10px;padding:11px 16px;font-size:.8rem;font-weight:600;font-family:inherit;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:scale(.97)}
.bp{background:var(--br);color:white}
.bg{background:var(--gn);color:white}
.br{background:var(--rd);color:white}
.bo{background:var(--go);color:white}
.bgh{background:var(--cr2);color:var(--tx2);border:1px solid var(--bd)}
.bw{width:100%}
.bsm{padding:7px 12px;font-size:.7rem;border-radius:8px}
.pg{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px}
.pl{border:1.5px solid var(--bd);border-radius:20px;padding:5px 12px;font-size:.68rem;font-weight:600;cursor:pointer;color:var(--tx3);background:white;transition:all .15s;white-space:nowrap}
.pl.active{background:var(--br);color:white;border-color:var(--br)}
.stl{font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--br);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.bdg{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.58rem;font-weight:700}
.bdg-br{background:var(--cr2);color:var(--br)}
.pr{background:white;border:1.5px solid var(--bd2);border-radius:12px;padding:11px 12px;margin-bottom:7px;cursor:pointer;display:flex;align-items:center;gap:10px}
.pr:active{border-color:var(--br);background:var(--cr)}
.pth{width:48px;height:48px;border-radius:8px;background:var(--cr2);display:flex;align-items:center;justify-content:center;font-size:1.4rem;flex-shrink:0;overflow:hidden}
.pth img{width:100%;height:100%;object-fit:cover}
.psk{font-size:.58rem;font-weight:700;font-family:monospace;background:var(--br);color:white;padding:2px 6px;border-radius:4px;display:inline-block;margin-bottom:3px}
.pnm{font-size:.78rem;font-weight:600;color:var(--tx)}
.pat{font-size:.6rem;color:var(--tx3);margin-top:2px}
.pct{font-size:.6rem;background:var(--cr2);color:var(--tx3);padding:2px 7px;border-radius:4px;margin-top:3px;display:inline-block}
.pad{width:34px;height:34px;border-radius:8px;background:var(--gn);color:white;display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0;font-weight:700}
.ci{background:white;border:1px solid var(--bd2);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.cit{display:flex;align-items:center;gap:10px}
.cth{width:38px;height:38px;border-radius:7px;background:var(--cr2);display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0;overflow:hidden}
.cth img{width:100%;height:100%;object-fit:cover}
.cnm{font-size:.73rem;font-weight:600;color:var(--tx)}
.cvr{font-size:.6rem;color:var(--tx3)}
.crm{background:none;border:none;color:var(--rd);font-size:1rem;cursor:pointer;padding:2px 5px;margin-left:auto}
.cb{display:flex;gap:8px;align-items:center;margin-top:8px}
.qc{display:flex;align-items:center;gap:6px;background:var(--cr2);border-radius:8px;padding:3px 8px}
.qb{background:none;border:none;font-size:1rem;cursor:pointer;color:var(--br);font-weight:700;width:22px;height:22px;display:flex;align-items:center;justify-content:center}
.qn{font-size:.8rem;font-weight:700;color:var(--tx);min-width:20px;text-align:center}
.pi{flex:1;border:1.5px solid var(--bd);border-radius:8px;padding:6px 10px;font-size:.82rem;font-weight:700;color:var(--br);font-family:inherit;outline:none;background:white}
.pi:focus{border-color:var(--br)}
.mp{font-size:.6rem;font-weight:700;padding:3px 8px;border-radius:6px;white-space:nowrap}
.bs{background:white;border:1px solid var(--bd2);border-radius:12px;padding:12px;margin-bottom:12px}
.br2{display:flex;justify-content:space-between;font-size:.72rem;color:var(--tx3);margin-bottom:5px}
.br2.tot{font-size:.9rem;font-weight:700;color:var(--tx);border-top:1px solid var(--bd2);padding-top:7px;margin-top:5px}
.br2.mgn{color:var(--gn);font-weight:600}
.rc{background:white;border-radius:12px;padding:14px;border:2px solid var(--go);margin-bottom:14px}
.rr{display:flex;justify-content:space-between;font-size:.75rem;color:var(--tx);margin-bottom:6px}
.rr.mt{font-weight:700;color:var(--gn);border-top:1px dashed var(--bd2);padding-top:7px;margin-top:5px}
.rr.df{font-weight:700;color:var(--rd);border-top:1px dashed var(--bd2);padding-top:7px;margin-top:5px}
.lp{background:white;border:1px solid var(--bd2);border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer}
.lp:active{background:var(--cr)}
.pb{font-size:.9rem;font-weight:700}
.tr2{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;padding:7px 10px;border-top:1px solid var(--cr2)}
.tr2.hd{background:var(--br);color:white;border-top:none;border-radius:8px 8px 0 0}
.tr2.hd div{font-size:.58rem;font-weight:700}
.it{border:1px solid var(--bd2);border-radius:12px;overflow:hidden;margin-bottom:14px}
.mi{padding:9px 0;border-bottom:1px solid var(--cr2);display:flex;align-items:center;gap:8px}
.md{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.mf{flex:1}
.mt2{font-size:.7rem;font-weight:600;color:var(--tx)}
.mm{font-size:.58rem;color:var(--tx3);margin-top:1px}
.mq{font-size:.75rem;font-weight:700}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--br);color:white;padding:10px 20px;border-radius:20px;font-size:.78rem;font-weight:500;opacity:0;transition:all .3s;z-index:1000;white-space:nowrap;max-width:90vw;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.success{background:var(--gn)}.toast.error{background:var(--rd)}.toast.warning{background:var(--go)}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:flex-end}
.mo.show{display:flex}
.mb{background:white;border-radius:20px 20px 0 0;padding:20px;width:100%;max-height:85vh;overflow-y:auto}
.mt3{font-size:1.1rem;font-weight:700;color:var(--br);margin-bottom:16px}
.mc{background:none;border:none;font-size:1.3rem;cursor:pointer;color:var(--tx3);padding:2px 5px}
.sp{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-radius:50%;border-top-color:white;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sb{display:flex;align-items:center;gap:5px;font-size:.6rem;color:var(--tx3);margin-bottom:10px}
.sd{width:7px;height:7px;border-radius:50%;background:var(--gn)}
.sd.sy{background:var(--go);animation:pu 1s infinite}
.sd.er{background:var(--rd)}
@keyframes pu{0%,100%{opacity:1}50%{opacity:.3}}
.em{text-align:center;padding:28px 20px;color:var(--tx3)}
.ei{font-size:2.4rem;margin-bottom:10px}
.wb{background:#FFF8E4;border:1.5px solid var(--go);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:.72rem;color:var(--br)}
.ib{background:var(--cr2);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:.7rem;color:var(--tx2)}
.sp2{background:var(--cr2);border:1.5px solid var(--br);border-radius:10px;padding:11px 14px;margin-bottom:12px}
.sc3{font-family:monospace;font-size:.9rem;font-weight:700;color:var(--br);letter-spacing:.05em}
.pu{border:2px dashed var(--br);border-radius:12px;padding:18px;text-align:center;background:var(--cr);cursor:pointer;position:relative}
.pu input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.pi2{font-size:1.8rem;margin-bottom:5px}
.pu p{font-size:.68rem;color:var(--tx3)}
.st{font-size:.7rem;color:var(--gn);font-weight:600;margin-top:4px}
.ob{background:white;border:2px solid var(--go);border-radius:14px;padding:14px;margin-bottom:14px}
.rh{background:var(--br);color:white;padding:8px 12px;border-radius:10px 10px 0 0;display:flex;justify-content:space-between;align-items:center}
.rh div{font-size:.65rem;font-weight:700}
.rw{display:flex;justify-content:space-between;padding:7px 12px;border-bottom:1px solid var(--cr2);background:white;font-size:.72rem}
.rw:last-child{border-bottom:none}
.rf{display:flex;justify-content:space-between;padding:8px 12px;background:var(--cr2);border-radius:0 0 10px 10px;font-size:.75rem;font-weight:700;color:var(--br)}
.df{display:flex;gap:8px;margin-bottom:12px}
</style>
</head>
<body>

<div id="ls">
  <div class="logo">SL Collection</div>
  <div class="sub">POS · Rawalpindi</div>
  <div class="lc">
    <h2>Sign In</h2>
    <div class="fg"><label class="lb">Username</label><input class="ip" id="un" type="text" placeholder="username" autocomplete="off"></div>
    <div class="fg"><label class="lb">Password</label><input class="ip" id="pw" type="password" placeholder="password"></div>
    <button class="btn bp bw" id="lbtn" onclick="doLogin()">Sign In</button>
    <div class="le" id="lerr">❌ Invalid credentials</div>
  </div>
</div>

<div id="app">
  <div class="tb">
    <div class="tr">
      <div class="brand">SL Collection <span>POS · Rawalpindi</span></div>
      <div style="display:flex;align-items:center">
        <div class="up" id="upill">👤 Staff</div>
        <button class="eb" onclick="doLogout()">Exit</button>
      </div>
    </div>
    <div class="nav" id="nav"></div>
  </div>
  <div class="ct" id="ct"></div>
</div>

<div class="toast" id="toast"></div>
<div class="mo" id="mo"><div class="mb" id="mb">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
    <div class="mt3" id="mtitle"></div>
    <button class="mc" onclick="closeModal()">✕</button>
  </div>
  <div id="mc"></div>
</div></div>

<script>
const SCRIPT_URL='https://script.google.com/macros/s/AKfycbwMZpDqE8KLqfp2nV8XaGDkyYWItaMJrGNTOZqcq3BU9vO2R0FmTwOA0JoI81VAGvSvAg/exec';
const USERS={owner:{pw:'sl786',role:'owner',name:'Owner'},staff:{pw:'staff123',role:'staff',name:'Staff'}};
const CATS=['3PC','2PC','Shirt','Trouser','Dupatta','Abaya','Scarf'];
const CEMI={'3PC':'👗','2PC':'👘','Shirt':'👚','Trouser':'👖','Dupatta':'🧣','Abaya':'🖤','Scarf':'🧤'};
const CCOD={'3PC':'3PC','2PC':'2PC','Shirt':'SHT','Trouser':'TRS','Dupatta':'DPT','Abaya':'ABY','Scarf':'SCF'};
const CLCOD={black:'BLK',white:'WHT',blue:'BLU','navy blue':'NVY',navy:'NVY',red:'RED',green:'GRN',pink:'PNK',yellow:'YLW',orange:'ORG',purple:'PRP',grey:'GRY',gray:'GRY',brown:'BRN',maroon:'MRN',beige:'BGE',cream:'CRM',multi:'MLT',printed:'PRT',embroidered:'EMB'};

let CU=null,db={products:[],transactions:[],lines:[],ledger:[],accounts:[],movements:[]},cart=[],payMode='Cash',purPayMode='Cash',purSrc='Cash',pPhoto=null,bPhoto=null,sq=[],lostBy='Owner',rTab='sales',lTab='customers',bCat='';

// UTILS
const $=id=>document.getElementById(id);
const fmt=n=>'₨'+Number(n||0).toLocaleString('en-PK');
const td=()=>new Date().toLocaleDateString('en-PK');
const tn=()=>new Date().toLocaleTimeString('en-PK',{hour:'2-digit',minute:'2-digit'});
const uid=()=>Date.now()+Math.random().toString(36).substr(2,5);
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}};
const ld=(k,d=[])=>{try{return JSON.parse(localStorage.getItem(k)||'null')||d;}catch(e){return d;}};
const ce=c=>CEMI[c]||'📦';

function toast(msg,type='',dur=3000){const t=$('toast');t.textContent=msg;t.className=`toast show ${type}`;setTimeout(()=>t.className='toast',dur);}
function openModal(title,html){$('mtitle').textContent=title;$('mc').innerHTML=html;$('mo').classList.add('show');}
function closeModal(){$('mo').classList.remove('show');}

function getColCode(c){if(!c)return'CLR';const l=c.toLowerCase().trim();if(CLCOD[l])return CLCOD[l];for(const[k,v]of Object.entries(CLCOD)){if(l.includes(k))return v;}return c.replace(/[^a-zA-Z]/g,'').toUpperCase().substring(0,3)||'CLR';}
function getSzCode(s){if(!s)return'STD';const m={SMALL:'S',MEDIUM:'M',LARGE:'L','EXTRA LARGE':'XL','FREE SIZE':'FRE'};return m[s.toUpperCase().trim()]||s.toUpperCase().substring(0,3);}

// DB
function loadDB(){db.products=ld('sl3_products',[]);db.transactions=ld('sl3_txns',[]);db.lines=ld('sl3_lines',[]);db.ledger=ld('sl3_ledger',[]);db.accounts=ld('sl3_accounts',defaultAccounts());db.movements=ld('sl3_movs',[]);}
function saveDB(){sv('sl3_products',db.products);sv('sl3_txns',db.transactions);sv('sl3_lines',db.lines);sv('sl3_ledger',db.ledger);sv('sl3_accounts',db.accounts);sv('sl3_movs',db.movements);}
function defaultAccounts(){return[{id:'ca1',type:'Cash',name:'Cash Drawer',bal:0},{id:'ba1',type:'Bank',name:'HBL',bal:0},{id:'em1',type:'EMoney',name:'EasyPaisa',bal:0},{id:'em2',type:'EMoney',name:'JazzCash',bal:0}];}

// LEDGER ENGINE
function postEntry(txnId,date,accType,accName,dr,cr,notes){
  const e={id:uid(),txnId,date,accType,accName,dr:Number(dr)||0,cr:Number(cr)||0,notes,user:CU?.name||'System',ts:Date.now()};
  db.ledger.push(e);
  const acc=db.accounts.find(a=>a.name===accName&&a.type===accType);
  if(acc){acc.bal+=cr-dr;}else{db.accounts.push({id:uid(),type:accType,name:accName,bal:cr-dr});}
  return e;
}

// ATOMIC
function atomic(ops){
  const snap={products:JSON.stringify(db.products),transactions:JSON.stringify(db.transactions),lines:JSON.stringify(db.lines),ledger:JSON.stringify(db.ledger),accounts:JSON.stringify(db.accounts),movements:JSON.stringify(db.movements)};
  try{ops.forEach(op=>op());saveDB();return true;}
  catch(e){db.products=JSON.parse(snap.products);db.transactions=JSON.parse(snap.transactions);db.lines=JSON.parse(snap.lines);db.ledger=JSON.parse(snap.ledger);db.accounts=JSON.parse(snap.accounts);db.movements=JSON.parse(snap.movements);saveDB();toast('Transaction failed: '+e.message,'error');console.error(e);return false;}
}

// SYNC
async function syncBatch(entries){
  const rows=entries.map(e=>{
    const d={...e.data};delete d.photo;delete d.billPhoto;
    return{sheet:e.sheet,row:Object.values(d).map(v=>v==null?'':String(v).substring(0,500))};
  });
  try{
    const body=JSON.stringify({action:'batchAppend',entries:rows});
    await fetch(SCRIPT_URL,{
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body,
      mode:'no-cors'
    });
    setSyncOk();
  }catch(e){
    console.warn('Sync failed:',e.message);
    sq.push(...entries);setSyncErr();
  }
}

async function syncSingle(sheetName,data){
  const clean={...data};delete clean.photo;delete clean.billPhoto;
  const row=Object.values(clean).map(v=>v==null?'':String(v).substring(0,500));
  try{
    await fetch(SCRIPT_URL,{
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'append',sheet:sheetName,row}),
      mode:'no-cors'
    });
    setSyncOk();
  }catch(e){sq.push({sheet:sheetName,data});setSyncErr();}
}
async function flushQueue(){if(!sq.length)return;const tmp=[...sq];sq=[];await syncBatch(tmp);}
setInterval(flushQueue,30000);
window.addEventListener('online',flushQueue);
function setSyncOk(){document.querySelectorAll('.sd').forEach(d=>{d.className='sd';});document.querySelectorAll('.st2').forEach(t=>t.textContent='✅ Synced');}
function setSyncErr(){document.querySelectorAll('.sd').forEach(d=>{d.className='sd er';});document.querySelectorAll('.st2').forEach(t=>t.textContent=`⚠️ ${sq.length} pending`);}

async function loadFromSheets(){
  try{
    // Use JSONP to bypass CORS for GET requests
    const data = await new Promise((resolve, reject) => {
      const cbName = 'sl_cb_' + Date.now();
      const script = document.createElement('script');
      const timer = setTimeout(() => {
        reject(new Error('Timeout'));
        script.remove();
        delete window[cbName];
      }, 8000);
      window[cbName] = (result) => {
        clearTimeout(timer);
        script.remove();
        delete window[cbName];
        resolve(result);
      };
      script.src = `${SCRIPT_URL}?action=getAllData&callback=${cbName}`;
      script.onerror = () => { clearTimeout(timer); reject(new Error('Script error')); };
      document.head.appendChild(script);
    });

    if(data && data.success && data.data){
      const pr=data.data['Products']||[];
      if(pr.length>1){
        const h=pr[0];
        const parsed=pr.slice(1).filter(x=>x[0]).map(row=>{
          const o={};h.forEach((col,i)=>o[String(col)]=row[i]||'');
          return{
            code:o['Product Code']||'',name:o['Product Name']||'',
            category:o['Category']||'',size:o['Size']||'',colour:o['Colour']||'',
            noOfDesigns:o['No of Designs']||'',noOfColours:o['No of Colours']||'',
            costPrice:Number(o['Cost Price'])||0,supplier:o['Supplier']||'',
            stock:Number(o['Stock Qty'])||0,photo:''
          };
        });
        if(parsed.length>0){db.products=parsed;sv('sl3_products',db.products);}
      }
      // Load customers from sheet
      const cu=data.data['Customers']||[];
      if(cu.length>1){
        cu.slice(1).forEach(r=>{
          if(r[0]&&r[1]){
            const exists=db.accounts.find(a=>a.type==='Customer'&&a.name===r[1]);
            if(!exists) db.accounts.push({id:uid(),type:'Customer',name:String(r[1]),phone:String(r[2]||''),bal:0});
          }
        });
        sv('sl3_accounts',db.accounts);
      }
      // Load suppliers from sheet
      const su=data.data['Suppliers']||[];
      if(su.length>1){
        su.slice(1).forEach(r=>{
          if(r[0]&&r[1]){
            const exists=db.accounts.find(a=>a.type==='Supplier'&&a.name===r[1]);
            if(!exists) db.accounts.push({id:uid(),type:'Supplier',name:String(r[1]),phone:'',bal:0});
          }
        });
        sv('sl3_accounts',db.accounts);
      }
      setSyncOk();
      toast('✅ Data synced from Google Sheets','success');
    }
  }catch(e){
    console.warn('Sheets load failed:',e.message);
    setSyncErr();
    // Use cached data — system still works offline
  }
}

// SKU
async function genSKU(cat,col,sz){
  const c=CCOD[cat]||cat.substring(0,3).toUpperCase();
  const co=getColCode(col);const s=getSzCode(sz);const pfx=`${c}-${co}-${s}`;
  const ex=db.products.filter(p=>p.code&&p.code.startsWith(pfx));
  const ctrs=ld('sl3_skuc',{});
  const n=Math.max(ex.length,ctrs[pfx]||0)+1;
  ctrs[pfx]=n;sv('sl3_skuc',ctrs);
  const sku=`${pfx}-${String(n).padStart(3,'0')}`;
  if(db.products.find(p=>p.code===sku))return genSKU(cat,col,sz);
  return sku;
}

function showAccBal(type, name){
  if(!name || name==='__new__'){
    if(name==='__new__') createNewAccount(type);

  const infoId=type==='Bank'?'bank-bal-info':'emoney-bal-info';
  const info=$(infoId);
  if(info) info.innerHTML=`<div class="ib" style="color:${bal>0?'var(--gn)':'var(--rd)'}">Balance: <strong>${fmt(bal)}</strong>${bal<=0?' ⚠️ Insufficient!':''}</div>`;
}

function getAccBal(type, name){
  const acc=db.accounts.find(a=>a.type===type&&a.name===name);
  if(acc) return acc.bal;
  const entries=db.ledger.filter(e=>e.accType===type&&e.accName===name);
  return entries.reduce((s,e)=>s+e.cr-e.dr,0);
}

function srchProd(){
  const q=($('bsrch')?.value||'').toLowerCase().trim();
  const res=$('presults');if(!res)return;
  const filtered=db.products.filter(p=>{
    const mc=!bCat||p.category===bCat;

  });

  else if(w)w.style.display='none';

function addCart(sku){
  const p=db.products.find(p=>p.code===sku);if(!p){toast('Not found','error');return;}
  const inCart=cart.filter(c=>c.sku===sku).reduce((s,c)=>s+c.qty,0);
  if(inCart>=Number(p.stock)){toast(`Only ${p.stock} in stock!`,'error');return;}
  const ex=cart.find(c=>c.sku===sku);
  if(ex)ex.qty++;else cart.push({sku,name:p.name,category:p.category,size:p.size,colour:p.colour,cost:Number(p.costPrice),price:0,qty:1,photo:p.photo||''});
  renderCart();toast(`✅ ${p.name}`,'success');
}

function updPrice(sku,v){const it=cart.find(c=>c.sku===sku);if(it){it.price=Number(v)||0;}updSum();}

function renderCart(){
  const badge=$('cbadge');if(badge)badge.textContent=cart.length;

  items.innerHTML=cart.map(it=>{
    const mg=it.price>0?(it.price-it.cost)*it.qty:null;
    const mgp=it.price>0&&it.cost>0?Math.round(((it.price-it.cost)/it.cost)*100):null;
    const mc=mg===null?'#ccc':mg>=0?'#E8F5EE':'#FDEAEA';
    const mtc=mg===null?'var(--tx3)':mg>=0?'var(--gn)':'var(--rd)';
    return`<div class="ci"><div class="cit"><div class="cth">${it.photo?`<img src="${it.photo}">`:(ce(it.category))}</div><div style="flex:1"><div class="cnm">${it.name}</div><div class="cvr">${it.category}${it.size?' · '+it.size:''}${it.colour?' · '+it.colour:''}</div></div><button class="crm" onclick="remCart('${it.sku}')">✕</button></div>
    <div class="cb"><div class="qc"><button class="qb" onclick="updQty('${it.sku}',-1)">−</button><span class="qn">${it.qty}</span><button class="qb" onclick="updQty('${it.sku}',1)">+</button></div><input class="pi" type="number" placeholder="Sale ₨" value="${it.price||''}" oninput="updPrice('${it.sku}',this.value)"><div class="mp" style="background:${mc};color:${mtc}">${mg===null?'—':fmt(mg)}</div></div>
    <div style="display:flex;justify-content:space-between;align-items:center;background:var(--cr2);border-radius:7px;padding:4px 9px;margin-top:6px"><span style="font-size:.6rem;color:var(--tx3)">🔒 Cost: <strong>${fmt(it.cost)}</strong></span>${mgp!==null?`<span style="font-size:.6rem;font-weight:700;color:${mgp>=0?'var(--gn)':'var(--rd)'}">${mgp>=0?'▲':'▼'} ${Math.abs(mgp)}%</span>`:''}
    <span style="font-size:.55rem;color:var(--tx3)">Internal</span></div></div>`;
  }).join('');
  updSum();
}

function updSum(){
  const tot=cart.reduce((s,c)=>s+c.price*c.qty,0);
  const cst=cart.reduce((s,c)=>s+c.cost*c.qty,0);
  const mg=tot-cst;
  const bs=$('bsum');const ba=$('bacts');
  if(!bs||!ba)return;
  if(!cart.length){bs.style.display='none';ba.style.display='none';return;}
  bs.style.display='block';
  bs.innerHTML=`<div class="br2"><span>Subtotal</span><span>${fmt(tot)}</span></div><div class="br2 tot"><span>Total</span><span>${fmt(tot)}</span></div><div class="br2 mgn"><span>💰 Margin</span><span>${fmt(mg)}</span></div>`;
  ba.style.display='block';
  ba.innerHTML=`<button class="btn bg bw" id="cbtn" onclick="completeSale()" style="margin-bottom:8px">✅ Complete Sale</button><div class="g2"><button class="btn bgh bw" onclick="openReturn()">🔄 Return</button><button class="btn bgh bw" onclick="openExp()">💸 Expense</button></div>`;
}

async function completeSale(){
  if(!cart.length){toast('Cart empty','error');return;}
  const mp=cart.find(c=>!c.price||c.price<=0);if(mp){toast(`Enter price for: ${mp.name}`,'error');return;}
  for(const it of cart){if(it.price<it.cost){if(!confirm(`⚠️ ${it.name} price ₨${it.price} below cost ₨${it.cost}. Loss! Continue?`))return;}}

  const cust=($('bcust')?.value||'').trim()||'Walk-in Customer';

  // ── VALIDATION ──
  const tot=cart.reduce((s,c)=>s+c.price*c.qty,0);

  // 1. Credit/Split requires customer name
  if((payMode==='Credit'||payMode==='Split')&&(cust===''||cust==='Walk-in Customer')){
    toast('⚠️ Customer name required for credit sales','error');
    $('bcust')?.focus();return;
  }

  // 2. Balance validation
  if(payMode==='Cash'){
    const cashBal=getAccBal('Cash','Cash Drawer');
    // Cash sales ADD to drawer — no balance check needed (we are receiving cash)
    // But if refund scenario, check. For sales: OK
  } else if(payMode==='Bank'){
    const bankName=$('bbank')?.value||'';
    if(!bankName||bankName==='__new__'){toast('Select a bank account','error');return;}
    // Bank sale adds to bank balance — no check needed
  } else if(payMode==='EMoney'){
    const emoneyName=$('bemoney')?.value||'';
    if(!emoneyName||emoneyName==='__new__'){toast('Select E-Money provider','error');return;}
  } else if(payMode==='Split'){
    const splitCash=Number($('splitcash')?.value||0);
    const cashBal=getAccBal('Cash','Cash Drawer');
    // Only validate if paying from cash
    if(splitCash>0){
      // cash sale - no balance check (receiving cash)
    }
  }

  // 3. Auto-create customer if credit sale and customer doesn't exist
  if((payMode==='Credit'||payMode==='Split')&&cust!=='Walk-in Customer'){
    const custExists=db.accounts.find(a=>a.type==='Customer'&&a.name===cust);
    if(!custExists){
      if(confirm(`Customer "${cust}" not found. Create new ledger?`)){
        db.accounts.push({id:uid(),type:'Customer',name:cust,phone:'',bal:0});
        saveDB();toast(`✅ Customer "${cust}" ledger created`,'success');
      } else return;
    }
  }

  const btn=$('cbtn');if(btn){btn.innerHTML='<div class="sp"></div>';btn.disabled=true;}
  const billNo=await nextBillNo();
  const cst=cart.reduce((s,c)=>s+c.cost*c.qty,0);
  const mg=tot-cst;
  const isAcq=$('isacq')?.checked||false;
  const bankName=$('bbank')?.value||'';
  const emoneyName=$('bemoney')?.value||'';
  const splitCash=Number($('splitcash')?.value||0);
  const splitSrc=$('splitsrc')?.value||'Credit';
  const splitRest=payMode==='Split'?Math.max(0,tot-splitCash):0;
  const d=td();const t=tn();

  const ok=atomic([
    // 1. Transaction header
    ()=>{
      db.transactions.push({id:billNo,date:d,time:t,type:'Sale',party:cust,payMode,
        total:tot,cost:cst,margin:mg,isAcq,bankName,emoneyName,
        splitCash,splitSrc,splitRest,user:CU.name,status:'done'});
    },
    // 2. Lines + inventory deduction
    ()=>{
      cart.forEach(it=>{
        db.lines.push({id:uid(),txnId:billNo,sku:it.sku,name:it.name,category:it.category,
          qty:it.qty,cost:it.cost,price:it.price,lineTotal:it.price*it.qty,
          margin:(it.price-it.cost)*it.qty});
        const pr=db.products.find(p=>p.code===it.sku);
        if(!pr) throw new Error(`Product not found: ${it.sku}`);
        if(Number(pr.stock)<it.qty) throw new Error(`Insufficient stock: ${it.name}`);
        pr.stock=Number(pr.stock)-it.qty;
        db.movements.push({id:uid(),date:d,time:t,sku:it.sku,name:it.name,
          category:it.category,type:'Sale',qtyChange:-it.qty,cost:it.cost,price:it.price,
          value:it.cost*it.qty,margin:(it.price-it.cost)*it.qty,txnId:billNo,user:CU.name});
      });
    },
    // 3. Double-entry ledger postings
    ()=>{
      if(payMode==='Cash'){
        // Dr nothing (cash received) / Cr Cash Drawer (asset increases)
        postEntry(billNo,d,'Cash','Cash Drawer',0,tot,`Sale ${billNo} — Cash`);
      } else if(payMode==='Bank'){
        postEntry(billNo,d,'Bank',bankName,0,tot,`Sale ${billNo} — Bank`);
      } else if(payMode==='EMoney'){
        postEntry(billNo,d,'EMoney',emoneyName,0,tot,`Sale ${billNo} — ${emoneyName}`);
      } else if(payMode==='Credit'){
        // Dr Customer (they owe us) / Cr Sales Revenue
        postEntry(billNo,d,'Customer',cust,tot,0,`Credit Sale ${billNo}`);
      } else if(payMode==='Split'){
        // Cash portion
        if(splitCash>0) postEntry(billNo,d,'Cash','Cash Drawer',0,splitCash,`Split Cash ${billNo}`);
        // Remaining portion
        if(splitRest>0){
          if(splitSrc==='Credit') postEntry(billNo,d,'Customer',cust,splitRest,0,`Split Credit ${billNo}`);
          else if(splitSrc==='Bank') postEntry(billNo,d,'Bank',bankName||'Bank',0,splitRest,`Split Bank ${billNo}`);
          else if(splitSrc==='EMoney') postEntry(billNo,d,'EMoney',emoneyName||'E-Money',0,splitRest,`Split EMoney ${billNo}`);
        }
      }
      // COGS entry
      postEntry(billNo,d,'Expense','COGS',cst,0,`COGS ${billNo}`);
      if(isAcq) db.movements.push({id:uid(),date:d,type:'AcqSale',txnId:billNo,cust,tot,mg,user:CU.name});
    }
  ]);

  if(ok){
    const se=[];
    cart.forEach(it=>se.push({sheet:'Sales',data:{
      billNo,date:d,time:t,user:CU.name,sku:it.sku,name:it.name,
      category:it.category,qty:it.qty,cost:it.cost,price:it.price,
      saleAmt:it.price*it.qty,margin:(it.price-it.cost)*it.qty,
      cust,payMode,isAcq:isAcq?'Yes':'No'}}));

    // Cash register
    if(payMode==='Cash') se.push({sheet:'Cash Register',data:{date:d,nature:`Sale ${billNo}`,category:'Sales',amountIn:tot,amountOut:0,user:CU.name}});
    if(payMode==='Split'&&splitCash>0) se.push({sheet:'Cash Register',data:{date:d,nature:`Split Sale ${billNo}`,category:'Sales',amountIn:splitCash,amountOut:0,user:CU.name}});

    // Customer ledger (credit portion)
    if(payMode==='Credit') se.push({sheet:'Customers',data:{date:d,party:cust,type:'Sale Credit (Receivable)',amount:tot,notes:`Bill: ${billNo}`,user:CU.name}});
    if(payMode==='Split'&&splitSrc==='Credit'&&splitRest>0) se.push({sheet:'Customers',data:{date:d,party:cust,type:'Split Credit',amount:splitRest,notes:`Bill: ${billNo}`,user:CU.name}});

    // Bank ledger
    if(payMode==='Bank') se.push({sheet:'Bank Accounts',data:{date:d,bankName,type:'Sale Receipt',amountIn:tot,amountOut:0,notes:`Bill: ${billNo}`,user:CU.name}});

    syncBatch(se);
    toast(`✅ ${billNo} — ${fmt(tot)} | Margin: ${fmt(mg)}`,'success',4000);
    cart=[];
    if($('bcust'))$('bcust').value='';
    if($('isacq'))$('isacq').checked=false;
    if($('cust-balance'))$('cust-balance').style.display='none';
    renderCart();srchProd();
    if(document.querySelector('.nt.active')?.textContent?.includes('📊')) refDash();
  }
  if(btn){btn.innerHTML='✅ Complete Sale';btn.disabled=false;}
}

function procReturn(){
  const bill=$('srb')?.value?.trim();const sku=$('srp')?.value;const qty=Number($('srq')?.value||0);const pr=Number($('srpr')?.value||0);const ref=$('srr')?.value;const rsn=$('srrn')?.value||'';

    p.stock=Number(p.stock)+qty;

    db.transactions.push({id:rid,date:d,time:t,type:'Sale Return',party:bill,payMode:ref,total:-amt,user:CU.name,status:'done'});

v></div>`).join('')}

function showMov(sku){

  ${!ms.length?'<div class="em"><p>No movements yet</p></div>':ms.slice().reverse().map(m=>`<div class="mi"><div class="md" style="background:${tc[m.type]||'var(--tx3)'}"></div><div class="mf"><div class="mt2">${m.type}</div><div class="mm">${m.date} ${m.time} · ${m.user}${m.reason?' · '+m.reason:''}</div></div><div class="mq" style="color:${m.qtyChange>0?'var(--gn)':'var(--rd)'}">${m.qtyChange>0?'+':''}${m.qtyChange}</div></div>`).join('')}`);

function openStockTake(){
  openModal('🔍 Stock Verification',`<div class="ib">Enter physical count. System shows differences.</div><div>${db.products.map((p,i)=>`<div style="display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--cr2)"><div><div style="font-size:.72rem;font-weight:600">${p.name}</div><div style="font-size:.6rem;color:var(--tx3)">${p.code} · Book: <strong style="color:var(--br)">${p.stock}</strong></div></div><input type="number" id="sti${i}" placeholder="Physical" style="width:68px;border:1.5px solid var(--bd);border-radius:8px;padding:6px 8px;font-size:.8rem;text-align:center" oninput="updStDiff(${i})"><div id="std${i}" style="font-size:.72rem;font-weight:700;min-width:35px;text-align:right"></div></div>`).join('')}</div><button class="btn bp bw" style="margin-top:14px" onclick="saveStockTake()">✅ Save</button>`);
}
function updStDiff(i){const inp=$(`sti${i}`);const d=$(`std${i}`);if(!inp||!d)return;const ph=Number(inp.value);const bk=Number(db.products[i].stock);const df=ph-bk;if(inp.value===''){d.textContent='';return;}d.textContent=df===0?'✅':(df>0?`+${df}`:String(df));d.style.color=df===0?'var(--gn)':'var(--rd)';}
function saveStockTake(){
  let adj=0;const d=td();const t=tn();
  const ok=atomic([()=>{db.products.forEach((p,i)=>{const inp=$(`sti${i}`);if(!inp||inp.value==='')return;const ph=Number(inp.value);const df=ph-Number(p.stock);if(df!==0){db.movements.push({id:uid(),date:d,time:t,sku:p.code,name:p.name,category:p.category,type:'Stock Take',qtyChange:df,cost:p.costPrice,value:Math.abs(df)*Number(p.costPrice),user:CU.name,reason:`Physical:${ph} Book:${p.stock}`});p.stock=ph;adj++;}});}]);
  if(ok){closeModal();showTab('inv',document.querySelector('.nt.active'));toast(`✅ ${adj} items adjusted`,'success');}
}

// ── PURCHASE ──
function rBuy(){
  return`<div style="display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;margin-bottom:14px"><div class="pl active" onclick="showBuyTab('new',this)">➕ New</div><div class="pl" onclick="showBuyTab('ret',this)">🔄 Return</div><div class="pl" onclick="showBuyTab('dmg',this)">💥 Damaged</div><div class="pl" onclick="showBuyTab('lst',this)">❌ Lost</div><div class="pl" onclick="showBuyTab('agd',this)">🏷️ Aged</div></div><div id="btab">${rNewPur()}</div>`;
}
function showBuyTab(t,el){document.querySelectorAll('#btab').forEach(()=>{});document.querySelectorAll('.pl').forEach(p=>p.classList.remove('active'));el.classList.add('active');const c=$('btab');if(!c)return;switch(t){case'new':c.innerHTML=rNewPur();break;case'ret':c.innerHTML=rPurRet();break;case'dmg':c.innerHTML=rDmg();break;case'lst':c.innerHTML=rLst();break;case'agd':c.innerHTML=rAgd();break;}}

function rNewPur(){
  return`<div class="card"><div class="ctitle">📦 New Purchase</div>
  <div class="fg"><label class="lb">📸 Product Photo</label><div class="pu" onclick="document.getElementById('pph').click()"><input type="file" id="pph" accept="image/*" onchange="hPhoto(this,'prod')" style="display:none"><div class="pi2" id="ppi">📸</div><p>Tap to upload</p><div class="st" id="ppn"></div></div></div>
  <div class="fg"><label class="lb">Product Name *</label><input class="ip" id="pnm" placeholder="e.g. Embroidered Lawn 3PC"></div>
  <div class="g2"><div class="fg"><label class="lb">Category *</label><select class="sl2" id="pcat" onchange="updSKU()"><option value="">Select...</option>${CATS.map(c=>`<option>${c}</option>`).join('')}</select></div><div class="fg"><label class="lb">Size</label><input class="ip" id="psz" placeholder="S/M/L/XL" oninput="updSKU()"></div></div>
  <div class="g2"><div class="fg"><label class="lb">No of Designs</label><input class="ip" id="pds" type="number" placeholder="5"></div><div class="fg"><label class="lb">No of Colours</label><input class="ip" id="pnc" type="number" placeholder="3"></div></div>
  <div class="fg"><label class="lb">Colour</label><input class="ip" id="pcl" placeholder="Navy Blue, Red..." oninput="updSKU()"></div>
  <div class="sp2"><div style="font-size:.62rem;color:var(--tx3);margin-bottom:4px;text-transform:uppercase;letter-spacing:.08em">🏷️ SKU Preview</div><div class="sc3" id="skuprev">Select category...</div><div style="font-size:.58rem;color:var(--tx3);margin-top:4px">Auto-generated on save</div></div>
  <div class="g2"><div class="fg"><label class="lb">Qty *</label><input class="ip" id="pqt" type="number" placeholder="0" oninput="updPay()"></div><div class="fg"><label class="lb">Cost ₨ *</label><input class="ip" id="pcs" type="number" placeholder="0" oninput="updPay()"></div></div>
  <div class="fg"><label class="lb">Supplier</label><input class="ip" id="psp" placeholder="Supplier name"></div>
  <div class="ib">💡 Sale price negotiated with customer at billing — not entered here.</div>
  <div class="fg"><label class="lb">Payment</label><div class="pg" id="ppills2"><div class="pl active" onclick="setPurPay('Cash',this)">💵 Cash</div><div class="pl" onclick="setPurPay('Credit',this)">📋 Credit</div><div class="pl" onclick="setPurPay('Partial',this)">⚡ Partial</div></div></div>
  <div id="ppdet"></div>
  <div id="pprev" style="display:none" class="wb"></div>
  <div class="fg"><label class="lb">📎 Wholesaler Bill</label><div class="pu" onclick="document.getElementById('pbph').click()"><input type="file" id="pbph" accept="image/*" onchange="hPhoto(this,'bill')" style="display:none"><div class="pi2">🧾</div><p>Attach bill photo</p><div class="st" id="pbn"></div></div></div>
  <button class="btn bo bw" onclick="savePur()">✅ Save Purchase + Update Inventory</button></div>`;
}

function updSKU(){const c=$('pcat')?.value||'';const cl=$('pcl')?.value||'';const s=$('psz')?.value||'';const p=$('skuprev');if(!p)return;if(!c){p.textContent='Select category...';return;}p.textContent=`${CCOD[c]||c.substring(0,3).toUpperCase()}-${getColCode(cl)}-${getSzCode(s)}-###`;}
function setPurPay(m,el){
  purPayMode=m;
  document.querySelectorAll('#ppills2 .pl').forEach(p=>p.classList.remove('active'));
  el.classList.add('active');
  const d=$('ppdet');if(!d)return;
  const cashBal=getAccBal('Cash','Cash Drawer');
  const banks=db.accounts.filter(a=>a.type==='Bank');
  const emoney=db.accounts.filter(a=>a.type==='EMoney');

  if(m==='Cash'){
    d.innerHTML=`<div class="ib" style="color:${cashBal>0?'var(--tx2)':'var(--rd)'}">💵 Cash Drawer: <strong>${fmt(cashBal)}</strong>${cashBal<=0?' ⚠️ Insufficient balance!':''}</div>`;
  } else if(m==='Credit'){
    d.innerHTML=`<div class="ib" style="color:var(--rd);border-color:var(--rd)">📋 Full amount posted to Supplier Payable. Supplier name required below.</div>`;
  } else if(m==='Partial'){
    d.innerHTML=`
      <div class="fg"><label class="lb">Amount Paid Now ₨</label><input class="ip" id="ppd" type="number" placeholder="0" oninput="updPay()"></div>
      <div class="fg"><label class="lb">Payment Source</label>
        <div class="pg" id="psrcp">
          <div class="pl active" onclick="setPurSrc('Cash',this)">💵 Cash</div>
          <div class="pl" onclick="setPurSrc('Bank',this)">🏦 Bank</div>
          <div class="pl" onclick="setPurSrc('EMoney',this)">📱 E-Money</div>
          <div class="pl" onclick="setPurSrc('Owner',this)">👑 Owner</div>
          <div class="pl" onclick="setPurSrc('Loan',this)">🤝 Loan</div>
        </div>
      </div>
      <div id="psdet"></div>`;
  }
  updPay();
}

function setPurSrc(s,el){
  purSrc=s;
  document.querySelectorAll('#psrcp .pl').forEach(p=>p.classList.remove('active'));
  el.classList.add('active');
  const d=$('psdet');if(!d)return;
  const cashBal=getAccBal('Cash','Cash Drawer');
  const banks=db.accounts.filter(a=>a.type==='Bank');
  const emoney=db.accounts.filter(a=>a.type==='EMoney');

  if(s==='Cash'){
    d.innerHTML=`<div class="ib" style="color:${cashBal>0?'var(--tx2)':'var(--rd)'}">💵 Available: <strong>${fmt(cashBal)}</strong>${cashBal<=0?' ⚠️ Insufficient!':''}</div>`;
  } else if(s==='Bank'){
    d.innerHTML=`<div class="fg"><label class="lb">Bank Account</label>
      <select class="sl2" id="psbn" onchange="showPurAccBal('Bank',this.value)">
        <option value="">Select bank...</option>
        ${banks.map(b=>`<option value="${b.name}">${b.name} — ${fmt(b.bal)}</option>`).join('')}
        <option value="__new__">➕ Add New Bank</option>
      </select>
    </div><div id="pur-bank-bal"></div>`;
  } else if(s==='EMoney'){
    d.innerHTML=`<div class="fg"><label class="lb">E-Money Provider</label>
      <select class="sl2" id="psem" onchange="showPurAccBal('EMoney',this.value)">
        <option value="">Select...</option>
        ${emoney.map(e=>`<option value="${e.name}">${e.name} — ${fmt(e.bal)}</option>`).join('')}
        <option value="EasyPaisa">EasyPaisa</option>
        <option value="JazzCash">JazzCash</option>
        <option value="NayaPay">NayaPay</option>
        <option value="__new__">➕ Add New</option>
      </select>
    </div><div id="pur-emoney-bal"></div>`;
  } else if(s==='Owner'){
    d.innerHTML=`<div class="ib">👑 Will be posted to <strong>Owner Payable</strong> ledger automatically.</div>`;
  } else if(s==='Loan'){
    d.innerHTML=`<div class="fg"><label class="lb">Shopkeeper/Party Name</label><input class="ip" id="pssk" placeholder="Party name"></div><div class="ib">🤝 Will be posted to <strong>Market Loan</strong> ledger party-wise.</div>`;
  }
}

function showPurAccBal(type, name){
  if(name==='__new__'){createNewAccount(type);return;}
  if(!name) return;
  const acc=db.accounts.find(a=>a.type===type&&a.name===name);
  const bal=acc?acc.bal:0;
  const infoId=type==='Bank'?'pur-bank-bal':'pur-emoney-bal';
  const info=$(infoId);
  if(info) info.innerHTML=`<div class="ib" style="color:${bal>0?'var(--gn)':'var(--rd)'}">Balance: <strong>${fmt(bal)}</strong>${bal<=0?' ⚠️ Insufficient!':''}</div>`;
}
function updPay(){const q=Number($('pqt')?.value||0);const c=Number($('pcs')?.value||0);const tot=q*c;const pd=purPayMode==='Partial'?Number($('ppd')?.value||0):purPayMode==='Cash'?tot:0;const pay=Math.max(0,tot-pd);const p=$('pprev');if(!p)return;if(tot>0){p.style.display='block';p.innerHTML=`<div style="display:flex;justify-content:space-between"><span>Total</span><span>${fmt(tot)}</span></div><div style="display:flex;justify-content:space-between;color:var(--gn)"><span>Paid</span><span>- ${fmt(pd)}</span></div><div style="display:flex;justify-content:space-between;font-weight:700;border-top:1px dashed var(--bd2);margin-top:5px;padding-top:5px;color:var(--rd)"><span>Payable</span><span>${fmt(pay)}</span></div>`;}else p.style.display='none';}

function hPhoto(inp,type){const file=inp.files[0];if(!file)return;const r=new FileReader();r.onload=e=>{const img=new Image();img.onload=()=>{const cv=document.createElement('canvas');const MAX=type==='prod'?300:400;let w=img.width,h=img.height;if(w>MAX){h=Math.round(h*MAX/w);w=MAX;}cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);const b64=cv.toDataURL('image/jpeg',.65);if(type==='prod'){pPhoto=b64;const i=$('ppi');if(i)i.textContent='✅';const n=$('ppn');if(n)n.textContent=file.name;}else{bPhoto=b64;const n=$('pbn');if(n)n.textContent='✅ '+file.name;}};img.src=e.target.result;};r.readAsDataURL(file);}

async function savePur(){
  const nm=$('pnm')?.value?.trim();const cat=$('pcat')?.value;const qty=Number($('pqt')?.value||0);const cst=Number($('pcs')?.value||0);const sup=$('psp')?.value?.trim()||'Unknown';const sz=$('psz')?.value?.trim()||'';const cl=$('pcl')?.value?.trim()||'';
  if(!nm||!cat||!qty||!cst){toast('Fill: Name, Category, Qty, Cost','error');return;}
  const tot=qty*cst;const sku=await genSKU(cat,cl,sz);const d=td();const t=tn();const pid=`PUR-${Date.now()}`;
  let pd=0,pybl=0,psrc='',pprov='';
  if(purPayMode==='Cash'){pd=tot;psrc='Cash';}
  else if(purPayMode==='Credit'){pybl=tot;psrc='Credit';}
  else{pd=Number($('ppd')?.value||0);pybl=Math.max(0,tot-pd);psrc=purSrc;if(purSrc==='Bank')pprov=$('psbn')?.value||'Bank';else if(purSrc==='EMoney')pprov=$('psem')?.value||'EMoney';else if(purSrc==='Loan')pprov=$('pssk')?.value||'Shopkeeper';else if(purSrc==='Owner')pprov='Owner';}
  const prod={code:sku,name:nm,category:cat,size:sz,colour:cl,noOfDesigns:$('pds')?.value||'',noOfColours:$('pnc')?.value||'',costPrice:cst,supplier:sup,photo:'',stock:qty,dateAdded:d};
  if(pPhoto){const ph=ld('sl3_photos',{});ph[sku]=pPhoto;try{sv('sl3_photos',ph);prod.photo=pPhoto;}catch(e){}}
  const ok=atomic([
    ()=>{
      if(db.products.find(p=>p.code===sku)) throw new Error(`SKU ${sku} already exists. Please try again.`);
      db.products.push({...prod});
    },
    ()=>{db.transactions.push({id:pid,date:d,time:t,type:'Purchase',party:sup,payMode:purPayMode,total:tot,paid:pd,payable:pybl,psrc,pprov,user:CU.name,status:'done'});},
    ()=>{db.movements.push({id:uid(),date:d,time:t,sku,name:nm,category:cat,type:'Purchase',qtyChange:qty,cost:cst,value:tot,txnId:pid,user:CU.name,reason:`Supplier: ${sup}`});},
    ()=>{
      postEntry(pid,d,'Asset','Inventory',tot,0,`Purchase ${sku}`);
      if(purPayMode==='Cash'){postEntry(pid,d,'Cash','Cash Drawer',tot,0,`Purchase ${sku}`);}
      else if(purPayMode==='Credit'){postEntry(pid,d,'Supplier',sup,0,tot,`Purchase Credit ${sku}`);}
      else{if(pd>0){if(psrc==='Cash')postEntry(pid,d,'Cash','Cash Drawer',pd,0,`Purchase partial ${sku}`);else if(psrc==='Bank')postEntry(pid,d,'Bank',pprov,pd,0,`Purchase partial ${sku}`);else if(psrc==='EMoney')postEntry(pid,d,'EMoney',pprov,pd,0,`Purchase partial ${sku}`);else if(psrc==='Owner')postEntry(pid,d,'Owner','Owner Account',0,pd,`Owner paid ${sku}`);else if(psrc==='Loan')postEntry(pid,d,'Loan',pprov,0,pd,`Loan for ${sku}`);}if(pybl>0)postEntry(pid,d,'Supplier',sup,0,pybl,`Purchase payable ${sku}`);}
    }
  ]);
  if(ok){
    const se=[{sheet:'Products',data:{sku,name:nm,category:cat,size:sz,colour:cl,noOfDesigns:prod.noOfDesigns,noOfColours:prod.noOfColours,costPrice:cst,supplier:sup,stock:qty,dateAdded:d,user:CU.name}},{sheet:'Purchases',data:{pid,date:d,sku,name:nm,category:cat,qty,costPrice:cst,total:tot,payType:purPayMode,paid:pd,payable:pybl,psrc,pprov,supplier:sup,user:CU.name}}];
    if(pybl>0)se.push({sheet:'Suppliers',data:{date:d,party:sup,type:'Purchase Credit',amount:pybl,notes:`${nm} x${qty}`,user:CU.name}});
    if(pd>0&&psrc==='Cash')se.push({sheet:'Cash Register',data:{date:d,nature:`Purchase ${sku}`,category:'Purchase',amountIn:0,amountOut:pd,user:CU.name}});
    syncBatch(se);
    showSKUBanner(sku,nm,cat,sz,cl);
    toast(`✅ SKU: ${sku} | Stock: ${qty}${pybl>0?` | Payable: ${fmt(pybl)}`:''}`,'success',5000);
    resetPurForm();pPhoto=null;bPhoto=null;
  }
}

function showSKUBanner(sku,nm,cat,sz,cl){const b=document.createElement('div');b.style.cssText='position:fixed;top:80px;left:50%;transform:translateX(-50%);background:var(--br);color:white;border-radius:14px;padding:14px 20px;z-index:500;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.3);min-width:240px';b.innerHTML=`<div style="font-size:.58rem;opacity:.7;text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px">✅ SKU Generated</div><div style="font-family:monospace;font-size:1.4rem;font-weight:700;color:#E8B84B;letter-spacing:.08em">${sku}</div><div style="font-size:.7rem;opacity:.8;margin-top:4px">${nm} · ${cat}${sz?' · '+sz:''}${cl?' · '+cl:''}</div><button onclick="this.parentElement.remove()" style="margin-top:8px;background:rgba(255,255,255,.15);color:white;border:none;border-radius:7px;padding:5px 14px;font-size:.68rem;cursor:pointer">Got it ✓</button>`;document.body.appendChild(b);setTimeout(()=>{if(b.parentElement)b.remove();},8000);}

function resetPurForm(){['pnm','psz','pds','pnc','pcl','pqt','pcs','psp'].forEach(id=>{const e=$(id);if(e)e.value='';});if($('pcat'))$('pcat').value='';if($('ppi'))$('ppi').textContent='📸';if($('ppn'))$('ppn').textContent='';if($('pbn'))$('pbn').textContent='';if($('skuprev'))$('skuprev').textContent='Select category...';if($('pprev'))$('pprev').style.display='none';if($('ppdet'))$('ppdet').innerHTML='';const pp=$('ppills2');if(pp){pp.querySelectorAll('.pl').forEach((p,i)=>p.classList.toggle('active',i===0));}purPayMode='Cash';purSrc='Cash';}

function rPurRet(){const opts=db.products.map(p=>`<option value="${p.code}">${p.name} (${p.code})</option>`).join('');return`<div class="card"><div class="ctitle">🔄 Purchase Return</div><div class="fg"><label class="lb">Product</label><select class="sl2" id="prp" onchange="fillPR()">${opts}</select></div><div class="g2"><div class="fg"><label class="lb">Qty</label><input class="ip" id="prq" type="number" placeholder="0"></div><div class="fg"><label class="lb">Cost ₨</label><input class="ip" id="prc" type="number" placeholder="0"></div></div><div class="fg"><label class="lb">Supplier</label><input class="ip" id="prs" placeholder="Supplier"></div><div class="fg"><label class="lb">Reason</label><input class="ip" id="prr" placeholder="Defective..."></div><button class="btn bp bw" onclick="savePurRet()">✅ Process Return</button></div>`;}
function fillPR(){const p=db.products.find(p=>p.code===$('prp')?.value);if(p){if($('prc'))$('prc').value=p.costPrice;if($('prs'))$('prs').value=p.supplier||'';}}
function savePurRet(){const sku=$('prp')?.value;const qty=Number($('prq')?.value||0);const cst=Number($('prc')?.value||0);const sup=$('prs')?.value||'';const rsn=$('prr')?.value||'';if(!sku||!qty||!cst){toast('Fill all','error');return;}const p=db.products.find(p=>p.code===sku);if(!p)return;const id=`PRET-${Date.now()}`;const d=td();const t=tn();const amt=qty*cst;const ok=atomic([()=>{p.stock=Math.max(0,Number(p.stock)-qty);db.movements.push({id:uid(),date:d,time:t,sku,name:p.name,category:p.category,type:'Purchase Return',qtyChange:-qty,cost:cst,value:amt,txnId:id,user:CU.name,reason:rsn});db.transactions.push({id,date:d,time:t,type:'Purchase Return',party:sup,payMode:'Cash',total:-amt,user:CU.name,status:'done'});postEntry(id,d,'Supplier',sup,amt,0,`Return: ${p.name} x${qty}`);postEntry(id,d,'Cash','Cash Drawer',0,amt,`Pur Return ${sku}`);postEntry(id,d,'Asset','Inventory',0,amt,`Return ${sku}`);}]);if(ok){syncBatch([{sheet:'Purchases',data:{pid:id,date:d,sku,qty:-qty,total:-amt,payType:'Purchase Return',supplier:sup,notes:rsn,user:CU.name}}]);toast(`✅ Return! Stock -${qty}. Payable -${fmt(amt)}`,'success');}}

function rDmg(){const opts=db.products.map(p=>`<option value="${p.code}">${p.name} (${p.code})</option>`).join('');return`<div class="card"><div class="ctitle" style="color:var(--rd)">💥 Damaged Items</div><div class="fg"><label class="lb">Product</label><select class="sl2" id="dmp" onchange="const p=db.products.find(p=>p.code===this.value);if(p&&$('dmc'))$('dmc').value=p.costPrice;">${opts}</select></div><div class="g2"><div class="fg"><label class="lb">Qty</label><input class="ip" id="dmq" type="number" placeholder="0"></div><div class="fg"><label class="lb">Cost ₨</label><input class="ip" id="dmc" type="number" placeholder="0"></div></div><div class="fg"><label class="lb">Description</label><input class="ip" id="dmd" placeholder="Water damage, torn..."></div><button class="btn br bw" onclick="saveDmg()">💾 Record Damaged</button></div>`;}
function saveDmg(){const sku=$('dmp')?.value;const qty=Number($('dmq')?.value||0);const cst=Number($('dmc')?.value||0);const desc=$('dmd')?.value||'';if(!sku||!qty)return;const p=db.products.find(p=>p.code===sku);if(!p)return;const id=`DMG-${Date.now()}`;const d=td();const t=tn();const ok=atomic([()=>{p.stock=Math.max(0,Number(p.stock)-qty);db.movements.push({id:uid(),date:d,time:t,sku,name:p.name,category:p.category,type:'Damaged',qtyChange:-qty,cost:cst,value:qty*cst,txnId:id,user:CU.name,reason:desc});postEntry(id,d,'Expense','Damaged Goods',qty*cst,0,desc);postEntry(id,d,'Asset','Inventory',0,qty*cst,`Damaged: ${p.name}`);}]);if(ok)toast(`💥 Recorded! Stock -${qty}. Loss: ${fmt(qty*cst)}`,'success');}

function rLst(){const opts=db.products.map(p=>`<option value="${p.code}">${p.name} (${p.code})</option>`).join('');return`<div class="card"><div class="ctitle">❌ Lost Items</div><div class="fg"><label class="lb">Lost By</label><div class="pg"><div class="pl active" id="lbo" onclick="setLB('Owner',this)">👑 Owner</div><div class="pl" id="lbs" onclick="setLB('Staff',this)">👤 Staff</div></div></div><div class="fg"><label class="lb" id="lbl">Owner Name</label><input class="ip" id="lbp" placeholder="Name"></div><div class="fg"><label class="lb">Product</label><select class="sl2" id="lbpr">${opts}</select></div><div class="g2"><div class="fg"><label class="lb">Qty</label><input class="ip" id="lbq" type="number" placeholder="0"></div><div class="fg"><label class="lb">Cost ₨</label><input class="ip" id="lbc" type="number" placeholder="0"></div></div><div class="fg"><label class="lb">Notes</label><input class="ip" id="lbn" placeholder="Details..."></div><div class="ib" id="lbnt">👑 Posted to Owner Payable ledger.</div><button class="btn bp bw" onclick="saveLst()">💾 Record Lost</button></div>`;}
function setLB(b,el){lostBy=b;document.querySelectorAll('#lbo,#lbs').forEach(p=>p.classList.remove('active'));el.classList.add('active');if($('lbl'))$('lbl').textContent=b==='Owner'?'Owner Name':'Staff Name';if($('lbnt'))$('lbnt').textContent=b==='Owner'?'👑 Posted to Owner Payable ledger.':'👤 Posted to Employee ledger.';}
function saveLst(){const sku=$('lbpr')?.value;const qty=Number($('lbq')?.value||0);const cst=Number($('lbc')?.value||0);const per=$('lbp')?.value||lostBy;const nts=$('lbn')?.value||'';if(!sku||!qty)return;const p=db.products.find(p=>p.code===sku);if(!p)return;const id=`LST-${Date.now()}`;const d=td();const t=tn();const amt=qty*cst;const ok=atomic([()=>{p.stock=Math.max(0,Number(p.stock)-qty);db.movements.push({id:uid(),date:d,time:t,sku,name:p.name,category:p.category,type:`Lost - ${lostBy}`,qtyChange:-qty,cost:cst,value:amt,txnId:id,user:CU.name,reason:`${lostBy}: ${per}. ${nts}`});if(lostBy==='Owner')postEntry(id,d,'Owner','Owner Account',0,amt,`Item taken: ${p.name} x${qty}`);else postEntry(id,d,'Employee',per,0,amt,`Item taken: ${p.name} x${qty}`);postEntry(id,d,'Asset','Inventory',0,amt,`Lost: ${p.name}`);}]);if(ok)toast(`❌ Recorded! Stock -${qty}. Posted to ${lostBy} ledger`,'success');}

function rAgd(){const opts=db.products.map(p=>`<option value="${p.code}">${p.name} (${p.code})</option>`).join('');return`<div class="card"><div class="ctitle">🏷️ Aged / Discounted Sale</div><div class="fg"><label class="lb">Product</label><select class="sl2" id="agp" onchange="const p=db.products.find(p=>p.code===this.value);if(p&&$('agc'))$('agc').value=p.costPrice;calcAg();">${opts}</select></div><div class="g2"><div class="fg"><label class="lb">Qty</label><input class="ip" id="agq" type="number" placeholder="0" oninput="calcAg()"></div><div class="fg"><label class="lb">Cost ₨</label><input class="ip" id="agc" type="number" placeholder="0" oninput="calcAg()"></div></div><div class="fg"><label class="lb">Discounted Price ₨</label><input class="ip" id="agpr" type="number" placeholder="0" oninput="calcAg()"></div><div id="agprev" style="display:none" class="wb"></div><div class="fg"><label class="lb">Reason</label><input class="ip" id="agr" placeholder="Old season..."></div><button class="btn bo bw" onclick="saveAgd()">✅ Record Sale</button></div>`;}
function calcAg(){const q=Number($('agq')?.value||0);const c=Number($('agc')?.value||0);const pr=Number($('agpr')?.value||0);const p=$('agprev');if(!p)return;if(q>0&&c>0&&pr>0){const ls=(c-pr)*q;p.style.display='block';p.innerHTML=`<div style="display:flex;justify-content:space-between"><span>Cost</span><span>${fmt(c*q)}</span></div><div style="display:flex;justify-content:space-between;color:var(--gn)"><span>Sale</span><span>${fmt(pr*q)}</span></div><div style="display:flex;justify-content:space-between;font-weight:700;border-top:1px dashed var(--bd2);margin-top:5px;padding-top:5px;color:${ls>0?'var(--rd)':'var(--gn)'}"><span>${ls>0?'Loss':'Gain'}</span><span>${fmt(Math.abs(ls))}</span></div>`;}else p.style.display='none';}
function saveAgd(){const sku=$('agp')?.value;const qty=Number($('agq')?.value||0);const cst=Number($('agc')?.value||0);const pr=Number($('agpr')?.value||0);const rsn=$('agr')?.value||'';if(!sku||!qty||!pr)return;const p=db.products.find(p=>p.code===sku);if(!p)return;const id=`AGD-${Date.now()}`;const d=td();const t=tn();const mg=(pr-cst)*qty;const ok=atomic([()=>{p.stock=Math.max(0,Number(p.stock)-qty);db.movements.push({id:uid(),date:d,time:t,sku,name:p.name,category:p.category,type:'Aged Sale',qtyChange:-qty,cost:cst,price:pr,value:cst*qty,margin:mg,txnId:id,user:CU.name,reason:rsn});db.transactions.push({id,date:d,time:t,type:'Aged Sale',party:'Walk-in',payMode:'Cash',total:pr*qty,cost:cst*qty,margin:mg,user:CU.name,status:'done'});postEntry(id,d,'Cash','Cash Drawer',0,pr*qty,`Aged Sale: ${p.name}`);postEntry(id,d,'Expense','COGS',cst*qty,0,`Aged COGS ${sku}`);}]);if(ok){syncBatch([{sheet:'Sales',data:{billNo:id,date:d,sku,name:p.name,qty,cost:cst,price:pr,saleAmt:pr*qty,margin:mg,cust:'Aged Stock Sale',payMode:'Cash',notes:rsn,user:CU.name}}]);toast(`🏷️ Saved! ${mg<0?'Loss':'Margin'}: ${fmt(Math.abs(mg))}`,'success');}}

// ── LEDGER ──
const LTYPES={customers:{at:'Customer',crt:['Payment Received','Sale Return'],lbl:'Receivable',pc:'var(--gn)'},suppliers:{at:'Supplier',crt:['Purchase Return','Payment Made'],lbl:'Payable',pc:'var(--rd)'},owner:{at:'Owner',crt:['Owner Investment'],lbl:'Balance',pc:'var(--br)'},banks:{at:'Bank',crt:['Deposit','Transfer In'],lbl:'Balance',pc:'var(--gn)'},emoney:{at:'EMoney',crt:['Top Up','Payment Received'],lbl:'Balance',pc:'var(--gn)'},loans:{at:'Loan',crt:['Loan Received','Repayment Received'],lbl:'Balance',pc:'var(--br)'},employees:{at:'Employee',crt:['Salary','Advance Recovered'],lbl:'Balance',pc:'var(--rd)'}};

function rLed(){
  const tbs={customers:'👤 Customers',suppliers:'🏭 Suppliers',owner:'👑 Owner',banks:'🏦 Banks',emoney:'📱 E-Money',loans:'🤝 Loans',employees:'👥 Staff'};
  return`<div style="display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-bottom:14px">${Object.entries(tbs).map(([k,v])=>`<div class="pl ${k===lTab?'active':''}" onclick="setLTab('${k}',this)" style="white-space:nowrap">${v}</div>`).join('')}</div><div id="lcont"></div><button class="btn bp bw" onclick="openAddEntry()">➕ Add Entry</button>`;
}

function setLTab(t,el){lTab=t;document.querySelectorAll('.pl').forEach(p=>p.classList.remove('active'));el.classList.add('active');rLedContent();}

function rLedContent(){
  const c=$('lcont');if(!c)return;
  const cfg=LTYPES[lTab];
  const entries=db.ledger.filter(e=>e.accType===cfg.at);
  const parties={};
  entries.forEach(e=>{if(!parties[e.accName])parties[e.accName]={entries:[],bal:0};parties[e.accName].bal+=e.cr-e.dr;parties[e.accName].entries.push(e);});
  if(!Object.keys(parties).length){c.innerHTML='<div class="em"><div class="ei">📒</div><p>No entries yet.<br>Tap ➕ Add Entry.</p></div>';return;}
  const tot=Object.values(parties).reduce((s,p)=>s+p.bal,0);
  c.innerHTML=`<div class="card" style="background:var(--br);border:none;margin-bottom:12px"><div style="font-size:.6rem;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:.1em">${cfg.lbl} Total</div><div style="font-size:1.4rem;font-weight:700;color:white;margin-top:4px">${fmt(Math.abs(tot))}</div><div style="font-size:.6rem;color:rgba(255,255,255,.6);margin-top:2px">${Object.keys(parties).length} parties</div></div>${Object.entries(parties).map(([nm,dt])=>`<div class="lp" onclick="showStatement('${nm.replace(/'/g,"\\'")}')"><div style="display:flex;justify-content:space-between;align-items:center"><div><div style="font-size:.82rem;font-weight:700">${nm}</div><div style="font-size:.62rem;color:var(--tx3)">${dt.entries.length} transactions · Tap for statement</div></div><div style="text-align:right"><div class="pb" style="color:${dt.bal>=0?cfg.pc:'var(--rd)'}">${fmt(Math.abs(dt.bal))}</div><div style="font-size:.58rem;color:var(--tx3)">${cfg.lbl}</div></div></div>${dt.entries.length?`<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--cr2);display:flex;justify-content:space-between;font-size:.62rem;color:var(--tx3)"><span>${dt.entries[dt.entries.length-1].date} · ${dt.entries[dt.entries.length-1].notes||''}</span><span style="font-weight:700;color:${dt.entries[dt.entries.length-1].cr>0?'var(--gn)':'var(--rd)'}">${dt.entries[dt.entries.length-1].cr>0?'+':'-'}${fmt(Math.max(dt.entries[dt.entries.length-1].cr,dt.entries[dt.entries.length-1].dr))}</span></div>`:''}</div>`).join('')}`;
}

function showStatement(party){
  const cfg=LTYPES[lTab];const entries=db.ledger.filter(e=>e.accName===party&&e.accType===cfg.at);
  let run=0;const rows=entries.map(e=>{run+=e.cr-e.dr;return{...e,run};});
  openModal(party,`<div style="background:var(--cr2);border-radius:10px;padding:12px;margin-bottom:14px;display:flex;justify-content:space-between"><div><div style="font-size:.6rem;color:var(--tx3);text-transform:uppercase">${cfg.lbl}</div><div style="font-size:1.2rem;font-weight:700;color:${run>=0?cfg.pc:'var(--rd)'}">${fmt(Math.abs(run))}</div></div><div style="text-align:right"><div style="font-size:.6rem;color:var(--tx3)">Transactions</div><div style="font-size:1rem;font-weight:700">${entries.length}</div></div></div>
  <div style="border:1px solid var(--bd2);border-radius:10px;overflow:hidden"><div class="tr2 hd"><div>Date/Type</div><div style="text-align:right">DR</div><div style="text-align:right">CR</div><div style="text-align:right">Bal</div></div>${rows.map(r=>`<div class="tr2"><div><div style="font-size:.65rem;font-weight:600">${r.date}</div><div style="font-size:.58rem;color:var(--tx3)">${r.notes||''}</div></div><div style="text-align:right;color:var(--rd);font-size:.7rem">${r.dr>0?fmt(r.dr):''}</div><div style="text-align:right;color:var(--gn);font-size:.7rem">${r.cr>0?fmt(r.cr):''}</div><div style="text-align:right;font-weight:700;font-size:.7rem;color:${r.run>=0?cfg.pc:'var(--rd)'}">${fmt(Math.abs(r.run))}</div></div>`).join('')}<div class="tr2" style="background:var(--cr2)"><div style="font-weight:700;color:var(--br)">Closing</div><div></div><div></div><div style="text-align:right;font-weight:700;color:${run>=0?cfg.pc:'var(--rd)'}">${fmt(Math.abs(run))}</div></div></div>`);
}

function openAddEntry(){
  const cfg=LTYPES[lTab];
  openModal(`➕ ${cfg.at} Entry`,`<div class="fg"><label class="lb">Party</label><input class="ip" id="lep" placeholder="Name"></div><div class="fg"><label class="lb">Date</label><input class="ip" id="led2" type="date" value="${new Date().toISOString().split('T')[0]}"></div><div class="fg"><label class="lb">Type</label><select class="sl2" id="let"><option>Sale Credit</option><option>Payment Received</option><option>Purchase Credit</option><option>Payment Made</option><option>Owner Investment</option><option>Owner Withdrawal</option><option>Deposit</option><option>Withdrawal</option><option>Loan Received</option><option>Repayment Made</option><option>Advance Given</option><option>Salary Paid</option></select></div><div class="fg"><label class="lb">Amount ₨</label><input class="ip" id="lea" type="number" placeholder="0"></div><div class="fg"><label class="lb">Notes</label><input class="ip" id="len" placeholder="Optional"></div><button class="btn bp bw" onclick="saveEntry()">💾 Save</button>`);
}

function saveEntry(){
  const party=$('lep')?.value?.trim();const date=$('led2')?.value;const type=$('let')?.value;const amt=Number($('lea')?.value||0);const notes=$('len')?.value||'';
  if(!party||!amt){toast('Fill party and amount','error');return;}
  const cfg=LTYPES[lTab];const isCr=cfg.crt.includes(type);const id=`MAN-${Date.now()}`;
  const ok=atomic([()=>{postEntry(id,date||td(),cfg.at,party,isCr?0:amt,isCr?amt:0,`${type}: ${notes}`);}]);
  if(ok){syncBatch([{sheet:lTab==='customers'?'Customers':'Suppliers',data:{date:date||td(),party,type,amount:amt,notes,user:CU.name}}]);closeModal();toast(`✅ Entry saved!`,'success');rLedContent();}
}

// ── REPORTS ──
function rRep(){return`<div style="display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-bottom:14px"><div class="pl active" onclick="setRTab('sales',this)">📊 Sales</div><div class="pl" onclick="setRTab('stock',this)">📦 Stock</div><div class="pl" onclick="setRTab('cash',this)">💵 Cash</div><div class="pl" onclick="setRTab('pl',this)">📈 P&L</div></div><div class="df"><input class="ip" id="rfrom" type="date" value="${new Date().toISOString().split('T')[0]}" style="flex:1"><input class="ip" id="rto" type="date" value="${new Date().toISOString().split('T')[0]}" style="flex:1"><button class="btn bp bsm" onclick="genRep()">Go</button></div><div id="rcont"></div>`;}
function iRep(){genRep();}
function setRTab(t,el){rTab=t;document.querySelectorAll('.pl').forEach(p=>p.classList.remove('active'));el.classList.add('active');genRep();}
function genRep(){
  const from=$('rfrom')?.value||td();const to=$('rto')?.value||td();const c=$('rcont');if(!c)return;
  const txns=db.transactions.filter(t=>t.date>=from&&t.date<=to&&t.status==='done');
  switch(rTab){
    case'sales':c.innerHTML=genSalesRep(txns,from,to);break;
    case'stock':c.innerHTML=genStockRep();break;
    case'cash':c.innerHTML=genCashRep(from,to);break;
    case'pl':c.innerHTML=genPLRep(txns,from,to);break;
  }
}
function genSalesRep(txns,from,to){
  const sl=txns.filter(t=>t.type==='Sale'||t.type==='Aged Sale');
  const ts=sl.reduce((s,t)=>s+Number(t.total||0),0);const tm=sl.reduce((s,t)=>s+Number(t.margin||0),0);
  const cs=sl.filter(t=>t.payMode==='Cash').reduce((s,t)=>s+Number(t.total||0),0);const cr=sl.filter(t=>t.payMode==='Credit').reduce((s,t)=>s+Number(t.total||0),0);const bk=sl.filter(t=>t.payMode==='Bank').reduce((s,t)=>s+Number(t.total||0),0);
  const catB={};db.lines.filter(l=>sl.find(s=>s.id===l.txnId)).forEach(l=>{if(!catB[l.category])catB[l.category]={qty:0,amt:0};catB[l.category].qty+=Number(l.qty||0);catB[l.category].amt+=Number(l.lineTotal||0);});
  return`<div class="sg"><div class="sc2"><div class="sl">Total Sales</div><div class="sv">${fmt(ts)}</div><div class="ss">${sl.length} bills</div></div><div class="sc2 gn"><div class="sl">Gross Margin</div><div class="sv">${fmt(tm)}</div><div class="ss">${ts>0?((tm/ts)*100).toFixed(1):0}%</div></div></div>
  <div style="margin-bottom:14px"><div class="rh"><div>Payment Method</div><div>${fmt(ts)}</div></div><div class="rw"><span>💵 Cash</span><span>${fmt(cs)}</span></div><div class="rw"><span>📋 Credit</span><span>${fmt(cr)}</span></div><div class="rw"><span>🏦 Bank</span><span>${fmt(bk)}</span></div><div class="rf"><span>Total</span><span>${fmt(ts)}</span></div></div>
  <div style="margin-bottom:14px"><div class="rh"><div>Category</div></div>${Object.entries(catB).map(([c,d])=>`<div class="rw"><span>${ce(c)} ${c} (${d.qty})</span><span>${fmt(d.amt)}</span></div>`).join('')}<div class="rf"><span>Total</span><span>${fmt(ts)}</span></div></div>
  <div style="margin-bottom:14px"><div class="rh"><div>Transactions</div></div>${sl.slice().reverse().map(t=>`<div class="rw"><span><div style="font-size:.72rem;font-weight:600">${t.id}</div><div style="font-size:.6rem;color:var(--tx3)">${t.date} · ${t.party||'Walk-in'} · ${t.payMode}</div></span><span style="text-align:right"><div style="font-size:.72rem;font-weight:700">${fmt(t.total)}</div><div style="font-size:.6rem;color:var(--gn)">+${fmt(t.margin)}</div></span></div>`).join('')}</div>`;
}
function genStockRep(){
  const cats={};db.products.forEach(p=>{if(!cats[p.category]){cats[p.category]={items:[],qty:0,val:0};}cats[p.category].items.push(p);cats[p.category].qty+=Number(p.stock);cats[p.category].val+=Number(p.stock)*Number(p.costPrice);});
  const tv=db.products.reduce((s,p)=>s+Number(p.stock)*Number(p.costPrice),0);
  return Object.entries(cats).map(([c,d])=>`<div style="margin-bottom:14px"><div class="rh"><div>${ce(c)} ${c}</div><div>Qty: ${d.qty} · ${fmt(d.val)}</div></div>${d.items.map(p=>`<div class="rw"><span><div style="font-size:.72rem">${p.name}</div><div style="font-size:.6rem;color:var(--tx3)">${p.colour||''}${p.size?' · '+p.size:''}</div></span><span style="text-align:right"><div style="font-weight:700;color:${Number(p.stock)<=2?'var(--rd)':'var(--gn)'}">${p.stock} pcs</div><div style="font-size:.6rem;color:var(--tx3)">${fmt(Number(p.stock)*Number(p.costPrice))}</div></span></div>`).join('')}<div class="rf"><span>Subtotal</span><span>${fmt(d.val)}</span></div></div>`).join('')+`<div style="background:var(--br);color:white;border-radius:10px;padding:12px 14px;display:flex;justify-content:space-between"><span style="font-weight:700">GRAND TOTAL</span><span style="font-weight:700">${fmt(tv)}</span></div>`;
}
function genCashRep(from,to){
  const ob=ld('sl3_ob',{}).amount||0;const ce2=db.ledger.filter(e=>e.accType==='Cash'&&e.date>=from&&e.date<=to);
  const ti=ce2.reduce((s,e)=>s+e.cr,0);const to2=ce2.reduce((s,e)=>s+e.dr,0);const cl=ob+ti-to2;
  return`<div class="sg"><div class="sc2 gn"><div class="sl">Total In</div><div class="sv">${fmt(ti)}</div></div><div class="sc2 rd"><div class="sl">Total Out</div><div class="sv">${fmt(to2)}</div></div></div>
  <div style="margin-bottom:14px"><div class="rh"><div>Cash Flow</div></div><div class="rw"><span>Opening Balance</span><span>${fmt(ob)}</span></div><div class="rw"><span style="color:var(--gn)">+ Inflow</span><span style="color:var(--gn)">${fmt(ti)}</span></div><div class="rw"><span style="color:var(--rd)">- Outflow</span><span style="color:var(--rd)">${fmt(to2)}</span></div><div class="rf"><span>Closing Balance</span><span>${fmt(cl)}</span></div></div>
  <div style="margin-bottom:14px"><div class="rh"><div>Details</div></div>${ce2.slice().reverse().map(e=>`<div class="rw"><span><div style="font-size:.72rem">${e.notes||''}</div><div style="font-size:.6rem;color:var(--tx3)">${e.date} · ${e.user||''}</div></span><span style="font-weight:700;color:${e.cr>0?'var(--gn)':'var(--rd)'}">${e.cr>0?'+'+fmt(e.cr):'-'+fmt(e.dr)}</span></div>`).join('')}</div>`;
}
function genPLRep(txns,from,to){
  const sl=txns.filter(t=>t.type==='Sale'||t.type==='Aged Sale');
  const rev=sl.reduce((s,t)=>s+Number(t.total||0),0);const cst=sl.reduce((s,t)=>s+Number(t.cost||0),0);const gp=rev-cst;
  const exp=db.ledger.filter(e=>e.accType==='Expense'&&e.date>=from&&e.date<=to&&e.accName!=='COGS').reduce((s,e)=>s+e.dr,0);const np=gp-exp;
  return`<div style="margin-bottom:14px"><div class="rh"><div>Profit & Loss</div><div>${from} to ${to}</div></div><div class="rw"><span style="font-weight:700">Revenue</span><span style="font-weight:700">${fmt(rev)}</span></div><div class="rw"><span style="color:var(--rd)">- Cost of Goods</span><span style="color:var(--rd)">- ${fmt(cst)}</span></div><div class="rw" style="background:var(--cr2)"><span style="font-weight:700;color:var(--gn)">Gross Profit</span><span style="font-weight:700;color:var(--gn)">${fmt(gp)}</span></div><div class="rw"><span style="color:var(--rd)">- Expenses</span><span style="color:var(--rd)">- ${fmt(exp)}</span></div><div class="rf" style="color:${np>=0?'var(--gn)':'var(--rd)'}"><span>Net Profit</span><span>${fmt(np)}</span></div></div>
  <div class="sg"><div class="sc2 gn"><div class="sl">Gross %</div><div class="sv">${rev>0?((gp/rev)*100).toFixed(1):0}%</div></div><div class="sc2 ${np>=0?'gn':'rd'}"><div class="sl">Net %</div><div class="sv">${rev>0?((np/rev)*100).toFixed(1):0}%</div></div></div>`;
}

// ── CASH ──
function rCash(){return`<div class="sb"><div class="sd"></div><span class="st2">Synced</span></div><div class="stl">💵 Cash Entry</div><div class="card"><div class="fg"><label class="lb">Date</label><input class="ip" id="cdt" type="date" value="${new Date().toISOString().split('T')[0]}"></div><div class="fg"><label class="lb">Category</label><select class="sl2" id="ccat"><option>Team Daily</option><option>Rent</option><option>Electricity</option><option>Committee</option><option>Salary</option><option>Transport</option><option>Loan Given</option><option>Loan Received</option><option>Owner Withdrawal</option><option>Owner Deposit</option><option>Other</option></select></div><div class="fg"><label class="lb">Description</label><input class="ip" id="cdsc" placeholder="Details..."></div><div class="g2"><div class="fg"><label class="lb">Amount In ₨</label><input class="ip" id="cin" type="number" placeholder="0"></div><div class="fg"><label class="lb">Amount Out ₨</label><input class="ip" id="cout" type="number" placeholder="0"></div></div><button class="btn bp bw" onclick="saveCash()">💾 Save Entry</button></div><div class="stl">Recent</div><div id="clist"></div>`;}
function iCash(){rCashList();}
function saveCash(){const dt=$('cdt')?.value||td();const cat=$('ccat')?.value;const dsc=$('cdsc')?.value?.trim();const ai=Number($('cin')?.value||0);const ao=Number($('cout')?.value||0);if(!dsc||(!ai&&!ao)){toast('Fill description and amount','error');return;}const id=`CE-${Date.now()}`;const ok=atomic([()=>{postEntry(id,dt,'Cash','Cash Drawer',ao,ai,`${cat}: ${dsc}`);}]);if(ok){syncBatch([{sheet:'Cash Register',data:{date:dt,nature:dsc,category:cat,amountIn:ai,amountOut:ao,user:CU.name}}]);toast(`✅ Saved!`,'success');if($('cdsc'))$('cdsc').value='';if($('cin'))$('cin').value='';if($('cout'))$('cout').value='';rCashList();}}
function rCashList(){const c=$('clist');if(!c)return;const es=db.ledger.filter(e=>e.accType==='Cash').slice(-20).reverse();if(!es.length){c.innerHTML='<div class="em"><div class="ei">💵</div><p>No entries</p></div>';return;}c.innerHTML=es.map(e=>`<div class="card" style="padding:10px 12px;margin-bottom:8px"><div style="display:flex;justify-content:space-between"><div><div style="font-size:.73rem;font-weight:600">${e.notes||''}</div><div style="font-size:.6rem;color:var(--tx3)">${e.date} · ${e.user||''}</div></div><div style="text-align:right">${e.cr>0?`<div style="font-size:.72rem;font-weight:700;color:var(--gn)">+${fmt(e.cr)}</div>`:''}${e.dr>0?`<div style="font-size:.72rem;font-weight:700;color:var(--rd)">-${fmt(e.dr)}</div>`:''}</div></div></div>`).join('');}

window.addEventListener('load',()=>{loadDB();$('ls').style.display='flex';$('app').style.display='none';});
</script>
