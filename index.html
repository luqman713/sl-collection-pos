async function genRep(){
  const from=$('r-from')?.value||today();const to=$('r-to')?.value||today();
  const c=$('rep-content');if(!c)return;
  c.innerHTML='<div class="empty"><div class="spin" style="border-top-color:var(--gold);border-color:rgba(0,0,0,.1);width:24px;height:24px;margin:0 auto"></div></div>';
  switch(rTab){case'sales':await repSales(from,to,c);break;case'purchase':await repPurchase(from,to,c);break;case'stock':await repStock(c);break;case'ageing':await repAgeing(c);break;case'cash':await repCash(from,to,c);break;case'pl':await repPL(from,to,c);break;case'seasonal':await repSeasonal(c);break;case'ledger':await repLedger(c);break;}
}

async function repSales(from,to,c){
  const{data:sales}=await sb.from('sales').select('*,transactions(transaction_no,is_cancelled,is_reversed)').gte('sale_date',from).lte('sale_date',to).order('sale_date',{ascending:false});
  const valid=(sales||[]).filter(s=>!s.transactions?.is_cancelled&&!s.transactions?.is_reversed);
  const tot=valid.reduce((s,t)=>s+Number(t.total_amount||0),0);const mg=valid.reduce((s,t)=>s+Number(t.gross_profit||0),0);
  const cash=valid.filter(s=>s.payment_mode==='cash').reduce((s,t)=>s+Number(t.total_amount||0),0);
  const credit=valid.filter(s=>s.payment_mode==='credit').reduce((s,t)=>s+Number(t.total_amount||0),0);
  const bank=valid.filter(s=>s.payment_mode==='bank'||s.payment_mode==='emoney').reduce((s,t)=>s+Number(t.total_amount||0),0);
  lastRepTitle=`Sales_${from}_to_${to}`;lastRepData=valid.map(s=>({Date:s.sale_date,Bill:s.transactions?.transaction_no||'',Customer:s.customer_name,Amount:s.total_amount,Profit:s.gross_profit,PayMode:s.payment_mode}));
  c.innerHTML=`<div class="stat-grid"><div class="stat-card"><div class="stat-lbl">Total Sales</div><div class="stat-val">${fmt(tot)}</div><div class="stat-sub">${valid.length} bills</div></div><div class="stat-card sage"><div class="stat-lbl">Gross Margin</div><div class="stat-val">${fmt(mg)}</div><div class="stat-sub">${tot>0?((mg/tot)*100).toFixed(1):0}%</div></div></div><div style="margin-bottom:14px"><div class="rpt-hdr"><div>Payment Breakdown</div><div>${fmt(tot)}</div></div><div class="rpt-row"><span>💵 Cash</span><span>${fmt(cash)}</span></div><div class="rpt-row"><span>📋 Credit</span><span>${fmt(credit)}</span></div><div class="rpt-row"><span>🏦 Bank/E-Money</span><span>${fmt(bank)}</span></div><div class="rpt-foot"><span>Total</span><span>${fmt(tot)}</span></div></div><div style="margin-bottom:14px"><div class="rpt-hdr"><div>Transactions</div></div>${valid.map(s=>`<div class="rpt-row"><span><div class="t-sm fw-6">${s.transactions?.transaction_no||''}</div><div class="t-xs c-ink3">${s.sale_date} · ${s.customer_name} · ${s.payment_mode}</div></span><span style="text-align:right"><div class="t-sm fw-7">${fmt(s.total_amount)}</div><div class="t-xs c-sage fw-6">+${fmt(s.gross_profit)}</div></span></div>`).join('')}</div>`;
  await loadAnnotations(c,'monthly',from);
}

async function repPurchase(from,to,c){
  const{data:purs}=await sb.from('purchases').select('*,transactions(transaction_no),parties(name)').gte('purchase_date',from).lte('purchase_date',to).order('purchase_date',{ascending:false});
  const tot=(purs||[]).reduce((s,t)=>s+Number(t.total_amount||0),0);const paid=(purs||[]).reduce((s,t)=>s+Number(t.paid_amount||0),0);const payable=(purs||[]).reduce((s,t)=>s+Number(t.payable_amount||0),0);

async function repStock(c){
  const{data:inv}=await sb.rpc('get_inventory_report');lastRepTitle='Stock_Report';lastRepData=(inv||[]).map(r=>({SKU:r.sku,Name:r.product_name,Category:r.category,Colour:r.colour,Size:r.size,Cost:r.purchase_price,Stock:r.qty_available,Value:r.stock_value,AgeDays:r.age_days,Status:r.status}));
  const cats={};(inv||[]).forEach(p=>{if(!cats[p.category])cats[p.category]={items:[],qty:0,val:0};cats[p.category].items.push(p);cats[p.category].qty+=Number(p.qty_available);cats[p.category].val+=Number(p.stock_value);});
  const tv=(inv||[]).reduce((s,p)=>s+Number(p.stock_value),0);
  c.innerHTML=Object.entries(cats).map(([cat,d])=>`<div style="margin-bottom:14px"><div class="rpt-hdr"><div>${emo(cat)} ${cat}</div><div>Qty: ${d.qty} · ${fmt(d.val)}</div></div>${d.items.map(p=>`<div class="rpt-row"><span><div class="t-sm">${p.product_name}</div><div class="t-xs c-ink3">${p.colour||''}${p.size?' · '+p.size:''}</div></span><span style="text-align:right"><div class="fw-7" style="color:${p.qty_available<=2?'var(--red)':'var(--sage)'}">${p.qty_available} pcs</div><div class="t-xs c-ink3">${fmt(p.stock_value)}</div></span></div>`).join('')}<div class="rpt-foot"><span>Subtotal</span><span>${fmt(d.val)}</span></div></div>`).join('')+`<div style="background:var(--ink);color:white;border-radius:10px;padding:12px 15px;display:flex;justify-content:space-between"><span class="fw-7">GRAND TOTAL</span><span class="fw-7">${fmt(tv)}</span></div>`;
}

async function repAgeing(c){
  const{data:inv}=await sb.rpc('get_inventory_report');
  const a90=(inv||[]).filter(p=>p.age_days>=90);const a60=(inv||[]).filter(p=>p.age_days>=60&&p.age_days<90);const a30=(inv||[]).filter(p=>p.age_days>=30&&p.age_days<60);const fresh=(inv||[]).filter(p=>p.age_days<30);
  lastRepTitle='Ageing_Report';lastRepData=(inv||[]).map(r=>({SKU:r.sku,Name:r.product_name,Category:r.category,Stock:r.qty_available,Value:r.stock_value,Age:r.age_days,Status:r.status}));

  c.innerHTML=`<div class="stat-grid"><div class="stat-card red"><div class="stat-lbl">Dead (90d+)</div><div class="stat-val">${a90.length}</div></div><div class="stat-card rust"><div class="stat-lbl">Slow (60-90d)</div><div class="stat-val">${a60.length}</div></div><div class="stat-card gold"><div class="stat-lbl">Ageing (30-60d)</div><div class="stat-val">${a30.length}</div></div><div class="stat-card sage"><div class="stat-lbl">Fresh</div><div class="stat-val">${fresh.length}</div></div></div>`+grp('🔴 Dead Stock',a90,'#8B1A1A')+grp('🟠 Slow Moving',a60,'#8B4500')+grp('🟡 Ageing',a30,'#7A6000')+grp('🟢 Fresh',fresh,'#2D4A2D');
}

async function repCash(from,to,c){
  const cashAcc=accounts.find(a=>a.name==='Cash Drawer');if(!cashAcc){c.innerHTML='<div class="empty"><p>Cash Drawer not found</p></div>';return;}
  const{data:stmt}=await sb.rpc('get_cashflow_statement',{p_account_id:cashAcc.id,p_from:from,p_to:to});
  const ti=(stmt||[]).reduce((s,e)=>s+Number(e.money_in||0),0);const to2=(stmt||[]).reduce((s,e)=>s+Number(e.money_out||0),0);const cl=(stmt||[]).length?stmt[stmt.length-1].running_balance||0:cashAcc.current_balance;
  lastRepTitle=`Cash_${from}_to_${to}`;lastRepData=(stmt||[]).map(r=>({Date:r.entry_date,TxnNo:r.transaction_no,Desc:r.description,In:r.money_in,Out:r.money_out,Balance:r.running_balance}));
  c.innerHTML=`<div class="stat-grid"><div class="stat-card sage"><div class="stat-lbl">Total In</div><div class="stat-val">${fmt(ti)}</div></div><div class="stat-card red"><div class="stat-lbl">Total Out</div><div class="stat-val">${fmt(to2)}</div></div></div><div style="margin-bottom:14px"><div class="rpt-hdr"><div>Cash Flow</div></div><div class="rpt-row"><span>Opening</span><span>${fmt(cashAcc.opening_balance)}</span></div><div class="rpt-row"><span style="color:var(--sage)">+ Inflow</span><span style="color:var(--sage)">${fmt(ti)}</span></div><div class="rpt-row"><span style="color:var(--red)">- Outflow</span><span style="color:var(--red)">${fmt(to2)}</span></div><div class="rpt-foot"><span>Closing</span><span>${fmt(cl)}</span></div></div><div style="margin-bottom:14px"><div class="rpt-hdr"><div>Details</div></div>${(stmt||[]).slice().reverse().map(e=>`<div class="rpt-row"><span><div class="t-sm">${e.description||''}</div><div class="t-xs c-ink3">${e.entry_date||''}</div></span><span style="font-weight:700;color:${(e.money_in||0)>0?'var(--sage)':'var(--red)'}">${(e.money_in||0)>0?'+'+fmt(e.money_in):'-'+fmt(e.money_out)}</span></div>`).join('')}</div>`;
}

async function repPL(from,to,c){
  const{data:sales}=await sb.from('sales').select('total_amount,gross_profit').gte('sale_date',from).lte('sale_date',to);
  const{data:exps}=await sb.from('cash_entries').select('amount').gte('entry_date',from).lte('entry_date',to).eq('direction','out');
  const rev=(sales||[]).reduce((s,t)=>s+Number(t.total_amount||0),0);const gp=(sales||[]).reduce((s,t)=>s+Number(t.gross_profit||0),0);const cogs=rev-gp;const exp=(exps||[]).reduce((s,t)=>s+Number(t.amount||0),0);const np=gp-exp;
  lastRepTitle=`PnL_${from}_to_${to}`;lastRepData=[{Revenue:rev,COGS:cogs,GrossProfit:gp,Expenses:exp,NetProfit:np}];
  c.innerHTML=`<div style="margin-bottom:14px"><div class="rpt-hdr"><div>Profit & Loss</div><div>${from} to ${to}</div></div><div class="rpt-row"><span class="fw-7">Revenue</span><span class="fw-7">${fmt(rev)}</span></div><div class="rpt-row"><span style="color:var(--red)">- Cost of Goods</span><span style="color:var(--red)">- ${fmt(cogs)}</span></div><div class="rpt-row" style="background:var(--cream2)"><span class="fw-7 c-sage">Gross Profit</span><span class="fw-7 c-sage">${fmt(gp)}</span></div><div class="rpt-row"><span style="color:var(--red)">- Expenses</span><span style="color:var(--red)">- ${fmt(exp)}</span></div><div class="rpt-foot" style="color:${np>=0?'var(--sage)':'var(--red)'}"><span>Net Profit</span><span>${fmt(np)}</span></div></div><div class="stat-grid"><div class="stat-card sage"><div class="stat-lbl">Gross Margin</div><div class="stat-val">${rev>0?((gp/rev)*100).toFixed(1):0}%</div></div><div class="stat-card ${np>=0?'sage':'red'}"><div class="stat-lbl">Net Margin</div><div class="stat-val">${rev>0?((np/rev)*100).toFixed(1):0}%</div></div></div>`;
  await loadAnnotations(c,'monthly',from);
}

async function repSeasonal(c){
  const{data:seasons}=await sb.rpc('get_seasonal_comparison',{p_season_type:'eid',p_years:7});
  lastRepTitle='Seasonal_Comparison';lastRepData=(seasons||[]).map(s=>({Season:s.season_name,Year:s.year,Revenue:s.total_revenue,Units:s.total_units,Profit:s.gross_profit,Margin:s.margin_pct,Bills:s.bill_count,YoY:s.yoy_growth}));
  c.innerHTML=`<div class="warn-box">Showing Eid seasons (7 years). Add seasons in Supabase seasonal_periods table to customize.</div>${(seasons||[]).map(s=>`<div class="card" style="padding:13px"><div class="flex just-b items-c" style="margin-bottom:8px"><div><div class="t-base fw-7">${s.season_name}</div><div class="t-xs c-ink3">${s.start_date} to ${s.end_date}</div></div>${s.yoy_growth!=null?`<div class="bdg ${s.yoy_growth>=0?'bdg-sage':'bdg-red'}">${s.yoy_growth>=0?'▲':'▼'} ${Math.abs(s.yoy_growth)}% YoY</div>`:''}</div><div class="g3"><div style="text-align:center"><div class="t-xs c-ink3">Revenue</div><div class="t-sm fw-7">${fmt(s.total_revenue)}</div></div><div style="text-align:center"><div class="t-xs c-ink3">Profit</div><div class="t-sm fw-7 c-sage">${fmt(s.gross_profit)}</div></div><div style="text-align:center"><div class="t-xs c-ink3">Bills</div><div class="t-sm fw-7">${s.bill_count}</div></div></div>${(s.annotations||[]).length?`<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--cream2)">${(s.annotations||[]).map(a=>`<div class="t-xs c-ink3">💬 ${a.comment}</div>`).join('')}</div>`:''}<button class="btn btn-ghost btn-xs btn-full" style="margin-top:8px" onclick="addAnnotation('seasonal','${s.season_name}')">➕ Add Note</button></div>`).join('')}`;
}

async function repLedger(c){
  const custBal=parties.filter(p=>p.party_type==='customer'&&p.current_balance>0);const supBal=parties.filter(p=>p.party_type==='supplier'&&p.current_balance>0);
  const totRec=custBal.reduce((s,p)=>s+p.current_balance,0);const totPay=supBal.reduce((s,p)=>s+p.current_balance,0);
  lastRepTitle='Ledger_Summary';lastRepData=[...custBal.map(p=>({Type:'Customer',Party:p.name,Balance:p.current_balance})),...supBal.map(p=>({Type:'Supplier',Party:p.name,Balance:p.current_balance}))];
  c.innerHTML=`<div class="stat-grid"><div class="stat-card rust"><div class="stat-lbl">Receivables</div><div class="stat-val">${fmt(totRec)}</div></div><div class="stat-card red"><div class="stat-lbl">Payables</div><div class="stat-val">${fmt(totPay)}</div></div></div><div style="margin-bottom:14px"><div class="rpt-hdr"><div>👤 Customer Outstanding</div><div>${fmt(totRec)}</div></div>${custBal.map(p=>`<div class="rpt-row"><span>${p.name}</span><span class="fw-7" style="color:var(--rust)">${fmt(p.current_balance)}</span></div>`).join('')||'<div style="padding:10px;text-align:center;font-size:.72rem;color:var(--ink3)">No outstanding</div>'}<div class="rpt-foot"><span>Total</span><span>${fmt(totRec)}</span></div></div><div style="margin-bottom:14px"><div class="rpt-hdr"><div>🏭 Supplier Payables</div><div>${fmt(totPay)}</div></div>${supBal.map(p=>`<div class="rpt-row"><span>${p.name}</span><span class="fw-7" style="color:var(--red)">${fmt(p.current_balance)}</span></div>`).join('')||'<div style="padding:10px;text-align:center;font-size:.72rem;color:var(--ink3)">No outstanding</div>'}<div class="rpt-foot"><span>Total</span><span>${fmt(totPay)}</span></div></div>`;
}

async function loadAnnotations(container,type,month){
  const{data:anns}=await sb.from('report_annotations').select('*').eq('annotation_type',type).eq('ref_month',month?.substring(0,7));
  if((anns||[]).length){const div=document.createElement('div');div.className='warn-box';div.innerHTML=`💬 Notes:<br>`+(anns||[]).map(a=>`<div style="margin-top:5px;padding-top:5px;border-top:1px dashed var(--border2)"><strong>${a.reason_code||'Note'}:</strong> ${a.comment}</div>`).join('');container.appendChild(div);}
  const addBtn=document.createElement('button');addBtn.className='btn btn-ghost btn-full';addBtn.style.marginTop='8px';addBtn.textContent='➕ Add Note to This Period';addBtn.onclick=()=>addAnnotation(type,month);container.appendChild(addBtn);
}

function addAnnotation(type,ref){openMo('➕ Add Note',`<div class="info-box">Add a comment explaining trends or events.</div><div class="fg"><label class="lbl">Comment *</label><textarea class="inp" id="ann-c" placeholder="Explain what happened..." rows="3" style="resize:vertical"></textarea></div><div class="fg"><label class="lbl">Reason</label><select class="sel" id="ann-r"><option value="">Select...</option><option>eid_rush</option><option>price_increase</option><option>low_stock</option><option>market_event</option><option>supplier_issue</option><option>weather</option><option>competition</option><option>promotion</option><option>other</option></select></div><div class="fg"><label class="lbl">Action Taken</label><input class="inp" id="ann-a" placeholder="What was done?"></div><div class="fg"><label class="lbl">Follow-up Date</label><input class="inp" id="ann-f" type="date"></div><button class="btn btn-ink btn-full" onclick="saveAnnotation('${type}','${ref}')">💾 Save Note</button>`);}

async function saveAnnotation(type,ref){
  const comment=$('ann-c')?.value?.trim();if(!comment){toast('Enter comment','err');return;}
  const{error}=await sb.from('report_annotations').insert({annotation_type:type,ref_month:type==='monthly'?ref?.substring(0,7):null,ref_year:new Date().getFullYear(),comment,reason_code:$('ann-r')?.value||null,action_taken:$('ann-a')?.value||null,follow_up_date:$('ann-f')?.value||null,created_by:CUP?.id});
  if(error){toast('Error: '+error.message,'err');return;}
  closeMo();toast('✅ Note saved!','ok');genRep();
}

// ── CASH ──
function rCash(){
  const cashAcc=accounts.find(a=>a.name==='Cash Drawer');const bal=cashAcc?.current_balance||0;
  return`<div style="background:var(--ink);color:white;border-radius:var(--r2);padding:18px;margin-bottom:16px"><div class="t-xs upper" style="color:rgba(255,255,255,.5);letter-spacing:.15em">Cash Drawer Balance</div><div style="font-family:'Cormorant Garamond',serif;font-size:2.2rem;font-weight:700;margin:6px 0">${fmt(bal)}</div><div class="flex gap-3" style="flex-wrap:wrap">${accounts.map(a=>`<div><div class="t-xs" style="color:rgba(255,255,255,.4)">${a.name}</div><div class="t-xs fw-6" style="color:${a.current_balance>=0?'#90EE90':'#FFB3B3'}">${fmt(a.current_balance)}</div></div>`).join('')}</div></div><div class="card"><div class="card-title">➕ New Entry</div><div class="fg"><label class="lbl">Date</label><input class="inp" id="c-dt" type="date" value="${today()}"></div><div class="fg"><label class="lbl">Category</label><select class="sel" id="c-cat" style="font-size:.78rem"></select></div><div class="fg"><label class="lbl">Description</label><input class="inp" id="c-dsc" placeholder="Details..."></div><div class="fg"><label class="lbl">Direction</label><select class="sel" id="c-dir"><option value="in">💰 Money In</option><option value="out">💸 Money Out</option></select></div><div class="fg"><label class="lbl">Amount ₨</label><input class="inp" id="c-amt" type="number" placeholder="0"></div><div class="fg"><label class="lbl">Account</label><select class="sel" id="c-acc">${accounts.map(a=>`<option value="${a.id}">${a.name} (${fmt(a.current_balance)})</option>`).join('')}</select></div><button class="btn btn-ink btn-full" onclick="saveCashEntry()">💾 Save</button></div><div class="flex just-b items-c" style="margin-bottom:8px"><div class="t-xs upper fw-7 c-ink3">Recent</div><button class="btn btn-ghost btn-xs" onclick="exportCash()">📥 Export</button></div><div id="cash-list"></div>`;
}

async function iCash(){
  const{data:cats}=await sb.from('expense_categories').select('*').eq('is_active',true).order('sort_order');
  const sel=$('c-cat');if(sel&&cats)sel.innerHTML=cats.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
  loadCashEntries();
}

async function saveCashEntry(){
  const dt=$('c-dt')?.value||today();const catId=$('c-cat')?.value;const dsc=$('c-dsc')?.value?.trim();const amt=Number($('c-amt')?.value||0);const dir=$('c-dir')?.value||'out';const accId=$('c-acc')?.value;
  if(!amt||!dsc){toast('Fill all','err');return;}
  const{data:txNo}=await sb.rpc('generate_transaction_no',{p_prefix:'CASH'});
  try{
    const{data:txn}=await sb.from('transactions').insert({transaction_no:txNo,transaction_type:dir==='in'?'receipt':'expense',transaction_date:dt,total_amount:amt,paid_amount:amt,payment_status:'paid',performed_by:CUP?.id,notes:dsc}).select().single();
    await sb.from('cash_entries').insert({transaction_id:txn.id,category_id:catId,entry_date:dt,amount:amt,direction:dir,account_id:accId,description:dsc});
    await sb.from('ledger_entries').insert({transaction_id:txn.id,entry_date:dt,entry_type:dir==='in'?'credit':'debit',account_category:'cashflow',cashflow_account_id:accId,amount:amt,description:dsc,created_by:CUP?.id});
    toast(`✅ ${dir==='in'?'Receipt':'Payment'}: ${fmt(amt)}`,'ok');if($('c-dsc'))$('c-dsc').value='';if($('c-amt'))$('c-amt').value='';await loadMasterData();iCash();
  }catch(e){toast('Error: '+e.message,'err');}
}

async function loadCashEntries(){
  const c=$('cash-list');if(!c)return;
  const{data:entries}=await sb.from('ledger_entries').select('*').eq('account_category','cashflow').order('created_at',{ascending:false}).limit(30);
  if(!(entries||[]).length){c.innerHTML='<div class="empty"><div class="empty-ico">💵</div><p>No entries</p></div>';return;}
  c.innerHTML=(entries||[]).map(e=>`<div class="card" style="padding:11px 13px;margin-bottom:9px"><div class="flex just-b"><div><div class="t-sm fw-6">${e.description||''}</div><div class="t-xs c-ink3">${e.entry_date||''}</div></div><div style="text-align:right">${e.credit>0?`<div class="t-sm fw-7 c-sage">+${fmt(e.credit)}</div>`:''} ${e.debit>0?`<div class="t-sm fw-7 c-red">-${fmt(e.debit)}</div>`:''}</div></div></div>`).join('');
}

async function exportCash(){
  const{data}=await sb.from('cash_entries').select('*,expense_categories(name)').order('entry_date',{ascending:false}).limit(500);
  const rows=(data||[]).map(e=>({Date:e.entry_date,Category:e.expense_categories?.name||'',Desc:e.description,In:e.direction==='in'?e.amount:0,Out:e.direction==='out'?e.amount:0}));
  const hdr=Object.keys(rows[0]||{Date:'',Category:'',Desc:'',In:0,Out:0});const csv=[hdr.join(','),...rows.map(r=>hdr.map(h=>`"${r[h]||''}"`).join(','))].join('\n');
  const blob=new Blob([csv],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Cash_Book.csv';a.click();toast('✅ Cash_Book.csv','ok');
}

// ── ASSETS ──
function rAssets(){return`<div id="assets-content"></div>`;}
async function iAssets(){
  const c=$('assets-content');if(!c)return;
  const{data:assets}=await sb.from('assets').select('*,asset_categories(name)').order('created_at',{ascending:false});
  const tv=(assets||[]).reduce((s,a)=>s+Number(a.purchase_price||0)*Number(a.qty||1),0);
  c.innerHTML=`<div class="stat-grid"><div class="stat-card"><div class="stat-lbl">Total Assets</div><div class="stat-val">${(assets||[]).length}</div></div><div class="stat-card gold"><div class="stat-lbl">Total Value</div><div class="stat-val">${fmt(tv)}</div></div></div><button class="btn btn-ink btn-full" style="margin-bottom:14px" onclick="openAddAsset()">➕ Add Asset</button>${!(assets||[]).length?'<div class="empty"><div class="empty-ico">🏪</div><p>No assets recorded</p></div>':`<div style="border:1px solid var(--border2);border-radius:var(--r);overflow:hidden"><div style="display:grid;grid-template-columns:1.5fr .8fr .8fr .8fr;background:var(--ink);color:white;padding:8px 12px"><div class="t-xs fw-7">Asset</div><div class="t-xs fw-7" style="text-align:center">Qty</div><div class="t-xs fw-7" style="text-align:right">Cost</div><div class="t-xs fw-7" style="text-align:right">Condition</div></div>${(assets||[]).map(a=>`<div style="display:grid;grid-template-columns:1.5fr .8fr .8fr .8fr;padding:9px 12px;border-top:1px solid var(--cream2);background:white"><div><div class="t-sm fw-6">${a.name}</div><div class="t-xs c-ink3">${a.asset_categories?.name||''} · ${a.purchase_date||''}</div>${a.notes?`<div class="t-xs c-ink3">${a.notes}</div>`:''}</div><div style="text-align:center" class="t-sm fw-7">${a.qty||1}</div><div style="text-align:right" class="t-sm">${fmt(a.purchase_price)}</div><div style="text-align:right"><span style="font-size:.6rem;font-weight:700;padding:2px 6px;border-radius:6px;background:${a.condition==='Good'?'#E8F5E8':a.condition==='Fair'?'#FFF8E4':'#FDEAEA'};color:${a.condition==='Good'?'var(--sage)':a.condition==='Fair'?'var(--gold)':'var(--red)'}">${a.condition||'Good'}</span></div></div>`).join('')}<div style="display:flex;justify-content:space-between;padding:8px 12px;background:var(--cream2)"><span class="t-sm fw-7 c-ink2">Total</span><span class="t-sm fw-7 c-ink2">${fmt(tv)}</span></div></div>`}`;
}

async function openAddAsset(){
  const{data:cats}=await sb.from('asset_categories').select('*');
  openMo('➕ Add Asset',`<div class="fg"><label class="lbl">Name *</label><input class="inp" id="ast-nm" placeholder="e.g. Glass Counter"></div><div class="fg"><label class="lbl">Type</label><select class="sel" id="ast-tp">${(cats||[]).map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select></div><div class="g2"><div class="fg"><label class="lbl">Qty</label><input class="inp" id="ast-qt" type="number" value="1"></div><div class="fg"><label class="lbl">Cost ₨</label><input class="inp" id="ast-cs" type="number" placeholder="0"></div></div><div class="fg"><label class="lbl">Date</label><input class="inp" id="ast-dt" type="date" value="${today()}"></div><div class="fg"><label class="lbl">Condition</label><select class="sel" id="ast-cd"><option>Good</option><option>Fair</option><option>Poor</option></select></div><div class="fg"><label class="lbl">Notes</label><input class="inp" id="ast-nt" placeholder="Details..."></div><button class="btn btn-ink btn-full" onclick="saveAsset()">✅ Save</button>`);
}

async function saveAsset(){
  const name=$('ast-nm')?.value?.trim();if(!name){toast('Enter name','err');return;}
  const{error}=await sb.from('assets').insert({name,category_id:$('ast-tp')?.value,qty:Number($('ast-qt')?.value||1),purchase_price:Number($('ast-cs')?.value||0),purchase_date:$('ast-dt')?.value,condition:$('ast-cd')?.value||'Good',notes:$('ast-nt')?.value||'',added_by:CUP?.id});
  if(error){toast('Error: '+error.message,'err');return;}
  closeMo();toast(`✅ Asset saved!`,'ok');iAssets();
}
</script>
