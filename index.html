// Bulletproof unique-number generator: tries the RPC sequence first,
// falls back to a timestamp+random suffix that CANNOT collide (bypasses broken counters)
async function genUniqueNo(prefix,attemptNum){
  if(attemptNum===0){
    var r=await sb.rpc('generate_transaction_no',{p_prefix:prefix});
    if(r.data)return r.data;
  }
  return prefix+'-'+Date.now().toString(36).toUpperCase()+Math.random().toString(36).slice(2,5).toUpperCase();
}
// Generic bulletproof insert: tries normal sequence, then bypasses with guaranteed-unique value on collision
async function insertWithUniqueNo(table,prefix,buildRow){
  var lastErr=null;
  for(var attempt=0;attempt<3;attempt++){
    var no=await genUniqueNo(prefix,attempt);
    var res=await sb.from(table).insert(buildRow(no)).select().single();
    if(!res.error)return{data:res.data,no:no};
    lastErr=res.error;
    if(res.error&&res.error.message&&res.error.message.indexOf('duplicate')>=0){
      await new Promise(function(r){setTimeout(r,150*(attempt+1));});
      continue;
    }
    throw res.error;
  }
  throw lastErr||new Error('Failed to insert after retries');
}

function colCode(c){if(!c)return'CLR';var m={black:'BLK',white:'WHT',blue:'BLU','navy blue':'NVY',navy:'NVY',red:'RED',green:'GRN',pink:'PNK',yellow:'YLW',orange:'ORG',brown:'BRN',maroon:'MRN',grey:'GRY',gray:'GRY',multi:'MLT'};var l=c.toLowerCase().trim();if(m[l])return m[l];var keys=Object.keys(m);for(var i=0;i<keys.length;i++){if(l.indexOf(keys[i])>=0)return m[keys[i]];}return c.replace(/[^a-zA-Z]/g,'').toUpperCase().substring(0,3)||'CLR';}

var MY_SESSION_ID=null;
var sessionWatchTimer=null;
var idleTimer=null;

async function login(){
  var emailEl=$('em'),pwEl=$('pw'),errEl=$('le'),btn=$('lb2');
  var email=emailEl?emailEl.value.trim():'';
  var pw=pwEl?pwEl.value:'';
  if(!email||!pw){if(errEl){errEl.style.display='block';errEl.textContent='Enter email and password';}return;}
  if(btn){btn.textContent='...';btn.disabled=true;}
  try{
    var r=await sb.auth.signInWithPassword({email:email,password:pw});
    if(r.error){if(errEl){errEl.style.display='block';errEl.textContent=r.error.message;}if(btn){btn.textContent='Sign In';btn.disabled=false;}return;}
    CU=r.data.user;
    var ur=await sb.from('users').select('*').eq('auth_id',CU.id).single();
    CUP=ur.data;

    if(CUP&&CUP.is_active===false){
      await sb.auth.signOut();
      if(errEl){errEl.style.display='block';errEl.textContent='Account disabled. Contact owner.';}
      if(btn){btn.textContent='Sign In';btn.disabled=false;}
      return;
    }

    MY_SESSION_ID='s_'+Date.now()+'_'+Math.random().toString(36).slice(2,9);
    var device=(navigator.userAgent.match(/Android|iPhone|iPad|Macintosh|Windows/)||['Device'])[0];
    if(CUP&&CUP.id){
      await sb.rpc('start_user_session',{p_user_id:CUP.id,p_session_id:MY_SESSION_ID,p_device:device});
      logActivity('login',null,{device:device});
    }
    startSessionWatch();
    startIdleTimer();

    await loadData();
    $('ls').style.display='none';
    $('app').style.display='block';
    var uc=$('uc');if(uc)uc.textContent=(CUP&&CUP.role==='owner'?'Owner':'Staff')+': '+(CUP&&CUP.full_name||'');
    buildNav();
    if(btn){btn.textContent='Sign In';btn.disabled=false;}
    toast('Welcome '+(CUP&&CUP.full_name||'')+'!','ok');
    // Init offline engine
    openOfflineDB().then(function(){
      initConnectivityWatcher();
      // Always try to sync on login if online
      if(_isOnline){
        setTimeout(runSyncQueue, 2000); // wait for loadData to complete first
      }
    }).catch(function(e){console.warn('Offline DB init failed:',e);});
  }catch(ex){
    if(errEl){errEl.style.display='block';errEl.textContent=''+ex.message;}
    if(btn){btn.textContent='Sign In';btn.disabled=false;}
  }
}

// -- SESSION SECURITY --
function startSessionWatch(){
  if(sessionWatchTimer)clearInterval(sessionWatchTimer);
  sessionWatchTimer=setInterval(async function(){
    if(!CUP||!CUP.id||!MY_SESSION_ID)return;
    var chk=await sb.rpc('check_user_session',{p_user_id:CUP.id,p_session_id:MY_SESSION_ID});
    if(chk.data&&!chk.data.valid){
      clearInterval(sessionWatchTimer);
      alert('You have been logged out  -  your account was used on another device, or access was revoked.');
      forceLogout();
    }
  },20000);
}
function startIdleTimer(){
  if(idleTimer)clearTimeout(idleTimer);
  var reset=function(){
    clearTimeout(idleTimer);
    idleTimer=setTimeout(function(){
      alert('Logged out due to inactivity (15 min).');
      forceLogout();
    },15*60*1000);
  };
  ['click','keydown','touchstart','scroll'].forEach(function(ev){document.addEventListener(ev,reset);});
  reset();
}
function forceLogout(){
  if(sessionWatchTimer)clearInterval(sessionWatchTimer);
  if(idleTimer)clearTimeout(idleTimer);
  sb.auth.signOut();
  CU=null;CUP=null;cart=[];
  $('app').style.display='none';$('ls').style.display='flex';
}

async function loadData(){
  if(!navigator.onLine){await loadFromCache();updateDatalists();return;}
  var p=await sb.from('product_variants').select('*,products(name,categories(name,code))').eq('is_active',true);
  var a=await sb.from('cashflow_accounts').select('*').eq('is_active',true).order('sort_order');
  var pa=await sb.from('parties').select('*').eq('is_active',true).order('name');
  prods=(p.data||[]).map(function(v){return{id:v.id,sku:v.sku,name:v.products&&v.products.name||'',cat:v.products&&v.products.categories&&v.products.categories.name||'',colour:v.colour||'',size:v.size||'',cost:Number(v.purchase_price)||0,stock:0,age:0};});
  accs=a.data||[];parties=pa.data||[];
  // Resilient inventory query - falls back if new columns missing
  var inv=await sb.from('inventory').select('variant_id,qty_available,age_days');
  (inv.data||[]).forEach(function(i){var p2=prods.find(function(p3){return p3.id===i.variant_id;});if(p2){p2.stock=Number(i.qty_available)||0;p2.age=i.age_days||0;}});

// -- WHATSAPP PHONE HELPERS --
function normalizePhone(raw){
  var digits=(raw||'').replace(/[^0-9]/g,'');
  if(!digits)return '';
  if(digits.length===11&&digits.charAt(0)==='0')return '92'+digits.slice(1); // 03XXXXXXXXX -> 923XXXXXXXXX
  if(digits.length===10&&digits.charAt(0)==='3')return '92'+digits; // 3XXXXXXXXX -> 923XXXXXXXXX
  if(digits.charAt(0)==='0')return '92'+digits.slice(1);
  return digits; // already has country code or other intl format
}
function isValidPhone(raw){
  var n=normalizePhone(raw);
  return n.length>=10&&n.length<=15;
}
function onPhoneInput(){
  var valid=isValidPhone($('bphone')&&$('bphone').value||'');
  var wrap=$('bwa-wrap');
  if(wrap)wrap.style.display=valid?'block':'none';
  if(!valid&&$('bwa'))$('bwa').checked=false;
}

async function savePur(){
  var btnEl=event&&event.target;
  if(btnEl&&btnEl.disabled)return; // block double-tap
  var nm=$('pn')&&$('pn').value.trim();var cat=$('pc2')&&$('pc2').value;var qty=Number($('pq')&&$('pq').value||0);var cst=Number($('pcs')&&$('pcs').value||0);var sup=$('ps2')&&$('ps2').value.trim()||'';
  var p_fabric=$('p-fabric')&&$('p-fabric').value||null;
  var p_season=$('p-season')&&$('p-season').value||null;
  var p_segment=$('p-segment')&&$('p-segment').value||null;
  var p_design=$('p-design')&&$('p-design').value||null;
  var p_brand=$('p-brand')&&$('p-brand').value||null;
  var cl=$('pcl')&&$('pcl').value.trim()||'';
  var sz=$('pz')&&$('pz').value.trim()||'';
  if(!nm||!cat||!qty||!cst){toast('Fill Name, Category, Qty, Cost','err');return;}
  if(btnEl){btnEl.disabled=true;btnEl.textContent='Saving...';}
  if(purPayMode!=='owner'&&!sup){toast('Enter supplier name','err');return;}
  var tot=qty*cst;
  if(!navigator.onLine){
    await savePurOffline(nm,cat,qty,cst,cl,sz,sup,purPayMode,pd||tot,tot);
    if(btnEl){btnEl.disabled=false;btnEl.textContent='Save Purchase';}
    return;
  }
  var catCode=CCOD[cat]||cat.substring(0,3).toUpperCase();
  var clC=colCode(cl);var szC=szCode(sz);var prefix=catCode+'-'+clC+'-'+szC;
  var purNo=await sb.rpc('generate_transaction_no',{p_prefix:'PUR'});
  var sp=null;
  if(sup){sp=parties.find(function(p){return p.name===sup&&p.party_type==='supplier';});if(!sp){var nsp=await sb.from('parties').insert({party_type:'supplier',name:sup,created_by:CUP&&CUP.id}).select().single();if(nsp.data){parties.push(nsp.data);sp=nsp.data;}}}
  if(purPayMode==='owner'&&!parties.find(function(p){return p.party_type==='owner';})){var op=await sb.from('parties').insert({party_type:'owner',name:'Owner Account',opening_balance:0,current_balance:0,created_by:CUP&&CUP.id}).select().single();if(op.data)parties.push(op.data);}
  var cr=await sb.from('categories').select('id').eq('name',cat).single();
  var ca=accs.find(function(a){return a.name==='Cash Drawer';});
  var pd=0,payAccId=null;
  if(purPayMode==='cash'){pd=tot;payAccId=ca&&ca.id;if((ca&&ca.current_balance||0)<tot&&!confirm('Insufficient cash. Continue?'))return;}
  else if(purPayMode==='partial'){pd=Number($('ppd2')&&$('ppd2').value||0);payAccId=ca&&ca.id;}
  try{
    // Check if product with same name+category already exists  -  reuse it
    var existProd=await sb.from('products').select('id').eq('name',nm).eq('category_id',cr.data&&cr.data.id).maybeSingle();
    var prodId=null;
    if(existProd.data&&existProd.data.id){
      prodId=existProd.data.id;
    } else {
      var prod=await sb.from('products').upsert({name:nm,category_id:cr.data&&cr.data.id,created_by:CUP&&CUP.id},{onConflict:'name,category_id',ignoreDuplicates:false}).select().single();
      if(prod.error){
        // Fallback: fetch existing
        var existing=await sb.from('products').select('id').eq('name',nm).eq('category_id',cr.data&&cr.data.id).single();
        if(existing.error)throw existing.error;
        prodId=existing.data.id;
      } else {
        prodId=prod.data.id;
      }
    }
    // Bulletproof retry: bypass broken counter after first failure with timestamp-based unique SKU
    var skuN,variant;
    for(var attempt=0;attempt<3;attempt++){
      var skuVal=await genUniqueNo(prefix,attempt);
      var variantPayload={product_id:prodId,sku:skuVal,colour:cl,colour_code:clC,size:sz,size_code:szC,purchase_price:cst,created_by:CUP&&CUP.id};
      if(p_fabric)variantPayload.fabric_id=p_fabric;
      if(p_season)variantPayload.season_id=p_season;
      if(p_segment)variantPayload.segment_id=p_segment;
      if(p_design)variantPayload.design_id=p_design;
      if(p_brand)variantPayload.brand_id=p_brand;
      variant=await sb.from('product_variants').insert(variantPayload).select().single();
      if(!variant.error){skuN={data:skuVal};break;}
      if(variant.error&&variant.error.message&&variant.error.message.indexOf('duplicate')>=0){
        await new Promise(function(r){setTimeout(r,150*(attempt+1));});
        continue;
      }
      throw variant.error;
    }
    if(variant.error)throw variant.error;
    var txn,txnNoUsed;
    for(var ta=0;ta<3;ta++){
      txnNoUsed=ta===0?purNo.data:await genUniqueNo('PUR',ta);
      txn=await sb.from('transactions').insert({transaction_no:txnNoUsed,transaction_type:'purchase',transaction_date:td(),party_id:sp&&sp.id||null,total_amount:tot,paid_amount:pd,payment_status:purPayMode==='credit'?'credit':purPayMode==='partial'?'partial':'paid',performed_by:CUP&&CUP.id}).select().single();
      if(!txn.error)break;
      if(txn.error&&txn.error.message&&txn.error.message.indexOf('duplicate')>=0){await new Promise(function(r){setTimeout(r,150*(ta+1));});continue;}
      throw txn.error;
    }
    if(txn.error)throw txn.error;
    var pur=await sb.from('purchases').insert({transaction_id:txn.data.id,supplier_party_id:sp&&sp.id||null,purchase_date:td(),total_amount:tot,paid_amount:pd,payment_mode:purPayMode,payment_source_account_id:payAccId}).select().single();
    if(pur.error)throw pur.error;
    await sb.from('purchase_items').insert({purchase_id:pur.data.id,transaction_id:txn.data.id,variant_id:variant.data.id,qty:qty,purchase_price:cst});
    var ownerP=parties.find(function(p){return p.party_type==='owner';});
    var postParty=purPayMode==='credit'||purPayMode==='partial'?sp&&sp.id:purPayMode==='owner'?ownerP&&ownerP.id:null;
    await sb.rpc('post_transaction_ledger',{p_txn_id:txn.data.id,p_txn_type:'purchase',p_payment_mode:purPayMode,p_total:tot,p_paid:pd,p_party_id:postParty,p_account_id:payAccId,p_user_id:CUP&&CUP.id});
    // FIX 1: Update inventory stock on purchase
    var smResult=await sb.rpc('process_stock_movement',{p_variant_id:variant.data.id,p_movement_type:'purchase',p_qty:qty,p_reason:'Purchase: '+skuN.data,p_cost_impact:cst,p_user_id:CUP&&CUP.id,p_txn_id:txn.data.id});
    if(smResult.data&&!smResult.data.success)toast('Stock update issue: '+(smResult.data.error||''),'warn');
    // Issue 9: post to cash_entries so Cash Book shows all purchase payments
    if(payAccId&&purPayMode!=='credit'){
      await sb.from('cash_entries').insert({
        transaction_id:txn.data.id,entry_date:td(),amount:pd,
        direction:'out',account_id:payAccId,
        description:'Purchase Payment: '+skuN.data+(sup?' - '+sup:''),
        nature:'payment',party_category:'Supplier Payment'
      });
    }
    logActivity('purchase_completed','buy',{sku:skuN.data,qty:qty,cost:cst,supplier:sup});
    await loadData();
    toast('SKU: '+skuN.data+' | Stock: '+qty,'ok',6000);
    var flds=['pn','pq','pcs','ps2','p-fabric','p-season','p-segment','p-design','p-brand'];
    for(var fi=0;fi<flds.length;fi++){var fe=$(flds[fi]);if(fe)fe.value='';}
    if($('pc2'))$('pc2').value='';if($('pz'))$('pz').value='';if($('pcl'))$('pcl').value='';
    if($('sku'))$('sku').textContent='Select category...';if($('pprev'))$('pprev').style.display='none';
    if(btnEl){btnEl.disabled=false;btnEl.textContent='Save Purchase';}
  }catch(ex){toast('Error: '+ex.message,'err');if(btnEl){btnEl.disabled=false;btnEl.textContent='Save Purchase';}}
}

async function saveCash(){
  var btnEl=event&&event.target;if(btnEl&&btnEl.disabled)return;
  if(btnEl){btnEl.disabled=true;btnEl.textContent='Saving...';}
  var dt=$('cd')&&$('cd').value||td();
  var nature=$('cnature')&&$('cnature').value;
  var catId=$('cc')&&$('cc').value;
  var dsc=$('cdsc')&&$('cdsc').value.trim();
  var amt=Number($('camt')&&$('camt').value||0);
  var accId=$('cacc')&&$('cacc').value;
  var cpsel=$('cpty');
  var partyId2=cpsel&&cpsel.value||'';
  var partyName2=cpsel&&cpsel.options&&cpsel.selectedIndex>=0?cpsel.options[cpsel.selectedIndex].getAttribute('data-name')||'':'';
  var partyName=partyName2||($('cpty')&&$('cpty').value||'').trim();
  var ptype=$('cptype')&&$('cptype').value||'customer';

  // -- Mandatory Transaction Nature --
  if(!nature){toast('Select Transaction Nature: Expense, Income, Receipt or Payment','err');return;}
  if(!amt||!dsc){toast('Fill description and amount','err');return;}

  // Receipt/Payment require a party  -  they are inherently tied to a counterparty's balance
  if((nature==='receipt'||nature==='payment')&&!partyName){
    toast('Receipt/Payment requires a Customer, Supplier or Committee selected','err');
    $('cpty')&&$('cpty').focus();return;
  }

  var dir=(nature==='income'||nature==='receipt')?'in':'out';

  // Negative balance guard for outflows
  if(dir==='out'&&accId){
    var payAcc=accs.find(function(a){return a.id===accId;});
    if(payAcc&&(payAcc.current_balance||0)<amt){
      if(!confirm('Warning: This will create negative balance!\n'+payAcc.name+': '+fmt(payAcc.current_balance||0)+'\nAmount: '+fmt(amt)+'\n\nContinue anyway?')){return;}
    }
  }

  var partyId=null;
  if(partyId2){
    partyId=partyId2; // directly from select value (UUID)
  } else if(partyName){
    var pf=parties.find(function(p){return p.name===partyName&&p.party_type===ptype;});
    if(!pf){
      var nr=await sb.from('parties').insert({party_type:ptype,name:partyName,created_by:CUP&&CUP.id}).select().single();
      if(nr.data){parties.push(nr.data);pf=nr.data;}
    }
    partyId=pf&&pf.id||null;
  }

  var category=nature==='income'?'Income':nature==='expense'?'Expense':
    (ptype==='customer'?'Customer ':ptype==='supplier'?'Supplier ':'Committee ')+(nature==='receipt'?'Receipt':'Payment');

  if(!navigator.onLine){
    await saveCashOffline(nature,dt,amt,dsc,ptype,partyName,partyId,accId,category);
    if(btnEl){btnEl.disabled=false;btnEl.textContent='Save';}
    if($('cdsc'))$('cdsc').value='';if($('camt'))$('camt').value='';if($('cpty'))$('cpty').value='';
    return;
  }
  try{
    var tIns=await insertWithUniqueNo('transactions','CASH',function(noVal){return{transaction_no:noVal,transaction_type:nature,transaction_date:dt,party_id:partyId,total_amount:amt,paid_amount:amt,payment_status:'paid',performed_by:CUP&&CUP.id,notes:dsc};});
    var t={data:tIns.data};

    // -- P&L IMPACT: only Income/Expense post to cash_entries (the table P&L reads from) --
    if(nature==='income'||nature==='expense'){
      if(catId)await sb.from('cash_entries').insert({transaction_id:t.data.id,category_id:catId,entry_date:dt,amount:amt,direction:dir,account_id:accId,description:dsc,nature:nature,party_category:category});
    } else {
      // Receipt/Payment: still logged for the Cash Tab list, but flagged so reports can exclude it from P&L
      await sb.from('cash_entries').insert({transaction_id:t.data.id,category_id:null,entry_date:dt,amount:amt,direction:dir,account_id:accId,description:dsc,nature:nature,party_category:category});
    }

    // -- Single, direct cashflow ledger entry (no shared RPC  -  avoids double-posting) --
    await sb.from('ledger_entries').insert({transaction_id:t.data.id,entry_date:dt,entry_type:dir==='in'?'credit':'debit',account_category:'cashflow',cashflow_account_id:accId,amount:amt,description:dsc,created_by:CUP&&CUP.id});

    // -- Party ledger entry: Receipt/Payment each have specific accounting treatment --
    if(partyId){
      var partyEntryType;
      if(nature==='receipt'){partyEntryType='credit';} // money received  -  reduces receivable (credit)
      else if(nature==='payment'&&ptype==='supplier'){partyEntryType='debit';} // payment to supplier  -  reduces payable (debit = clears the liability)
      else if(nature==='payment'&&ptype==='customer'){partyEntryType='debit';} // payment to customer (rare refund)
      else{partyEntryType=dir==='in'?'credit':'debit';}
      await sb.from('ledger_entries').insert({
        transaction_id:t.data.id,entry_date:dt,
        entry_type:partyEntryType,account_category:'party',
        party_id:partyId,amount:amt,
        description:(nature==='payment'&&ptype==='supplier'?'Supplier Payment: ':'')+(nature==='receipt'&&ptype==='customer'?'Customer Receipt: ':'')+dsc,
        created_by:CUP&&CUP.id
      });
    }

    logActivity(nature,'cash',{amount:amt,description:dsc,category:category});
    toast(category+': '+fmt(amt),'ok');
    if($('cdsc'))$('cdsc').value='';if($('camt'))$('camt').value='';if($('cpty'))$('cpty').value='';
    await loadData();iCash();
  }catch(ex){toast(ex.message,'err');}
  finally{if(btnEl){btnEl.disabled=false;btnEl.textContent='Save';}}
}

    h+='</div></div>';
  }
  c.innerHTML=h;
}

function autoFillSmCost(){

async function saveStockMove(mtype){
  var btnEl=event&&event.target;if(btnEl&&btnEl.disabled)return;
  if(btnEl){btnEl.disabled=true;btnEl.textContent='Saving...';}
  var varId=$('sm-prod')&&$('sm-prod').value;
  var qty=Number($('sm-qty')&&$('sm-qty').value||0);
  var rsn=($('sm-rsn')&&$('sm-rsn').value||'').trim();
  var cost=Number($('sm-cost')&&$('sm-cost').value||0);
  var refNo=($('sm-ref')&&$('sm-ref').value||'').trim();

  // -- STEP 1: Common mandatory fields --
  if(!varId){if(btnEl){btnEl.disabled=false;btnEl.textContent='Process';}toast('Select a product','err');$('sm-prod')&&$('sm-prod').focus();return;}
  if(!qty||qty<=0){if(btnEl){btnEl.disabled=false;btnEl.textContent='Process';}toast('Enter quantity greater than 0','err');$('sm-qty')&&$('sm-qty').focus();return;}
  if(!cost||cost<=0){if(btnEl){btnEl.disabled=false;btnEl.textContent='Process';}toast('Enter cost price  -  required for valuation','err');$('sm-cost')&&$('sm-cost').focus();return;}
  if(!rsn||rsn.length<5){if(btnEl){btnEl.disabled=false;btnEl.textContent='Process';}toast('Enter reason (min 5 characters)  -  required for audit','err');$('sm-rsn')&&$('sm-rsn').focus();return;}

  // -- STEP 2: Purchase Return specific mandatory fields --
  if(mtype==='purchase_return'){
    var supName=($('sm-sup')&&$('sm-sup').value||'').trim();
    // Supplier is OPTIONAL: some returns have no recovery/payable adjustment (e.g. disposed/written-off stock).
    // Only verify/offer-create when a name was actually entered.
    if(supName){
      var spCheck=parties.find(function(p){return p.name===supName&&p.party_type==='supplier';});
      if(!spCheck){
        var ok=confirm('Supplier "'+supName+'" not found in ledger.\nCreate new supplier record?');
        if(!ok){if(btnEl){btnEl.disabled=false;btnEl.textContent='Process';}toast('Leave Supplier blank to proceed without one, or pick a valid name','err');return;}
      }
    }
  }

  var p=prods.find(function(p){return p.id===varId;});
  if(!p){if(btnEl){btnEl.disabled=false;btnEl.textContent='Process';}toast('Product not found','err');return;}

  // -- STEP 3: Stock availability check --
  if(['purchase_return','damaged','other'].indexOf(mtype)>=0){
    if((p.stock||0)<=0){if(btnEl){btnEl.disabled=false;btnEl.textContent='Process';}toast('No stock available for '+p.name,'err');return;}
    if(qty>(p.stock||0)){if(btnEl){btnEl.disabled=false;btnEl.textContent='Process';}toast('Cannot exceed available stock ('+p.stock+'). Enter '+p.stock+' or less.','err');$('sm-qty')&&($('sm-qty').value=p.stock);return;}
  }

  // -- STEP 4: Show confirmation summary before processing --
  var totalVal=qty*cost;
  var summary='Confirm Purchase Return:\n\n'+
    'Product: '+p.name+'\n'+
    'SKU: '+p.sku+'\n'+
    'Qty: '+qty+'\n'+
    'Cost/unit: Rs'+cost.toLocaleString()+'\n'+
    'Total Value: Rs'+totalVal.toLocaleString()+'\n'+
    'Reason: '+rsn+'\n\n'+
    'Stock will decrease by '+qty+'.\nLedger will be updated.\n\nProceed?';
  if(!confirm(summary)){if(btnEl){btnEl.disabled=false;btnEl.textContent='Process';}return;}

  // -- STEP 5: Process stock movement --
  try{
  var result=await sb.rpc('process_stock_movement',{
    p_variant_id:varId,p_movement_type:mtype,p_qty:qty,
    p_reason:rsn,p_reference_no:refNo||null,
    p_cost_impact:cost,p_user_id:CUP&&CUP.id
  });
  if(!result.data||!result.data.success){
    if(btnEl){btnEl.disabled=false;btnEl.textContent='Process';}
    toast('Error: '+(result.data&&result.data.error||'Stock update failed'),'err');return;
  }

  // -- STEP 6: Purchase Return  -  create transaction + ledger entry --
  if(mtype==='purchase_return'){
    var supName2=($('sm-sup')&&$('sm-sup').value||'').trim();
    var sp=null;
    if(supName2){
      sp=parties.find(function(p){return p.name===supName2&&p.party_type==='supplier';});
      if(!sp){
        var nsp=await sb.from('parties').insert({party_type:'supplier',name:supName2,created_by:CUP&&CUP.id}).select().single();
        if(nsp.data){parties.push(nsp.data);sp=nsp.data;}
      }
    }
    // Transaction is always recorded, with or without a supplier  -  keeps Net Purchases reporting accurate either way
    var pretIns=await insertWithUniqueNo('transactions','PRET',function(noVal){return{
      transaction_no:noVal,transaction_type:'purchase_return',
      transaction_date:td(),party_id:sp&&sp.id||null,
      total_amount:totalVal,paid_amount:0,
      payment_status:'paid',performed_by:CUP&&CUP.id,
      notes:'Purchase Return: '+p.name+' x'+qty+' @ Rs'+cost+'. '+rsn+(sp?'':' (No supplier  -  no payable recovery expected)')
    };});
    var no2={data:pretIns.no};var txn2={data:pretIns.data};
    if(sp&&txn2.data){
      // DR Supplier Payable (reduces what we owe)
      await sb.from('ledger_entries').insert({
        transaction_id:txn2.data.id,entry_date:td(),
        entry_type:'debit',account_category:'party',
        party_id:sp.id,amount:totalVal,
        description:'Purchase Return: '+p.name+' x'+qty,
        created_by:CUP&&CUP.id
      });
      // Issue 6: ensure supplier current_balance decreases (debit = reduces payable)
      await sb.from('parties').update({
        current_balance:Math.max(0,(sp.current_balance||0)-totalVal)
      }).eq('id',sp.id);
      toast('Purchase Return done: '+no2.data+' | Rs'+totalVal.toLocaleString()+' | Supplier: '+sp.name,'ok',7000);
    } else {
      toast('Purchase Return done: '+no2.data+' | Rs'+totalVal.toLocaleString()+' | No supplier (stock written off, no recovery)','ok',7000);
    }
  }

  // -- STEP 7: Sales Return  -  customer ledger + optional cash refund --
  if(mtype==='sales_return'){
    var custNameRet=($('sm-cust')&&$('sm-cust').value||'').trim();
    var ca2=accs.find(function(a){return a.name==='Cash Drawer';});
    var doR=confirm('Process cash refund?\nAmount: Rs'+totalVal.toLocaleString()+'\n\nNo = reverse balance only, no cash out.');
    var retCustId=null;
    if(custNameRet){
      var retCust=parties.find(function(p){return p.name===custNameRet&&p.party_type==='customer';});
      if(!retCust){var ncr=await sb.from('parties').insert({party_type:'customer',name:custNameRet,created_by:CUP&&CUP.id}).select().single();if(ncr.data){parties.push(ncr.data);retCust=ncr.data;}}
      retCustId=retCust&&retCust.id||null;
    }
    var retIns=await insertWithUniqueNo('transactions','RET',function(noVal){return{
      transaction_no:noVal,transaction_type:'sale_return',transaction_date:td(),
      party_id:retCustId,total_amount:totalVal,paid_amount:doR?totalVal:0,
      payment_status:doR?'paid':'pending',performed_by:CUP&&CUP.id,
      notes:'Return: '+p.name+' x'+qty+(refNo?' Ref:'+refNo:'')+(custNameRet?' | Customer: '+custNameRet:'')
    };});
    var txn3={data:retIns.data};
    if(txn3.data){
      if(doR&&ca2)await sb.from('ledger_entries').insert({transaction_id:txn3.data.id,entry_date:td(),entry_type:'debit',account_category:'cashflow',cashflow_account_id:ca2.id,amount:totalVal,description:'Cash Refund: '+p.name,created_by:CUP&&CUP.id});
      // FIX 6: Adjust customer ledger on return  -  debit customer (reduces receivable / increases credit)
      if(retCustId){
        await sb.from('ledger_entries').insert({transaction_id:txn3.data.id,entry_date:td(),entry_type:'debit',account_category:'party',party_id:retCustId,amount:totalVal,description:'Sales Return: '+p.name+' x'+qty,created_by:CUP&&CUP.id});
        // Issue 6: update customer balance  -  sales return reduces receivable
        var retCustObj=parties.find(function(p){return p.id===retCustId;});
        if(retCustObj)await sb.from('parties').update({current_balance:Math.max(0,(retCustObj.current_balance||0)-totalVal)}).eq('id',retCustId);
      }
    }
  }

  // -- FIX 5: Damaged Stock Expense  -  auto-posts to P&L --
  if(mtype==='damaged'){
    try{
      var dmgCa=accs.find(function(a){return a.name==='Cash Drawer';});
      var dmgIns=await insertWithUniqueNo('transactions','DMG',function(noVal){return{
        transaction_no:noVal,transaction_type:'expense',transaction_date:td(),
        total_amount:totalVal,paid_amount:totalVal,payment_status:'paid',
        performed_by:CUP&&CUP.id,notes:'Damaged Stock Write-off: '+p.name+' x'+qty+'. '+rsn
      };});
      // Post to cash_entries with nature='expense' so it appears in P&L as Damaged Stock Expense
      await sb.from('cash_entries').insert({
        transaction_id:dmgIns.data.id,entry_date:td(),amount:totalVal,direction:'out',
        account_id:dmgCa&&dmgCa.id||null,
        description:'Damaged Stock Expense: '+p.name+' x'+qty,
        nature:'expense',party_category:'Damaged Stock Expense'
      });
      // Also post ledger entry for damaged stock write-off
      if(dmgIns.data)await sb.from('ledger_entries').insert({
        transaction_id:dmgIns.data.id,entry_date:td(),
        entry_type:'debit',account_category:'expense',
        amount:totalVal,description:'Damaged Stock Write-off: '+p.name+' x'+qty,
        created_by:CUP&&CUP.id
      });
    }catch(de){console.error('Damaged P&L post failed:',de.message);}
  }
  logActivity('stock_movement','stock',{type:mtype,product:p.name,qty:qty,value:totalVal,reason:rsn});
  if(mtype!=='purchase_return'){
    toast((SMOVE_LABELS[mtype]||mtype)+': '+qty+' x '+p.name+' | Rs'+totalVal.toLocaleString()+' logged','ok',5000);
  }
  await loadData();cmo();iInv();
  }catch(smEx){toast('Error: '+smEx.message,'err');}
  finally{if(btnEl){btnEl.disabled=false;btnEl.textContent='Process '+(SMOVE_LABELS&&SMOVE_LABELS[mtype]||mtype);}}
}

async function saveExchange(){
  var btnEl=event&&event.target;
  if(btnEl&&btnEl.disabled)return;
  var cust=($('ex-c')&&$('ex-c').value||'Walk-in').trim();
  var riId=$('ex-ri')&&$('ex-ri').value;

  var iiId=$('ex-ii')&&$('ex-ii').value;

  var ip=Number($('ex-ip')&&$('ex-ip').value||0);
  if(!riId||!iiId){toast('Select both items','err');return;}
  var diff=ip-rp;
  if(Math.abs(diff)>0){if(!confirm('Price difference: '+fmt(Math.abs(diff))+'. Proceed?'))return;}
  if(btnEl){btnEl.disabled=true;btnEl.textContent='Processing...';}
  var ca=accs.find(function(a){return a.name==='Cash Drawer';});

    if(retP)await sb.rpc('process_stock_movement',{p_variant_id:riId,p_movement_type:'sales_return',p_qty:rq,p_reason:'Exchange return',p_cost_impact:retP.cost||0,p_user_id:CUP&&CUP.id});
    if(custParty&&retIns.data)await sb.from('ledger_entries').insert({transaction_id:retIns.data.id,entry_date:td(),entry_type:'debit',account_category:'party',party_id:custParty.id,amount:rp*rq,description:'Exchange Return: '+((retP&&retP.name)||''),created_by:CUP&&CUP.id});
    var exTxnIns=await insertWithUniqueNo('transactions','EXC',function(noVal){return{transaction_no:noVal,transaction_type:'sale',transaction_date:td(),party_id:custParty&&custParty.id||null,total_amount:ip*iq,paid_amount:ip*iq,payment_status:'paid',performed_by:CUP&&CUP.id,notes:'Exchange Sale: '+((issP&&issP.name)||'')+' x'+iq+' | Ref: '+(retIns.no||'')};});
    if(issP)await sb.rpc('process_stock_movement',{p_variant_id:iiId,p_movement_type:'sale',p_qty:iq,p_reason:'Exchange issue',p_cost_impact:issP.cost||0,p_user_id:CUP&&CUP.id});
    if(ca&&diff>0)await sb.from('ledger_entries').insert({transaction_id:exTxnIns.data.id,entry_date:td(),entry_type:'credit',account_category:'cashflow',cashflow_account_id:ca.id,amount:diff,description:'Exchange extra received',created_by:CUP&&CUP.id});
    if(ca&&diff<0)await sb.from('ledger_entries').insert({transaction_id:exTxnIns.data.id,entry_date:td(),entry_type:'debit',account_category:'cashflow',cashflow_account_id:ca.id,amount:Math.abs(diff),description:'Exchange refund paid',created_by:CUP&&CUP.id});
    await loadData();cmo();

  }catch(ex){toast(ex.message,'err');}
  finally{if(btnEl){btnEl.disabled=false;btnEl.textContent='Process Exchange';}}
}

async function saveStockTake(applyAdjustment){
  var btnEl=event&&event.target;
  if(btnEl&&btnEl.disabled)return;
  if(applyAdjustment){
    var pw=document.getElementById('st-pw')&&document.getElementById('st-pw').value;
    if(!pw){toast('Password required to apply adjustment','err');return;}
    var auth=await sb.auth.signInWithPassword({email:CU.email,password:pw});
    if(auth.error){toast('Wrong password','err');return;}
  }
  if(btnEl){btnEl.disabled=true;btnEl.textContent='Saving...';}
  var ps=window._stProds||[];
  var counted=0,adj=0;
  try{
    // Bulletproof retry: bypass broken counter after first failure
    var reportNo,report;
    for(var attempt=0;attempt<3;attempt++){
      var rNoVal=await genUniqueNo('SCNT',attempt);
      report=await sb.from('stock_count_reports').insert({
        report_no:rNoVal,count_date:td(),
        status:applyAdjustment?'adjusted':'saved',
        performed_by:CUP&&CUP.id,
        adjusted_at:applyAdjustment?new Date().toISOString():null
      }).select().single();
      if(!report.error){reportNo={data:rNoVal};break;}
      if(report.error&&report.error.message&&report.error.message.indexOf('duplicate')>=0){
        await new Promise(function(r){setTimeout(r,150*(attempt+1));});
        continue;
      }
      throw report.error;
    }
    if(report.error)throw report.error;

    var items=[];
    for(var i=0;i<ps.length;i++){
      var inp=$('st-'+i);
      if(!inp||inp.value==='')continue;
      var ph=Number(inp.value);
      counted++;
      items.push({report_id:report.data.id,variant_id:ps[i].id,system_qty:ps[i].stock||0,physical_qty:ph});
      if(ph!==(ps[i].stock||0)&&applyAdjustment){
        await sb.rpc('process_stock_movement',{p_variant_id:ps[i].id,p_movement_type:'stock_take',p_qty:ph,p_reason:'Physical count '+reportNo.data+': counted '+ph+', book was '+ps[i].stock,p_user_id:CUP&&CUP.id});
        adj++;
      }
    }
    if(items.length)await sb.from('stock_count_items').insert(items);

    cmo();await loadData();iInv();
    if(applyAdjustment){
      toast('Adjustment applied: '+adj+' items updated. Report: '+reportNo.data,'ok',6000);
    } else {
      toast('Variance report saved (no stock changed): '+reportNo.data+'. '+counted+' items counted.','ok',6000);
    }
  }catch(ex){
    toast(ex.message,'err');
    if(btnEl){btnEl.disabled=false;btnEl.textContent=applyAdjustment?'Apply Adjustment':'Save Report Only';}
  }
}

async function iSalesTab(){

    '<div class="sc sg2"><div class="sl2">Gross Profit</div><div class="sv">'+fmt(totProfit)+'</div><div style="font-size:.54rem;color:var(--sage)">'+(netRev?((totProfit/netRev)*100).toFixed(1):0)+'%</div></div>'+

// -- RENDER RECEIPT AS IMAGE (canvas, in-memory only  -  never saved to disk/storage) --
function loadLogoImage(){
  return new Promise(function(resolve){
    var img=new Image();
    img.crossOrigin='anonymous';
    img.onload=function(){resolve(img);};
    img.onerror=function(){resolve(null);}; // logo not uploaded yet  -  receipt still renders fine without it
    img.src='logo.png';
  });
}
async function renderReceiptCanvas(s){
  var W=420,padX=22,lineH=20;
  var itemRows=s.items.length;
  var H=300+itemRows*20+260;
  var cv=document.createElement('canvas');
  cv.width=W;cv.height=H;
  var ctx=cv.getContext('2d');
  ctx.fillStyle='#FFFFFF';ctx.fillRect(0,0,W,H);
  var logo=await loadLogoImage();
  var y=34;
  var textX=padX;
  if(logo){
    var logoW=64,logoH=42; // matches logo.png aspect ratio  -  no circular clip, shape is already clean
    ctx.drawImage(logo,padX,y-12-logoH/2,logoW,logoH);
    textX=padX+logoW+10;
  }
  ctx.fillStyle='#1A0A00';ctx.font='bold 20px Arial';ctx.fillText(STORE.store_name,textX,y);y+=18;
  ctx.fillStyle='#6B3E1A';ctx.font='11px Arial';
  ctx.fillText(STORE.address,padX,y);y+=15;
  ctx.fillText('Call/WhatsApp: '+STORE.contact_number,padX,y);y+=22;
  ctx.strokeStyle='#E8D8C0';ctx.beginPath();ctx.moveTo(padX,y);ctx.lineTo(W-padX,y);ctx.stroke();y+=22;
  ctx.fillStyle='#1A0A00';ctx.font='bold 12px Arial';
  ctx.fillText('Invoice: '+s.billNo,padX,y);y+=lineH;
  ctx.fillText('Date: '+s.date,padX,y);y+=lineH;
  if(s.customer&&s.customer!=='Walk-in'){ctx.fillText('Customer: '+s.customer,padX,y);y+=lineH;}
  y+=4;
  ctx.font='bold 11px Arial';ctx.fillStyle='#6B3E1A';
  ctx.fillText('Item',padX,y);ctx.fillText('Qty',W-180,y);ctx.fillText('Price',W-130,y);ctx.fillText('Total',W-70,y);
  y+=8;ctx.strokeStyle='#1A0A00';ctx.beginPath();ctx.moveTo(padX,y);ctx.lineTo(W-padX,y);ctx.stroke();y+=18;
  ctx.font='12px Arial';ctx.fillStyle='#1A0A00';
  s.items.forEach(function(it){
    var nm=it.name.length>20?it.name.slice(0,18)+'..':it.name;
    ctx.fillText(nm,padX,y);
    ctx.fillText(String(it.qty),W-180,y);
    ctx.fillText(fmt(it.price),W-130,y);
    ctx.fillText(fmt(it.qty*it.price),W-70,y);
    y+=20;
  });
  y+=4;ctx.strokeStyle='#E8D8C0';ctx.beginPath();ctx.moveTo(padX,y);ctx.lineTo(W-padX,y);ctx.stroke();y+=20;
  ctx.font='12px Arial';ctx.fillText('Subtotal',padX,y);ctx.fillText(fmt(s.subtotal),W-90,y);y+=18;
  if(s.discount>0){ctx.fillText('Discount',padX,y);ctx.fillText('-'+fmt(s.discount),W-90,y);y+=18;}
  ctx.strokeStyle='#1A0A00';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(padX,y);ctx.lineTo(W-padX,y);ctx.stroke();ctx.lineWidth=1;y+=22;
  ctx.font='bold 16px Arial';ctx.fillText('Total',padX,y);ctx.fillText(fmt(s.total),W-100,y);y+=26;
  ctx.font='11px Arial';ctx.fillStyle='#6B3E1A';
  ctx.fillText('Payment: '+s.paymentMode+(s.cashier?' - Served by: '+s.cashier:''),padX,y);y+=22;
  ctx.strokeStyle='#E8D8C0';ctx.beginPath();ctx.moveTo(padX,y);ctx.lineTo(W-padX,y);ctx.stroke();y+=18;
  ctx.font='10px Arial';
  var thanks=['Thank you for shopping with '+STORE.store_name+'.','Queries: Call/WhatsApp '+STORE.contact_number,'Follow us on TikTok: '+STORE.tiktok_handle,'We look forward to serving you again.'];
  thanks.forEach(function(line){ctx.fillText(line,padX,y);y+=15;});
  return cv;
}
function canvasToBlob(cv){
  return new Promise(function(resolve){cv.toBlob(function(b){resolve(b);},'image/png');});
}

// -- SHARE VIA WHATSAPP  -  tries native image share first, falls back to text --
async function shareInvoiceWhatsApp(){
  var s=window._lastSale;if(!s){toast('No sale data available','err');return;}
  if(!s.phone||!isValidPhone(s.phone)){toast('No valid WhatsApp number for this sale','err');return;}
  var logged=false;
  try{
    var cv=await renderReceiptCanvas(s);
    var blob=await canvasToBlob(cv);
    var file=new File([blob],'Receipt_'+s.billNo+'.png',{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:STORE.store_name,text:'Invoice '+s.billNo+' - '+STORE.store_name});
      await sb.from('whatsapp_invoice_logs').insert({sale_id:s.saleId,customer_phone:s.phone,sent_by:CUP&&CUP.id,status:'sent'});
      logged=true;
      await sb.from('sales').update({whatsapp_invoice_sent:true,whatsapp_sent_at:new Date().toISOString(),whatsapp_sent_by:CUP&&CUP.id}).eq('id',s.saleId);
      logActivity('whatsapp_invoice_sent','bill',{bill_no:s.billNo,phone:s.phone,mode:'image'});
      toast('Receipt ready to share - pick WhatsApp','ok');
      return;
    }
  }catch(ex){
    if(ex&&ex.name==='AbortError'){toast('Share cancelled','warn');return;}
  }
  try{
    var waNum=normalizePhone(s.phone);
    var text=generateInvoiceText(s);
    var url='https://wa.me/'+waNum+'?text='+encodeURIComponent(text);
    window.open(url,'_blank');
    if(!logged)await sb.from('whatsapp_invoice_logs').insert({sale_id:s.saleId,customer_phone:s.phone,sent_by:CUP&&CUP.id,status:'sent'});
    await sb.from('sales').update({whatsapp_invoice_sent:true,whatsapp_sent_at:new Date().toISOString(),whatsapp_sent_by:CUP&&CUP.id}).eq('id',s.saleId);
    logActivity('whatsapp_invoice_sent','bill',{bill_no:s.billNo,phone:s.phone,mode:'text'});
    toast('Receipt image not supported on this device - sent as text instead','ok',5000);
  }catch(ex2){
    try{await sb.from('whatsapp_invoice_logs').insert({sale_id:s.saleId,customer_phone:s.phone,sent_by:CUP&&CUP.id,status:'failed',error_message:ex2.message});}catch(e3){}
    toast('Could not open WhatsApp - sale is already saved','warn');
  }
}

function iInv(){

  if(il){
    var p=prods.filter(function(pr){return(pr.stock||0)>0&&(!q||(pr.name||'').toLowerCase().indexOf(q)>=0||(pr.sku||'').toLowerCase().indexOf(q)>=0);});

function renderInvList(p,c){
  if(!p.length){c.innerHTML='<div class="em"><div class="ei">-</div><p style="font-size:.72rem">No items</p></div>';return;}
  var cats={};p.forEach(function(pr){if(!cats[pr.cat])cats[pr.cat]={items:[],qty:0,val:0};cats[pr.cat].items.push(pr);cats[pr.cat].qty+=pr.stock||0;cats[pr.cat].val+=(pr.stock||0)*pr.cost;});
  var tv2=p.reduce(function(s,pr){return s+(pr.stock||0)*pr.cost;},0);
  var html='';var catKeys=Object.keys(cats);
  for(var ci=0;ci<catKeys.length;ci++){
    var cat=catKeys[ci];var d=cats[cat];
    html+='<div style="margin-bottom:14px"><div class="rh"><div>'+cat+'</div><div>'+d.qty+' pcs - '+fmt(d.val)+'</div></div>';
    html+='<div style="border:1px solid #E8D8C0;border-top:none;border-radius:0 0 9px 9px">';
    html+='<div class="ih"><div>Item</div><div style="text-align:center">Qty</div><div style="text-align:right">Age</div><div style="text-align:right">Value</div></div>';
    for(var pi=0;pi<d.items.length;pi++){
      var pr=d.items[pi];
      var ac2=pr.age>=90?'var(--red)':pr.age>=60?'var(--gold)':pr.age>=30?'#7A6000':'var(--sage)';
      var vid=pr.id;
      html+='<div class="ir" id="row-'+vid+'" onclick="showStockDetail(\''+vid+'\')">';
      html+='<div><div style="font-size:.7rem;font-weight:600">'+pr.name+'</div>';
      html+='<div style="font-size:.55rem;color:var(--ink3)">'+(pr.colour||'')+(pr.size?' - '+pr.size:'')+'</div>';
      html+='<div style="font-family:monospace;font-size:.5rem;color:var(--ink3)">'+pr.sku+'</div></div>';
      html+='<div style="text-align:center"><span style="font-size:.85rem;font-weight:700;color:'+(pr.stock<=2?'var(--red)':'var(--sage)')+'">'+pr.stock+'</span>';
      if(pr.stock<=2)html+='<div style="font-size:.48rem;color:var(--red)">LOW</div>';
      html+='</div>';
      html+='<div style="text-align:right;font-size:.6rem;font-weight:700;color:'+ac2+'">'+pr.age+'d</div>';

function toggleIRFilters(){
  var el=document.getElementById('ir-filters');
  if(!el)return;
  var open=el.style.display!=='none';
  el.style.display=open?'none':'block';
  var btn=document.getElementById('ir-filt-btn');
  if(btn)btn.textContent=open?'Filter':'Hide Filter';
}

function clearIRFilters(){
  ['irf-cat','irf-status','irf-fabric','irf-season','irf-colour','irf-size','irf-brand','irf-age'].forEach(function(id){
    var el=document.getElementById(id);if(el)el.value='';
  });
  var srch=document.getElementById('ir-search');if(srch)srch.value='';
  _IR.filters={q:'',cat:'',fabric:'',season:'',segment:'',design:'',colour:'',brand:'',size:'',status:'',age:''};
  loadIRPage(0);
}

var _irSearchTimer=null;
function onIRSearch(){
  clearTimeout(_irSearchTimer);
  _irSearchTimer=setTimeout(function(){
    _IR.filters.q=(document.getElementById('ir-search')&&document.getElementById('ir-search').value||'').trim();
    loadIRPage(0);
  },300);
}

function applyIRFilters(){
  _IR.filters.cat=document.getElementById('irf-cat')&&document.getElementById('irf-cat').value||'';
  _IR.filters.status=document.getElementById('irf-status')&&document.getElementById('irf-status').value||'';

  _IR.filters.season=document.getElementById('irf-season')&&document.getElementById('irf-season').value||'';
  _IR.filters.colour=document.getElementById('irf-colour')&&document.getElementById('irf-colour').value||'';

// -- Sort handler --
function sortIR(col){
  if(_IR.sort.col===col)_IR.sort.dir=_IR.sort.dir==='asc'?'desc':'asc';
  else{_IR.sort.col=col;_IR.sort.dir='asc';}
  loadIRPage(_IR.page);
}
function irSortIcon(col){return _IR.sort.col===col?(_IR.sort.dir==='asc'?' ^':' v'):' ~';}

// -- Main data loader --
async function loadIRPage(page){
  if(_IR.loading)return;
  var tbl=document.getElementById('ir-table');if(!tbl)return;
  _IR.loading=true;_IR.page=page;
  tbl.innerHTML='<div class="em"><div style="width:20px;height:20px;border:2px solid rgba(0,0,0,.1);border-radius:50%;border-top-color:var(--gold);animation:sp .8s linear infinite;margin:0 auto"></div></div>';
  try{
    var q=sb.from('v_inventory_register').select('*',{count:'exact'})
      .gt('qty_total',0); // Fix 2: hide zero-qty items (out of stock)
    // Search
    if(_IR.filters.q)q=q.or('sku.ilike.%'+_IR.filters.q+'%,product_name.ilike.%'+_IR.filters.q+'%');
    // Filters
    if(_IR.filters.cat)q=q.eq('category',_IR.filters.cat);
    if(_IR.filters.fabric)q=q.eq('fabric',_IR.filters.fabric);
    if(_IR.filters.season)q=q.eq('season',_IR.filters.season);
    if(_IR.filters.colour)q=q.eq('colour',_IR.filters.colour);
    if(_IR.filters.size)q=q.eq('size',_IR.filters.size);
    if(_IR.filters.brand)q=q.eq('brand',_IR.filters.brand);
    if(_IR.filters.status)q=q.eq('stock_status',_IR.filters.status);
    if(_IR.filters.age){
      var ageParts=_IR.filters.age.split('-');
      if(_IR.filters.age==='181+')q=q.gte('age_days',181);
      else if(ageParts.length===2){q=q.gte('age_days',Number(ageParts[0])).lte('age_days',Number(ageParts[1]));}
    }
    // Sort
    q=q.order(_IR.sort.col,{ascending:_IR.sort.dir==='asc'});
    // Pagination
    var from=page*_IR.perPage,to=from+_IR.perPage-1;
    q=q.range(from,to);
    var res=await q;
    _IR.data=res.data||[];_IR.total=res.count||0;
    renderIRTable();
    renderIRPagination();
  }catch(e){tbl.innerHTML='<div class="ib">Inventory Register requires Phase 7 SQL to be run first.</div>';}
  _IR.loading=false;
}

function renderIRPagination(){
  var pg=document.getElementById('ir-pagination');if(!pg)return;
  var totalPages=Math.ceil(_IR.total/_IR.perPage);
  if(totalPages<=1){pg.innerHTML='<div style="font-size:.6rem;color:var(--ink3)">Showing '+_IR.data.length+' of '+_IR.total+' records</div>';return;}
  var h='<div style="font-size:.6rem;color:var(--ink3);margin-right:8px">'+_IR.total+' records</div>';
  h+='<button class="btn bh bsm" onclick="loadIRPage(0)" '+(0===_IR.page?'disabled':'')+'>&laquo;</button>';
  h+='<button class="btn bh bsm" onclick="loadIRPage('+(_IR.page-1)+')" '+(_IR.page===0?'disabled':'')+'>&lsaquo;</button>';
  var start=Math.max(0,_IR.page-2),end=Math.min(totalPages-1,start+4);
  for(var p=start;p<=end;p++){h+='<button class="btn '+(p===_IR.page?'bi':'bh')+' bsm" onclick="loadIRPage('+p+')">'+(p+1)+'</button>';}
  h+='<button class="btn bh bsm" onclick="loadIRPage('+(_IR.page+1)+')" '+(_IR.page>=totalPages-1?'disabled':'')+'>&rsaquo;</button>';
  h+='<button class="btn bh bsm" onclick="loadIRPage('+(totalPages-1)+')" '+(_IR.page>=totalPages-1?'disabled':'')+'>&raquo;</button>';
  pg.innerHTML=h;
}

// -- Export functions --
async function exportIR(format){
  toast('Preparing export...','ok',2000);
  // Load all matching records (no pagination for export)
  var q=sb.from('v_inventory_register').select('*').gt('qty_total',0);
  if(_IR.filters.q)q=q.or('sku.ilike.%'+_IR.filters.q+'%,product_name.ilike.%'+_IR.filters.q+'%');
  if(_IR.filters.cat)q=q.eq('category',_IR.filters.cat);
  if(_IR.filters.fabric)q=q.eq('fabric',_IR.filters.fabric);
  if(_IR.filters.season)q=q.eq('season',_IR.filters.season);
  if(_IR.filters.colour)q=q.eq('colour',_IR.filters.colour);
  if(_IR.filters.size)q=q.eq('size',_IR.filters.size);
  if(_IR.filters.brand)q=q.eq('brand',_IR.filters.brand);
  if(_IR.filters.status)q=q.eq('stock_status',_IR.filters.status);
  if(_IR.filters.age){var ageParts=_IR.filters.age.split('-');if(_IR.filters.age==='181+')q=q.gte('age_days',181);else if(ageParts.length===2){q=q.gte('age_days',Number(ageParts[0])).lte('age_days',Number(ageParts[1]));}}
  q=q.order(_IR.sort.col,{ascending:_IR.sort.dir==='asc'}).limit(2000);
  var res=await q;var rows=res.data||[];
  if(!rows.length){toast('No data to export','warn');return;}

  var cols=['sku','product_name','category','fabric','season','customer_segment','size','design','colour','brand','qty_available','qty_damaged','qty_total','purchase_price','inventory_value','age_days','stock_status'];
  var labels=['SKU','Product Name','Category','Fabric','Season','Segment','Size','Design','Colour','Brand','Available','Damaged','Total','Unit Cost','Inventory Value','Age Days','Status'];

  if(format==='csv'){
    var csvRows=[labels.join(',')];
    rows.forEach(function(r){csvRows.push(cols.map(function(c){return'"'+(r[c]||'').toString().replace(/"/g,'""')+'"';}).join(','));});
    var blob=new Blob([csvRows.join('\n')],{type:'text/csv'});
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Inventory_'+td()+'.csv';a.click();
    toast('CSV exported','ok');
  } else if(format==='excel'){
    var html='<table border="1"><thead><tr>'+labels.map(function(l){return'<th>'+l+'</th>';}).join('')+'</tr></thead><tbody>';
    rows.forEach(function(r){html+='<tr>'+cols.map(function(c){return'<td>'+(r[c]||'')+'</td>';}).join('')+'</tr>';});
    html+='</tbody></table>';
    var blob=new Blob([html],{type:'application/vnd.ms-excel'});
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Inventory_'+td()+'.xls';a.click();
    toast('Excel exported','ok');
  } else if(format==='print'){
    var w=window.open('','_blank');
    var tbl='<table border="1" style="border-collapse:collapse;font-size:11px;width:100%"><thead><tr style="background:#1A0A00;color:white">'+labels.map(function(l){return'<th style="padding:4px 6px">'+l+'</th>';}).join('')+'</tr></thead><tbody>';
    rows.forEach(function(r,i){tbl+='<tr style="background:'+(i%2?'#f5f0eb':'white')+'">';tbl+=cols.map(function(c){return'<td style="padding:3px 6px">'+(r[c]||'')+'</td>';}).join('');tbl+='</tr>';});
    tbl+='</tbody></table>';
    w.document.write('<html><head><title>Inventory Register</title><style>body{font-family:Arial;padding:14px}@media print{button{display:none}}</style></head><body>');

var _scannerActive=false;
var _btBuffer='';var _btTimer=null;

// Bluetooth/USB wedge scanner: listens for rapid keystrokes ending in Enter
function initBtScannerListener(){
  document.addEventListener('keydown',function(e){
    // Only intercept when Bill tab is active AND user is NOT typing in an input/textarea
    var activeEl=document.activeElement;
    var inInput=activeEl&&(activeEl.tagName==='INPUT'||activeEl.tagName==='TEXTAREA'||activeEl.tagName==='SELECT');
    if(inInput)return; // let normal product search work uninterrupted
    var activeTab=document.querySelector && document.querySelector('#nt .pl.on');
    if(!activeTab||activeTab.textContent!=='BILL')return;
    if(e.key==='Enter'&&_btBuffer.length>3){
      var code=_btBuffer;_btBuffer='';clearTimeout(_btTimer);
      handleBarcodeResult(code);
      e.preventDefault();
      return;
    }
    if(e.key.length===1){
      _btBuffer+=e.key;
      clearTimeout(_btTimer);
      _btTimer=setTimeout(function(){_btBuffer='';},200);
    }
  });
}

// Camera scanner using ZXing
var _zxingReader=null;
function openBarcodeScanner(){
  if(_scannerActive){closeBarcodeScanner();return;}
  // Lazy-load ZXing
  if(!window.ZXing){
    var sc=document.createElement('script');
    sc.src='https://cdn.jsdelivr.net/npm/@zxing/browser@latest/umd/index.min.js';
    sc.onload=function(){startCameraScanner();};
    sc.onerror=function(){toast('Camera scanner unavailable  -  use Bluetooth scanner','warn');};
    document.head.appendChild(sc);
  } else {
    startCameraScanner();
  }
}
function startCameraScanner(){
  _scannerActive=true;
  var scanBtn=document.getElementById('scan-btn');
  if(scanBtn)scanBtn.textContent='Stop Scan';
  // Build scanner overlay
  var overlay=document.createElement('div');
  overlay.id='scan-overlay';
  overlay.style.cssText='position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.92);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;';
  overlay.innerHTML='<div style="color:white;font-size:.8rem;margin-bottom:12px">Point camera at barcode</div>'+
    '<video id="scan-video" style="width:92vw;max-width:420px;border-radius:12px;border:2px solid var(--gold)"></video>'+
    '<div id="scan-status" style="color:#aaa;font-size:.65rem;margin-top:8px">Initialising camera...</div>'+
    '<button onclick="closeBarcodeScanner()" style="margin-top:16px;padding:10px 28px;border-radius:20px;background:var(--red);color:white;border:none;font-size:.75rem;cursor:pointer">Cancel</button>';
  document.body.appendChild(overlay);
  try{
    var hints=new Map();
    var formats=[ZXing.BarcodeFormat.CODE_128,ZXing.BarcodeFormat.CODE_39,
      ZXing.BarcodeFormat.EAN_13,ZXing.BarcodeFormat.EAN_8,ZXing.BarcodeFormat.QR_CODE];
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,formats);
    _zxingReader=new ZXing.BrowserMultiFormatReader(hints);
    _zxingReader.decodeFromVideoDevice(null,'scan-video',function(result,err){
      if(result){
        var code=result.getText();
        closeBarcodeScanner();
        handleBarcodeResult(code);
      }
      if(err&&!(err instanceof ZXing.NotFoundException)){
        var st=document.getElementById('scan-status');
        if(st)st.textContent='Scanning...';
      }
    });
    var st=document.getElementById('scan-status');
    if(st)st.textContent='Camera active  -  scan a barcode';
  }catch(ex){
    closeBarcodeScanner();
    toast('Camera error: '+ex.message,'err');
  }
}
function closeBarcodeScanner(){
  _scannerActive=false;
  if(_zxingReader){try{_zxingReader.reset();}catch(e){}; _zxingReader=null;}
  var ov=document.getElementById('scan-overlay');if(ov)ov.remove();
  var scanBtn=document.getElementById('scan-btn');
  if(scanBtn)scanBtn.textContent='Scan';
}
async function handleBarcodeResult(code){
  if(!code)return;
  toast('Barcode: '+code,'ok',2000);
  // Look up product by barcode first, then SKU
  var p=prods.find(function(pr){return pr.barcode===code||pr.sku===code;});

    // Try DB lookup (in case prods cache is stale)
    var res=await sb.from('product_variants').select('id').or('barcode.eq.'+code+',sku.eq.'+code).single();
    if(res.data){
      await loadData();
      p=prods.find(function(pr){return pr.id===res.data.id;});

  // Add to cart  -  works on Bill tab

// ==============================================================
// SL COLLECTION POS -- OFFLINE-FIRST ENGINE
// IndexedDB local store + sync queue + status bar
// ==============================================================

// ── IndexedDB setup ──
var _odb=null;
var ODB_NAME='slc_pos_v1';
var ODB_VER=2;

function openOfflineDB(){
  return new Promise(function(resolve,reject){
    if(_odb){resolve(_odb);return;}
    var req=indexedDB.open(ODB_NAME,ODB_VER);
    req.onupgradeneeded=function(e){
      var db=e.target.result;
      // Master data cache
      if(!db.objectStoreNames.contains('cache'))
        db.createObjectStore('cache',{keyPath:'key'});
      // Sync queue
      if(!db.objectStoreNames.contains('queue')){
        var qs=db.createObjectStore('queue',{keyPath:'local_id'});
        qs.createIndex('status','status',{unique:false});
        qs.createIndex('created_at','created_at',{unique:false});
      }
    };
    req.onsuccess=function(e){_odb=e.target.result;resolve(_odb);};
    req.onerror=function(){reject(req.error);};
  });
}

function idbPut(store,obj){
  return openOfflineDB().then(function(db){
    return new Promise(function(res,rej){
      var tx=db.transaction(store,'readwrite');
      tx.objectStore(store).put(obj);
      tx.oncomplete=function(){res(true);};
      tx.onerror=function(){rej(tx.error);};
    });
  });
}
function idbGet(store,key){
  return openOfflineDB().then(function(db){
    return new Promise(function(res,rej){
      var tx=db.transaction(store,'readonly');
      var req=tx.objectStore(store).get(key);
      req.onsuccess=function(){res(req.result);};
      req.onerror=function(){rej(req.error);};
    });
  });
}
function idbGetAll(store,indexName,value){
  return openOfflineDB().then(function(db){
    return new Promise(function(res,rej){
      try{
        var tx=db.transaction(store,'readonly');
        var os=tx.objectStore(store);
        var req=(indexName&&os.indexNames.contains(indexName))
          ?os.index(indexName).getAll(value)
          :os.getAll();
        req.onsuccess=function(){res(req.result||[]);};
        req.onerror=function(){rej(req.error);};
      }catch(e){res([]);}
    });
  }).catch(function(){return [];});
}

// ── Cache master data to IndexedDB ──
async function cacheToLocal(key,data){
  try{await idbPut('cache',{key:key,data:data,ts:Date.now()});}
  catch(e){console.warn('Cache write failed:',e);}
}
async function readFromCache(key){
  try{var r=await idbGet('cache',key);return r&&r.data||null;}
  catch(e){return null;}
}

// ── Generate a local UUID ──
function localUUID(){
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){
    var r=Math.random()*16|0,v=c=='x'?r:(r&0x3|0x8);
    return v.toString(16);
  });
}

// ── Queue a transaction for offline sync ──
async function queueOffline(type,payload){
  var item={
    local_id:localUUID(),
    type:type,
    payload:payload,
    status:'pending',
    created_at:new Date().toISOString(),
    retry_count:0,
    offline_bill_no:payload.offline_bill_no||null
  };
  await idbPut('queue',item);
  updateSyncStatus();
  return item;
}

// ── Get pending queue ──
async function getPendingQueue(){
  // Scan all queue items and filter - more reliable than index lookup
  var all = await idbGetAll('queue',null,null);
  return all.filter(function(i){return i.status==='pending';});
}

// ── Mark synced ──
async function markSynced(local_id){
  var item=await idbGet('queue',local_id);
  if(item){item.status='synced';item.synced_at=new Date().toISOString();await idbPut('queue',item);}
}
async function markFailed(local_id,err){
  var item=await idbGet('queue',local_id);
  if(item){item.status='failed';item.last_error=err;item.retry_count=(item.retry_count||0)+1;await idbPut('queue',item);}
}

// ── Online/offline status ──
var _isOnline=navigator.onLine;
var _isSyncing=false;

function initConnectivityWatcher(){
  window.addEventListener('online',function(){
    _isOnline=true;
    updateSyncStatus();
    setTimeout(runSyncQueue,1500); // small delay to let connection settle
  });
  window.addEventListener('offline',function(){
    _isOnline=false;
    updateSyncStatus();
  });
  updateSyncStatus();
}

async function updateSyncStatus(){
  var bar=document.getElementById('sync-status-bar');
  if(!bar)return;
  var pending=0;
  try{
    var allQ=await idbGetAll('queue',null,null);
    pending=allQ.filter(function(i){return i.status==='pending'||i.status==='failed';}).length;
  }catch(e){}
  var bg,txt;
  if(_isSyncing){bg='#7A6000';txt='Syncing... ('+pending+' pending)';}
  else if(!_isOnline){bg='var(--red)';txt='Offline'+(pending?' - '+pending+' pending':' - data saved locally');}
  else if(pending>0){bg='var(--gold)';txt='Online - '+pending+' transactions pending sync';}
  else{bg='var(--sage)';txt='Online';}
  bar.style.background=bg;
  bar.innerHTML='<span style="font-size:.6rem;font-weight:700;color:white">'+txt+'</span>';
  // Always allow tap-to-sync when online with pending items
  if(pending>0&&_isOnline){
    bar.style.cursor='pointer';
    bar.onclick=function(){if(!_isSyncing)runSyncQueue();};
    bar.title='Tap to sync '+pending+' pending transaction'+(pending>1?'s':'');
  } else {
    bar.onclick=null;
    bar.style.cursor='default';
  }
}

// ── SYNC QUEUE ──
var _syncLock=false;
async function runSyncQueue(){
  if(_syncLock||!_isOnline)return;
  _syncLock=true;_isSyncing=true;updateSyncStatus();
  try{
    // Re-authenticate if session expired during offline period
    var sess=await sb.auth.getSession();
    if(!sess.data.session){
      _isSyncing=false;_syncLock=false;updateSyncStatus();
      toast('Session expired - please log in again to sync','err',5000);
      return;
    }
    // Include failed items with retry_count < 5
    var allItems=await idbGetAll('queue',null,null);
    var queue=allItems.filter(function(i){return i.status==='pending';});
    var retryQueue=allItems.filter(function(i){return i.status==='failed'&&(i.retry_count||0)<5;});
    queue=queue.concat(retryQueue);
    if(!queue.length){_isSyncing=false;_syncLock=false;updateSyncStatus();return;}
    toast('Syncing '+queue.length+' offline transaction'+(queue.length>1?'s':'')+'...','ok',3000);
    var success=0,failed=0;
    for(var i=0;i<queue.length;i++){
      var item=queue[i];
      try{
        // Idempotency check - try sync_log first, fall back gracefully if table missing
        var alreadySynced=false;
        try{
          var check=await sb.from('sync_log').select('id').eq('local_id',item.local_id).maybeSingle();
          if(check.data)alreadySynced=true;
        }catch(e){/* sync_log table may not exist yet - continue with sync */}
        if(alreadySynced){await markSynced(item.local_id);success++;continue;}
        // Sync based on type
        if(item.type==='sale') await syncSale(item);
        else if(item.type==='purchase') await syncPurchase(item);
        else if(item.type==='cash') await syncCash(item);
        // Record in sync_log for duplicate prevention
        try{
          await sb.from('sync_log').insert({
            local_id:item.local_id,entity_type:item.type,
            bill_no:item.offline_bill_no,
            device_info:navigator.userAgent.slice(0,80)
          });
        }catch(e){/* non-fatal if sync_log missing */}
        await markSynced(item.local_id);
        success++;
        updateSyncStatus();
      }catch(ex){
        console.error('Sync failed for '+item.local_id+':',ex.message);
        await markFailed(item.local_id,ex.message);
        failed++;
      }
    }
    await loadData();
    var msg='Sync complete: '+success+' uploaded';
    if(failed)msg+=' | '+failed+' failed (will retry)';
    toast(msg,'ok',5000);
  }catch(ex){
    console.error('Sync queue error:',ex);
    toast('Sync error: '+ex.message,'err');
  }
  _isSyncing=false;_syncLock=false;updateSyncStatus();
  // Schedule retry for any remaining failed items
  try{
    var remaining=await idbGetAll('queue',null,null);
    var hasRetryable=remaining.some(function(i){return i.status==='failed'&&(i.retry_count||0)<5;});
    if(hasRetryable)setTimeout(runSyncQueue,30000);
  }catch(e){}
}

// ── Sync a sale to Supabase ──
async function syncSale(item){
  var p=item.payload;
  var ca=accs.find(function(a){return a.name==='Cash Drawer';});
  // Resolve or create customer
  var custId=p.customer_id||null;
  if(!custId&&p.customer&&p.customer!=='Walk-in'){
    var cp=parties.find(function(pt){return pt.name===p.customer&&pt.party_type==='customer';});
    if(!cp){var nr=await sb.from('parties').insert({party_type:'customer',name:p.customer,created_by:CUP&&CUP.id}).select().single();if(nr.data){parties.push(nr.data);cp=nr.data;}}
    custId=cp&&cp.id||null;
  }
  // Insert transaction
  var trIns=await insertWithUniqueNo('transactions','BILL',function(no){return{transaction_no:no,transaction_type:'sale',transaction_date:p.date,party_id:custId,total_amount:p.total,paid_amount:p.payMode==='credit'?0:p.total,payment_status:p.payMode==='credit'?'credit':'paid',performed_by:CUP&&CUP.id,notes:'Synced offline: '+p.offline_bill_no};});
  var txnId=trIns.data.id;var bn=trIns.no;
  // Sale items + stock movements
  for(var k=0;k<p.cart.length;k++){
    var it=p.cart[k];
    await sb.rpc('process_stock_movement',{p_variant_id:it.id,p_movement_type:'sale',p_qty:it.qty,p_reason:'Sale '+bn,p_cost_impact:it.cost||0,p_user_id:CUP&&CUP.id});
  }
  // Sales table
  var saleRow=await sb.from('sales').insert({transaction_id:txnId,customer_party_id:custId,customer_name:p.customer||'Walk-in',sale_date:p.date,subtotal:p.subtotal,total_amount:p.total,paid_amount:p.payMode==='credit'?0:p.total,payment_mode:p.payMode||'cash',gross_profit:p.margin,performed_by:CUP&&CUP.id}).select().single();
  // Sale items
  if(saleRow.data){
    await sb.from('sale_items').insert(p.cart.map(function(it){return{sale_id:saleRow.data.id,transaction_id:txnId,variant_id:it.id,qty:it.qty,purchase_price:it.cost||0,sale_price:it.price||0};}));
  }
  // Ledger + cash entries
  if(ca&&p.payMode!=='credit'){
    await sb.from('ledger_entries').insert({transaction_id:txnId,entry_date:p.date,entry_type:'credit',account_category:'cashflow',cashflow_account_id:ca.id,amount:p.total,description:'Sale: '+bn,created_by:CUP&&CUP.id});
    await sb.from('cash_entries').insert({transaction_id:txnId,entry_date:p.date,amount:p.total,direction:'in',account_id:ca.id,description:'Sale Receipt: '+bn,nature:'receipt',party_category:'Customer Receipt'});
  }
  if(custId){
    await sb.from('ledger_entries').insert({transaction_id:txnId,entry_date:p.date,entry_type:'debit',account_category:'party',party_id:custId,amount:p.total,description:'Sale: '+bn,created_by:CUP&&CUP.id});
  }
  if(p.cost>0)await sb.from('ledger_entries').insert({transaction_id:txnId,entry_date:p.date,entry_type:'debit',account_category:'expense',amount:p.cost,description:'COGS: '+bn,created_by:CUP&&CUP.id});
  logActivity('sale_synced','offline',{offline_no:p.offline_bill_no,bill_no:bn});
}

// ── Sync a purchase to Supabase ──
async function syncPurchase(item){
  var p=item.payload;
  var catCode=CCOD[p.category]||p.category.substring(0,3).toUpperCase();
  var cl=p.colour||'';var sz=p.size||'';
  var prefix=catCode+'-'+colCode(cl)+'-'+szCode(sz);
  var tot=p.total;var pd=p.paid||0;
  var ca=accs.find(function(a){return a.name==='Cash Drawer';});
  // Resolve supplier
  var sp=null;
  if(p.supplier){
    sp=parties.find(function(pt){return pt.name===p.supplier&&pt.party_type==='supplier';});
    if(!sp){var nr2=await sb.from('parties').insert({party_type:'supplier',name:p.supplier,created_by:CUP&&CUP.id}).select().single();if(nr2.data){parties.push(nr2.data);sp=nr2.data;}}
  }
  // Resolve/create category
  var catRow=await sb.from('categories').select('id').eq('name',p.category).maybeSingle();
  var catId=catRow.data&&catRow.data.id||null;
  // Resolve/create product
  var existProd=catId?await sb.from('products').select('id').eq('name',p.product_name).eq('category_id',catId).maybeSingle():null;
  var prodId=existProd&&existProd.data&&existProd.data.id||null;
  if(!prodId){var np=await sb.from('products').upsert({name:p.product_name,category_id:catId,created_by:CUP&&CUP.id},{onConflict:'name,category_id'}).select().single();if(np.data)prodId=np.data.id;}
  // Create variant
  var skuVal=await genUniqueNo(prefix,0);
  var variant=await sb.from('product_variants').insert({product_id:prodId,sku:skuVal,colour:cl,colour_code:colCode(cl),size:sz,size_code:szCode(sz),purchase_price:p.cost,created_by:CUP&&CUP.id}).select().single();
  if(variant.error)throw variant.error;
  // Stock
  await sb.from('inventory').insert({variant_id:variant.data.id,qty_available:p.qty,cost_price:p.cost,age_days:0}).catch(function(){return sb.from('inventory').update({qty_available:p.qty}).eq('variant_id',variant.data.id);});
  // Transaction
  var txn=await insertWithUniqueNo('transactions','PUR',function(no){return{transaction_no:no,transaction_type:'purchase',transaction_date:p.date,party_id:sp&&sp.id||null,total_amount:tot,paid_amount:pd,payment_status:p.payMode==='credit'?'credit':'paid',performed_by:CUP&&CUP.id,notes:'Synced offline: '+p.offline_bill_no};});
  logActivity('purchase_synced','offline',{offline_no:p.offline_bill_no,sku:skuVal});
}

// ── Sync a cash entry to Supabase ──
async function syncCash(item){
  var p=item.payload;
  var tIns=await insertWithUniqueNo('transactions','CASH',function(noVal){return{transaction_no:noVal,transaction_type:p.nature,transaction_date:p.date,party_id:p.party_id||null,total_amount:p.amount,paid_amount:p.amount,payment_status:'paid',performed_by:CUP&&CUP.id,notes:p.description};});
  if(p.nature==='income'||p.nature==='expense'){
    await sb.from('cash_entries').insert({transaction_id:tIns.data.id,entry_date:p.date,amount:p.amount,direction:p.direction,account_id:p.account_id||null,description:p.description,nature:p.nature,party_category:p.category});
  }
  await sb.from('ledger_entries').insert({transaction_id:tIns.data.id,entry_date:p.date,entry_type:p.direction==='in'?'credit':'debit',account_category:'cashflow',cashflow_account_id:p.account_id||null,amount:p.amount,description:p.description,created_by:CUP&&CUP.id});
}

// ── Cache master data after every successful loadData ──
async function cacheMasterData(){
  try{
    await Promise.all([
      cacheToLocal('prods',prods),
      cacheToLocal('parties',parties),
      cacheToLocal('accs',accs),
      cacheToLocal('CATS',CATS),
      cacheToLocal('CCOD',CCOD),
      cacheToLocal('CUP',CUP),
      cacheToLocal('store_settings',STORE)
    ]);
    console.log('Master data cached: '+prods.length+' products, '+parties.length+' parties');
  }catch(e){console.warn('Master cache failed:',e);}
}

// ── Load from cache when offline ──
async function loadFromCache(){
  try{
    var cachedProds=await readFromCache('prods');
    var cachedParties=await readFromCache('parties');
    var cachedAccs=await readFromCache('accs');
    if(cachedProds&&cachedProds.length){prods=cachedProds;}
    if(cachedParties&&cachedParties.length){parties=cachedParties;}
    if(cachedAccs&&cachedAccs.length){accs=cachedAccs;}
    var cachedCUP=await readFromCache('CUP');
    if(cachedCUP&&!CUP)CUP=cachedCUP;
    var cachedStore=await readFromCache('store_settings');
    if(cachedStore)STORE=Object.assign({},STORE,cachedStore);
    var count=prods.length+parties.length+accs.length;
    if(count>0){
      toast('Offline mode - '+prods.length+' products loaded from cache','warn',4000);
      return true;
    } else {
      toast('No offline data cached yet. You must go online first to cache data.','err',6000);
      return false;
    }
  }catch(e){
    console.error('loadFromCache error:',e);
    toast('Cache error: '+e.message,'err',5000);
    return false;
  }
}

// ── Manual sync trigger ──
function manualSync(){
  if(!_isOnline){toast('No internet connection','err');return;}
  if(_isSyncing){toast('Sync already in progress','warn');return;}
  runSyncQueue();
}
