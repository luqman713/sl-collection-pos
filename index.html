<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SL Collection — POS</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--ink:#1A0A00;--ink2:#3D1F08;--ink3:#6B3E1A;--cream:#FAF6F0;--cream2:#F2E9DC;--cream3:#E8D4BC;--gold:#B8860B;--gold2:#D4A017;--gold3:#F0C040;--rust:#8B3A1A;--sage:#2D4A2D;--sage2:#3D6B3D;--red:#8B1A1A;--red2:#C02020;--border:#D4C4A8;--border2:#E8D8C0;--shadow:0 2px 16px rgba(26,10,0,.08);--shadow2:0 8px 40px rgba(26,10,0,.14);--r:12px;--r2:18px;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--ink);max-width:480px;margin:0 auto}
body{min-height:100vh}
.serif{font-family:'Cormorant Garamond',serif}
.t-xs{font-size:.6rem}.t-sm{font-size:.72rem}.t-base{font-size:.85rem}.t-lg{font-size:1rem}.t-xl{font-size:1.2rem}.t-2xl{font-size:1.5rem}.t-3xl{font-size:2rem}
.fw-5{font-weight:500}.fw-6{font-weight:600}.fw-7{font-weight:700}
.upper{text-transform:uppercase;letter-spacing:.1em}
.c-ink2{color:var(--ink2)}.c-ink3{color:var(--ink3)}.c-gold{color:var(--gold)}.c-sage{color:var(--sage)}.c-red{color:var(--red)}
.flex{display:flex}.col{flex-direction:column}.items-c{align-items:center}.just-b{justify-content:space-between}.just-c{justify-content:center}.gap-1{gap:4px}.gap-2{gap:8px}.gap-3{gap:12px}.flex-1{flex:1}.w-full{width:100%}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
/* LOGIN */
#login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px;background:linear-gradient(150deg,var(--ink) 0%,var(--ink2) 60%,var(--rust) 100%);position:relative;overflow:hidden}
.login-brand{text-align:center;margin-bottom:40px}
.login-brand .name{font-family:'Cormorant Garamond',serif;font-size:2.8rem;font-weight:600;color:white;letter-spacing:.04em;line-height:1}
.login-brand .sub{font-size:.62rem;color:rgba(255,255,255,.4);letter-spacing:.35em;text-transform:uppercase;margin-top:8px}
.login-card{background:white;border-radius:24px;padding:32px 24px;width:100%;max-width:340px;box-shadow:0 32px 80px rgba(0,0,0,.4)}
.login-card h2{font-size:.72rem;font-weight:600;color:var(--ink3);margin-bottom:24px;text-align:center;text-transform:uppercase;letter-spacing:.15em}
.login-err{color:var(--red2);font-size:.68rem;text-align:center;margin-top:10px;display:none}
/* TOPBAR */
#topbar{background:var(--ink);padding:10px 14px 0;position:sticky;top:0;z-index:100;box-shadow:0 2px 20px rgba(0,0,0,.3)}
.topbar-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.brand-top{font-family:'Cormorant Garamond',serif;color:white;font-size:1.05rem;font-weight:600;letter-spacing:.03em}
.brand-top span{display:block;font-family:'DM Sans',sans-serif;font-size:.55rem;color:rgba(255,255,255,.4);letter-spacing:.08em;font-weight:300;margin-top:1px}
.user-chip{background:rgba(255,255,255,.1);color:white;font-size:.6rem;font-weight:500;padding:4px 11px;border-radius:20px;border:1px solid rgba(255,255,255,.1)}
.exit-btn{background:none;border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.6);border-radius:7px;padding:4px 10px;font-size:.6rem;cursor:pointer;margin-left:6px;font-family:'DM Sans',sans-serif}
/* NAV */
.nav-tabs{display:flex;gap:1px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
.nav-tabs::-webkit-scrollbar{display:none}
.nav-tab{color:rgba(255,255,255,.4);font-size:.58rem;font-weight:500;letter-spacing:.07em;text-transform:uppercase;padding:8px 12px;border-radius:9px 9px 0 0;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all .2s}
.nav-tab.active{background:var(--cream);color:var(--ink);font-weight:700}
/* CONTENT */
#content{padding:14px;padding-bottom:80px}
/* SYNC */
.sync-bar{display:flex;align-items:center;gap:6px;font-size:.58rem;color:var(--ink3);margin-bottom:12px}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--sage)}.sync-dot.syncing{background:var(--gold);animation:pulse 1s infinite}.sync-dot.error{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
/* CARDS */
.card{background:white;border-radius:var(--r);padding:14px;margin-bottom:12px;border:1px solid var(--border2);box-shadow:var(--shadow)}
.card-title{font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--ink3);margin-bottom:12px;padding-bottom:9px;border-bottom:1px solid var(--border2)}
/* STATS */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat-card{background:white;border-radius:var(--r);padding:12px 14px;border-left:3px solid var(--ink3);box-shadow:var(--shadow)}
.stat-card.gold{border-left-color:var(--gold)}.stat-card.sage{border-left-color:var(--sage)}.stat-card.red{border-left-color:var(--red)}.stat-card.rust{border-left-color:var(--rust)}
.stat-lbl{font-size:.56rem;text-transform:uppercase;letter-spacing:.1em;color:var(--ink3);font-weight:600}
.stat-val{font-size:1.1rem;font-weight:700;color:var(--ink);margin-top:4px;font-family:'Cormorant Garamond',serif}
.stat-sub{font-size:.56rem;color:var(--ink3);margin-top:2px}
/* FORMS */
.fg{margin-bottom:12px}
.lbl{font-size:.6rem;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px;display:block}
.inp,.sel{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:10px 13px;font-size:.85rem;font-family:'DM Sans',sans-serif;color:var(--ink);background:white;outline:none;transition:border-color .2s}
.inp:focus,.sel:focus{border-color:var(--gold)}
/* BUTTONS */
.btn{border:none;border-radius:10px;padding:12px 18px;font-size:.78rem;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn:active{transform:scale(.97)}
.btn-ink{background:var(--ink);color:white}.btn-gold{background:var(--gold);color:white}.btn-sage{background:var(--sage);color:white}.btn-red{background:var(--red);color:white}.btn-ghost{background:var(--cream2);color:var(--ink2);border:1px solid var(--border)}
.btn-full{width:100%}.btn-sm{padding:7px 13px;font-size:.68rem;border-radius:8px}.btn-xs{padding:4px 9px;font-size:.6rem;border-radius:6px}
/* PILLS */
.pill-row{display:flex;gap:5px;flex-wrap:wrap}
.pill{border:1.5px solid var(--border);border-radius:20px;padding:5px 13px;font-size:.65rem;font-weight:600;cursor:pointer;color:var(--ink3);background:white;transition:all .15s;white-space:nowrap}
.pill.on{background:var(--ink);color:white;border-color:var(--ink)}
/* BADGES */
.bdg{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.56rem;font-weight:700}
.bdg-ink{background:var(--cream2);color:var(--ink2)}.bdg-gold{background:#FDF5E4;color:var(--gold)}.bdg-sage{background:#E8F0E8;color:var(--sage)}.bdg-red{background:#FDEAEA;color:var(--red)}
/* PRODUCTS */
.prod-card{background:white;border:1.5px solid var(--border2);border-radius:var(--r);padding:11px 12px;margin-bottom:8px;cursor:pointer;display:flex;align-items:center;gap:10px;transition:all .15s}
.prod-card:active{border-color:var(--gold);background:var(--cream)}
.prod-thumb{width:50px;height:50px;border-radius:9px;background:var(--cream2);display:flex;align-items:center;justify-content:center;font-size:1.5rem;flex-shrink:0;overflow:hidden;border:1px solid var(--border2)}
.prod-thumb img{width:100%;height:100%;object-fit:cover}
.prod-sku{font-size:.55rem;font-weight:700;font-family:monospace;background:var(--ink);color:white;padding:2px 6px;border-radius:4px;display:inline-block;margin-bottom:3px}
.prod-name{font-size:.78rem;font-weight:600;color:var(--ink)}
.prod-attrs{font-size:.58rem;color:var(--ink3);margin-top:2px}
.prod-cost{font-size:.58rem;background:var(--cream2);color:var(--ink3);padding:2px 7px;border-radius:4px;margin-top:3px;display:inline-block}
.prod-add{width:36px;height:36px;border-radius:9px;background:var(--sage);color:white;display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0;font-weight:700}
/* CART */
.cart-item{background:white;border:1px solid var(--border2);border-radius:var(--r);padding:11px 13px;margin-bottom:9px}
.cart-top{display:flex;align-items:center;gap:9px}
.cart-thumb{width:40px;height:40px;border-radius:8px;background:var(--cream2);display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0;overflow:hidden}
.cart-thumb img{width:100%;height:100%;object-fit:cover}
.cart-name{font-size:.73rem;font-weight:600;color:var(--ink)}.cart-var{font-size:.58rem;color:var(--ink3)}
.cart-rm{background:none;border:none;color:var(--red2);font-size:.9rem;cursor:pointer;padding:3px 6px;margin-left:auto;border-radius:6px}
.cart-bot{display:flex;gap:8px;align-items:center;margin-top:9px}
.qty-ctrl{display:flex;align-items:center;gap:5px;background:var(--cream2);border-radius:8px;padding:3px 8px;border:1px solid var(--border2)}
.qty-btn{background:none;border:none;font-size:.9rem;cursor:pointer;color:var(--ink);font-weight:700;width:22px;height:22px;display:flex;align-items:center;justify-content:center}
.qty-num{font-size:.8rem;font-weight:700;min-width:20px;text-align:center}
.price-inp{flex:1;border:1.5px solid var(--border);border-radius:8px;padding:7px 10px;font-size:.85rem;font-weight:700;color:var(--gold);font-family:'DM Sans',sans-serif;outline:none}
.price-inp:focus{border-color:var(--gold)}
.margin-pill{font-size:.58rem;font-weight:700;padding:3px 8px;border-radius:6px;white-space:nowrap}
.cost-row{display:flex;justify-content:space-between;align-items:center;background:var(--cream2);border-radius:7px;padding:5px 10px;margin-top:7px}
/* BILL SUM */
.bill-sum-box{background:white;border:1px solid var(--border2);border-radius:var(--r);padding:13px;margin-bottom:13px}
.bill-row{display:flex;justify-content:space-between;font-size:.72rem;color:var(--ink3);margin-bottom:5px}
.bill-row.total{font-size:.92rem;font-weight:700;color:var(--ink);border-top:1px solid var(--border2);padding-top:8px;margin-top:5px}
.bill-row.profit{color:var(--sage);font-weight:600}
/* RECONCILE */
.rec-card{background:white;border-radius:var(--r);padding:14px;border:1.5px solid var(--gold);margin-bottom:14px}
.rec-row{display:flex;justify-content:space-between;font-size:.75rem;color:var(--ink);margin-bottom:6px}
.rec-row.match{font-weight:700;color:var(--sage);border-top:1px dashed var(--border2);padding-top:7px;margin-top:5px}
/* INV TABLE */
.inv-hdr{display:grid;grid-template-columns:1.8fr .6fr .8fr .8fr;background:var(--ink);color:white;padding:7px 12px;border-radius:9px 9px 0 0}
.inv-hdr div{font-size:.56rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.inv-row{display:grid;grid-template-columns:1.8fr .6fr .8fr .8fr;padding:9px 12px;border-top:1px solid var(--cream2);background:white;cursor:pointer}
.inv-row:active{background:var(--cream)}
.inv-foot{display:grid;grid-template-columns:1.8fr .6fr .8fr .8fr;padding:8px 12px;background:var(--cream2);border-top:1px solid var(--border)}
/* LEDGER */
.party-card{background:white;border:1px solid var(--border2);border-radius:var(--r);padding:13px;margin-bottom:9px;cursor:pointer}
.party-card:active{background:var(--cream)}
.party-bal{font-size:.92rem;font-weight:700;font-family:'Cormorant Garamond',serif}
.stmt-row{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;padding:7px 11px;border-top:1px solid var(--cream2)}
.stmt-hdr{background:var(--ink);color:white;border-radius:9px 9px 0 0;border-top:none}
/* REPORT */
.rpt-hdr{background:var(--ink);color:white;padding:9px 13px;border-radius:10px 10px 0 0;display:flex;justify-content:space-between;align-items:center}
.rpt-hdr div{font-size:.63rem;font-weight:700}
.rpt-row{display:flex;justify-content:space-between;padding:8px 13px;border-bottom:1px solid var(--cream2);background:white;font-size:.72rem}
.rpt-row:last-child{border-bottom:none}
.rpt-foot{display:flex;justify-content:space-between;padding:9px 13px;background:var(--cream2);border-radius:0 0 10px 10px;font-size:.75rem;font-weight:700;color:var(--ink2)}
/* TOAST */
.toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:white;padding:10px 22px;border-radius:22px;font-size:.76rem;font-weight:500;opacity:0;transition:all .3s;z-index:1000;white-space:nowrap;max-width:92vw;pointer-events:none;box-shadow:var(--shadow2)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{background:var(--sage)}.toast.err{background:var(--red)}.toast.warn{background:var(--gold)}
/* MODAL */
.mo-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:none;align-items:flex-end}
.mo-overlay.show{display:flex}
.mo-box{background:white;border-radius:22px 22px 0 0;padding:22px;width:100%;max-height:88vh;overflow-y:auto}
.mo-title{font-family:'Cormorant Garamond',serif;font-size:1.15rem;color:var(--ink);margin-bottom:16px}
.mo-close{background:none;border:none;font-size:1.2rem;cursor:pointer;color:var(--ink3);padding:3px 7px}
/* SPINNER */
.spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-radius:50%;border-top-color:white;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* MISC */
.ob-card{background:white;border:2px solid var(--gold);border-radius:var(--r2);padding:16px;margin-bottom:16px}
.photo-up{border:2px dashed var(--border);border-radius:var(--r);padding:20px;text-align:center;background:var(--cream);cursor:pointer;position:relative}
.photo-up input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.sku-prev{background:var(--cream2);border:1.5px solid var(--gold);border-radius:var(--r);padding:12px 15px;margin-bottom:13px}
.sku-code{font-family:monospace;font-size:.95rem;font-weight:700;color:var(--gold);letter-spacing:.06em}
.payable-prev{background:#FDF5E4;border:1.5px solid var(--gold);border-radius:var(--r);padding:11px 13px;margin-bottom:13px}
.warn-box{background:#FFF8E4;border:1.5px solid var(--gold);border-radius:10px;padding:10px 13px;margin-bottom:12px;font-size:.7rem;color:var(--ink2)}
.info-box{background:var(--cream2);border:1px solid var(--border);border-radius:10px;padding:10px 13px;margin-bottom:12px;font-size:.68rem;color:var(--ink2)}
.empty{text-align:center;padding:32px 20px;color:var(--ink3)}
.empty-ico{font-size:2.6rem;margin-bottom:10px}
.age-fresh{color:#2D6B2D;background:#E8F5E8;border-radius:6px;padding:2px 7px;font-size:.56rem;font-weight:700}
.age-age{color:#7A6000;background:#FFF8D6;border-radius:6px;padding:2px 7px;font-size:.56rem;font-weight:700}
.age-slow{color:#8B4500;background:#FFF0D6;border-radius:6px;padding:2px 7px;font-size:.56rem;font-weight:700}
.age-dead{color:#8B1A1A;background:#FDEAEA;border-radius:6px;padding:2px 7px;font-size:.56rem;font-weight:700}
.date-flt{display:flex;gap:8px;margin-bottom:13px}
.date-flt .inp{font-size:.75rem;padding:8px 11px;flex:1}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-brand">
    <div class="name">SL Collection</div>
    <div class="sub">Point of Sale · Rawalpindi</div>
  </div>
  <div class="login-card">
    <h2>Sign In</h2>
    <div class="fg"><label class="lbl">Email</label><input class="inp" id="l-email" type="email" placeholder="owner@slcollection.com" autocomplete="off"></div>
    <div class="fg"><label class="lbl">Password</label><input class="inp" id="l-pw" type="password" placeholder="••••••••"></div>
    <button class="btn btn-ink btn-full" id="l-btn" onclick="doLogin()">Sign In</button>
    <div class="login-err" id="l-err">❌ Invalid credentials</div>
  </div>
</div>

<div id="app" style="display:none">
  <div id="topbar">
    <div class="topbar-row">
      <div class="brand-top">SL Collection <span>POS · Rawalpindi</span></div>
      <div class="flex items-c">
        <div class="user-chip" id="user-chip">👤 Staff</div>
        <button class="exit-btn" onclick="doLogout()">Exit</button>
      </div>
    </div>
    <div class="nav-tabs" id="nav-tabs"></div>
  </div>
  <div id="content"></div>
</div>

<div class="toast" id="toast"></div>
<div class="mo-overlay" id="mo-overlay">
  <div class="mo-box" id="mo-box">
    <div class="flex just-b items-c" style="margin-bottom:14px">
      <div class="mo-title" id="mo-title"></div>
      <button class="mo-close" onclick="closeMo()">✕</button>
    </div>
    <div id="mo-content"></div>
  </div>
</div>

<script>
const{createClient}=supabase;
const sb=createClient('https://fqubaesqzfmxvbtqconu.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZxdWJhZXNxemZteHZidHFjb251Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxODIwNTMsImV4cCI6MjA5NDc1ODA1M30.vqDRl0LGYOukQBRK7aegaXgCKxi-r65IwyNZKvGnUIk');

// STATE
let CU=null,CUP=null,cart=[],payMode='cash',purPayMode='cash',purSrc='cash',pPhoto=null,bPhoto=null,bCat='',lTab='customer',rTab='sales',products=[],accounts=[],parties=[],itimer=null,lastRepData=[],lastRepTitle='Report',lostBy='owner';

// UTILS
const $=id=>document.getElementById(id);
const fmt=n=>'₨'+Number(n||0).toLocaleString('en-PK');
const today=()=>new Date().toISOString().split('T')[0];
const CATS=['3PC','2PC','Shirt','Trouser','Dupatta','Abaya','Scarf'];
const CEMI={'3PC':'👗','2PC':'👘','Shirt':'👚','Trouser':'👖','Dupatta':'🧣','Abaya':'🖤','Scarf':'🧤'};
const CCOD={'3PC':'3PC','2PC':'2PC','Shirt':'SHT','Trouser':'TRS','Dupatta':'DPT','Abaya':'ABY','Scarf':'SCF'};
const CLCOD={black:'BLK',white:'WHT',blue:'BLU','navy blue':'NVY',navy:'NVY',red:'RED',green:'GRN',pink:'PNK',yellow:'YLW',orange:'ORG',purple:'PRP',grey:'GRY',gray:'GRY',brown:'BRN',maroon:'MRN',beige:'BGE',cream:'CRM',multi:'MLT',printed:'PRT',embroidered:'EMB'};

function toast(msg,type='',dur=3000){const t=$('toast');t.textContent=msg;t.className=`toast show ${type}`;setTimeout(()=>t.className='toast',dur);}
function openMo(title,html){$('mo-title').textContent=title;$('mo-content').innerHTML=html;$('mo-overlay').classList.add('show');}
function closeMo(){$('mo-overlay').classList.remove('show');}
function emo(c){return CEMI[c]||'📦';}
function colCode(c){if(!c)return'CLR';const l=c.toLowerCase().trim();if(CLCOD[l])return CLCOD[l];for(const[k,v]of Object.entries(CLCOD)){if(l.includes(k))return v;}return c.replace(/[^a-zA-Z]/g,'').toUpperCase().substring(0,3)||'CLR';}
function szCode(s){if(!s)return'STD';const m={SMALL:'S',MEDIUM:'M',LARGE:'L','EXTRA LARGE':'XL','FREE SIZE':'FRE'};return m[s.toUpperCase().trim()]||s.toUpperCase().substring(0,3);}
function ageBadge(d){if(d>=90)return'<span class="age-dead">🔴 Dead</span>';if(d>=60)return'<span class="age-slow">🟠 Slow</span>';if(d>=30)return'<span class="age-age">🟡 Ageing</span>';return'<span class="age-fresh">🟢 Fresh</span>';}
function setSyncStatus(s){document.querySelectorAll('.sync-dot').forEach(d=>{d.className='sync-dot'+(s==='syncing'?' syncing':s==='error'?' error':'');});document.querySelectorAll('.sync-txt').forEach(t=>{t.textContent=s==='syncing'?'Connecting..':s==='error'?'⚠️ Offline':'✅ Live';});}

// INACTIVITY
function resetTimer(){clearTimeout(itimer);if(CU)itimer=setTimeout(()=>{toast('Session expired','warn');setTimeout(doLogout,2000);},30*60*1000);}
['click','touchstart','keypress'].forEach(e=>document.addEventListener(e,resetTimer,true));

// AUTH
async function doLogin(){
  const email=$('l-email').value.trim(),pw=$('l-pw').value;
  if(!email||!pw){$('l-err').style.display='block';return;}
  const btn=$('l-btn');btn.innerHTML='<div class="spin"></div> Signing in...';btn.disabled=true;
  const{data,error}=await sb.auth.signInWithPassword({email,password:pw});
  if(error){$('l-err').style.display='block';$('l-err').textContent='❌ '+error.message;btn.innerHTML='Sign In';btn.disabled=false;return;}
  CU=data.user;await loadProfile();await initApp();
  btn.innerHTML='Sign In';btn.disabled=false;
}
$('l-pw').addEventListener('keypress',e=>{if(e.key==='Enter')doLogin();});

async function loadProfile(){const{data}=await sb.from('users').select('*').eq('auth_id',CU.id).single();CUP=data;}

async function doLogout(){await sb.auth.signOut();CU=null;CUP=null;cart=[];clearTimeout(itimer);$('app').style.display='none';$('login-screen').style.display='flex';$('l-email').value='';$('l-pw').value='';$('l-err').style.display='none';}

sb.auth.getSession().then(async({data:{session}})=>{if(session){CU=session.user;await loadProfile();await initApp();}});

async function initApp(){
  $('login-screen').style.display='none';$('app').style.display='block';
  $('user-chip').textContent=(CUP?.role==='owner'?'👑':'👤')+' '+(CUP?.full_name||'User');
  await loadMasterData();setupNav();setupRealtime();resetTimer();
  toast(`Welcome, ${CUP?.full_name||'User'}!`,'ok');
}

async function loadMasterData(){
  const[pv,ac,pa]= await Promise.all([
    sb.from('product_variants').select('*,products(name,category_id,categories(name,code))').eq('is_active',true),
    sb.from('cashflow_accounts').select('*').eq('is_active',true).order('sort_order'),
    sb.from('parties').select('*').eq('is_active',true).order('name')
  ]);
  products=(pv.data||[]).map(v=>({id:v.id,sku:v.sku,name:v.products?.name||'',category:v.products?.categories?.name||'',categoryCode:v.products?.categories?.code||'',colour:v.colour||'',size:v.size||'',no_of_designs:v.no_of_designs,no_of_colours:v.no_of_colours,purchase_price:Number(v.purchase_price)||0,photo_url:v.photo_url||'',product_id:v.product_id,stock:0,status:'fresh',age_days:0,last_purchase_date:null}));
  accounts=ac.data||[];parties=pa.data||[];
  const{data:inv}=await sb.from('inventory').select('variant_id,qty_available,stock_status,age_days,last_purchase_date');
  (inv||[]).forEach(i=>{const p=products.find(p=>p.id===i.variant_id);if(p){p.stock=Number(i.qty_available)||0;p.status=i.stock_status||'fresh';p.age_days=i.age_days||0;p.last_purchase_date=i.last_purchase_date;}});
}

function setupRealtime(){
  sb.channel('pos').on('postgres_changes',{event:'*',schema:'public',table:'inventory'},payload=>{const p=products.find(p=>p.id===payload.new?.variant_id);if(p){p.stock=Number(payload.new?.qty_available)||0;p.status=payload.new?.stock_status||'fresh';p.age_days=payload.new?.age_days||0;}setSyncStatus('ok');}).on('postgres_changes',{event:'*',schema:'public',table:'transactions'},()=>setSyncStatus('ok')).subscribe(s=>setSyncStatus(s==='SUBSCRIBED'?'ok':'syncing'));
}

// NAV
function setupNav(){
  const ot=[{id:'dash',l:'📊'},{id:'bill',l:'🧾 Bill'},{id:'inv',l:'📋 Stock'},{id:'buy',l:'📦 Buy'},{id:'led',l:'📒 Ledger'},{id:'rep',l:'📈 Reports'},{id:'cash',l:'💵 Cash'},{id:'assets',l:'🏪 Assets'}];

function showTab(id,el){

  const c=$('content');
  switch(id){
    case'dash':c.innerHTML=rDash();iDash();break;
    case'bill':c.innerHTML=rBill();iBill();break;

// ── DASHBOARD ──
function rDash(){return`<div class="sync-bar"><div class="sync-dot syncing"></div><span class="sync-txt">Connecting...</span></div><div class="ob-card" id="ob-card" style="display:none"><div class="card-title">⚠️ Opening Balance</div><div class="flex gap-2"><input class="inp flex-1" id="ob-inp" type="number" placeholder="₨ Cash in drawer"><button class="btn btn-gold btn-sm" onclick="setOB()">Set</button></div></div><div class="stat-grid" id="d-stats"></div><div class="rec-card" id="d-rec"></div><div class="t-xs upper fw-7 c-ink3" style="margin-bottom:8px">🕒 Today's Sales</div><div id="d-sales"></div>`;}

async function iDash(){
  const cashAcc=accounts.find(a=>a.name==='Cash Drawer');
  if(cashAcc){const{data:ob}=await sb.from('opening_balances').select('*').eq('balance_date',today()).eq('account_id',cashAcc.id).maybeSingle();if(!ob)$('ob-card').style.display='block';}
  const{data:s}=await sb.rpc('get_dashboard_summary',{p_date:today()});
  if(s)renderDashStats(s);
  const{data:sales}=await sb.from('sales').select('*,transactions(transaction_no)').eq('sale_date',today()).order('created_at',{ascending:false}).limit(15);
  renderDaySales(sales||[]);
}

function renderDashStats(s){
  const ds=$('d-stats');if(!ds)return;
  ds.innerHTML=`<div class="stat-card"><div class="stat-lbl">Today Sales</div><div class="stat-val">${fmt(s.today_sales)}</div><div class="stat-sub">${s.today_bills} bills</div></div><div class="stat-card sage"><div class="stat-lbl">Today Profit</div><div class="stat-val">${fmt(s.today_profit)}</div><div class="stat-sub">${s.today_sales>0?((s.today_profit/s.today_sales)*100).toFixed(1):0}%</div></div><div class="stat-card gold"><div class="stat-lbl">Cash Balance</div><div class="stat-val">${fmt(s.cash_balance)}</div></div><div class="stat-card red"><div class="stat-lbl">Expenses</div><div class="stat-val">${fmt(s.today_expenses)}</div></div><div class="stat-card"><div class="stat-lbl">Monthly Sales</div><div class="stat-val">${fmt(s.monthly_sales)}</div></div><div class="stat-card sage"><div class="stat-lbl">Monthly Profit</div><div class="stat-val">${fmt(s.monthly_profit)}</div></div><div class="stat-card rust"><div class="stat-lbl">Receivables</div><div class="stat-val">${fmt(s.total_receivables)}</div></div><div class="stat-card red"><div class="stat-lbl">Payables</div><div class="stat-val">${fmt(s.total_payables)}</div></div>`;
  const dr=$('d-rec');if(!dr)return;
  const ob=accounts.find(a=>a.name==='Cash Drawer')?.opening_balance||0;
  dr.innerHTML=`<div class="t-xs upper fw-7 c-gold" style="margin-bottom:9px">💵 Cash Reconciliation</div><div class="rec-row"><span>Opening Balance</span><span>${fmt(ob)}</span></div><div class="rec-row"><span>+ Sales</span><span>${fmt(s.today_sales)}</span></div><div class="rec-row"><span>- Expenses</span><span>- ${fmt(s.today_expenses)}</span></div><div class="rec-row match"><span>✅ Expected</span><span>${fmt(ob+Number(s.today_sales)-Number(s.today_expenses))}</span></div>${s.low_stock_count>0?`<div style="margin-top:8px;padding-top:8px;border-top:1px dashed var(--border2);font-size:.68rem;color:var(--red)">⚠️ ${s.low_stock_count} low · ${s.dead_stock_count} dead stock</div>`:''}`;
}

function renderDaySales(sales){
  const c=$('d-sales');if(!c)return;
  if(!sales.length){c.innerHTML='<div class="empty"><div class="empty-ico">🧾</div><p class="t-sm">No sales today</p></div>';return;}
  c.innerHTML=sales.map(s=>`<div class="card" style="padding:11px 13px;margin-bottom:9px"><div class="flex just-b items-c"><div><div class="t-sm fw-6">${s.transactions?.transaction_no||''}</div><div class="t-xs c-ink3">${s.customer_name} · ${s.payment_mode}</div></div><div style="text-align:right"><div class="t-sm fw-7">${fmt(s.total_amount)}</div><div class="t-xs c-sage fw-6">+${fmt(s.gross_profit)}</div></div></div></div>`).join('');
}

async function setOB(){
  const amt=Number($('ob-inp')?.value||0);
  const cashAcc=accounts.find(a=>a.name==='Cash Drawer');if(!cashAcc)return;
  await sb.from('opening_balances').upsert({balance_date:today(),account_id:cashAcc.id,amount:amt,set_by:CUP?.id},{onConflict:'balance_date,account_id'});
  await sb.from('cashflow_accounts').update({opening_balance:amt,current_balance:amt}).eq('id',cashAcc.id);
  accounts=accounts.map(a=>a.id===cashAcc.id?{...a,opening_balance:amt,current_balance:amt}:a);
  $('ob-card').style.display='none';toast(`✅ Opening balance: ${fmt(amt)}`,'ok');iDash();
}

// ── BILLING ──
function rBill(){return`<div class="card"><div class="card-title">🧾 New Sale</div><div class="fg"><label class="lbl">Customer <span id="cust-req" style="color:var(--red);display:none">* Required</span></label><div class="flex gap-2"><input class="inp flex-1" id="b-cust" placeholder="Walk-in Customer" oninput="onCustInput()"><button class="btn btn-ghost btn-sm" onclick="pickParty('customer')">📋</button><button class="btn btn-ghost btn-sm" onclick="newPartyModal('customer')">➕</button></div><div id="cust-bal" style="display:none;font-size:.6rem;margin-top:4px"></div></div><div class="fg"><label class="lbl">Payment</label><div class="pill-row" id="pay-pills"><div class="pill on" onclick="setPayMode('cash',this)">💵 Cash</div><div class="pill" onclick="setPayMode('bank',this)">🏦 Bank</div><div class="pill" onclick="setPayMode('emoney',this)">📱 E-Money</div><div class="pill" onclick="setPayMode('credit',this)">📋 Credit</div><div class="pill" onclick="setPayMode('split',this)">⚡ Split</div></div></div><div id="pay-det"></div><div id="acc-bal-info"></div><div class="fg" style="margin-bottom:0"><label class="lbl"><input type="checkbox" id="is-acq" style="accent-color:var(--gold);margin-right:5px">Acquaintance sale</label></div></div><div class="t-xs upper fw-7 c-ink3" style="margin-bottom:8px">🔍 Add Products</div><input class="inp" id="b-srch" placeholder="SKU, name, colour, size..." oninput="srchProds()" style="margin-bottom:8px"><div class="pill-row" id="cat-pills" style="margin-bottom:10px"><div class="pill on" onclick="setBCat('',this)">All</div>${CATS.map(c=>`<div class="pill" onclick="setBCat('${c}',this)">${c}</div>`).join('')}</div><div id="b-warn" class="warn-box" style="display:none"></div><div id="b-results"></div><div class="flex just-b items-c" style="margin-top:6px;margin-bottom:8px"><div class="t-xs upper fw-7 c-ink3">🛒 Cart <span class="bdg bdg-ink" id="cart-badge">0</span></div></div><div id="cart-items"></div><div id="bill-sum" style="display:none"></div><div id="bill-acts" style="display:none"></div>`;}
function iBill(){srchProds();renderCart();}

function setPayMode(m,el){
  payMode=m;document.querySelectorAll('#pay-pills .pill').forEach(p=>p.classList.remove('on'));el.classList.add('on');
  const cr=$('cust-req');if(cr)cr.style.display=(m==='credit'||m==='split')?'inline':'none';
  const d=$('pay-det');if(!d)return;
  const cashAcc=accounts.find(a=>a.name==='Cash Drawer');
  if(m==='cash'){const i=$('acc-bal-info');if(i)i.innerHTML=`<div class="info-box">💵 Cash Drawer: <strong style="color:${(cashAcc?.current_balance||0)>0?'var(--sage)':'var(--red)'}">${fmt(cashAcc?.current_balance||0)}</strong></div>`;d.innerHTML='';}
  else if(m==='bank'){d.innerHTML=`<div class="fg"><label class="lbl">Bank Account</label><select class="sel" id="b-bank" onchange="showAccBal('bank',this.value)"><option value="">Select...</option>${accounts.filter(a=>a.account_type==='bank').map(b=>`<option value="${b.id}">${b.name} — ${fmt(b.current_balance)}</option>`).join('')}</select></div><div id="bank-bal"></div>`;}
  else if(m==='emoney'){d.innerHTML=`<div class="fg"><label class="lbl">E-Money</label><select class="sel" id="b-emoney" onchange="showAccBal('emoney',this.value)"><option value="">Select...</option>${accounts.filter(a=>a.account_type==='emoney').map(e=>`<option value="${e.id}">${e.name} — ${fmt(e.current_balance)}</option>`).join('')}</select></div><div id="emoney-bal"></div>`;}
  else if(m==='credit'){d.innerHTML=`<div class="info-box" style="border-color:var(--rust);color:var(--rust)">📋 Posted to Customer Receivable. Customer name required.</div>`;}
  else if(m==='split'){d.innerHTML=`<div class="g2"><div class="fg"><label class="lbl">Cash ₨</label><input class="inp" id="split-cash" type="number" placeholder="0" oninput="updSplit()"></div><div class="fg"><label class="lbl">Balance via</label><select class="sel" id="split-src"><option value="credit">📋 Credit</option><option value="bank">🏦 Bank</option><option value="emoney">📱 EMoney</option></select></div></div><div id="split-prev"></div>`;}
  if(m!=='cash'){const i=$('acc-bal-info');if(i)i.innerHTML='';}
}

function showAccBal(type,id){const acc=accounts.find(a=>a.id===id);if(!acc)return;const el=$(type==='bank'?'bank-bal':'emoney-bal');if(el)el.innerHTML=`<div class="info-box" style="color:${acc.current_balance>0?'var(--sage)':'var(--red)'}">Balance: <strong>${fmt(acc.current_balance)}</strong>${acc.current_balance<=0?' ⚠️ Insufficient!':''}</div>`;}
function updSplit(){const cash=Number($('split-cash')?.value||0);const tot=cart.reduce((s,c)=>s+c.price*c.qty,0);const p=$('split-prev');if(p&&tot>0)p.innerHTML=`<div class="info-box">💵 Cash: ${fmt(cash)} + Credit: ${fmt(Math.max(0,tot-cash))}</div>`;}
function onCustInput(){const nm=($('b-cust')?.value||'').trim();const balEl=$('cust-bal');if(!balEl)return;const p=parties.find(p=>p.name===nm&&p.party_type==='customer');if(p&&p.current_balance!==0){balEl.style.display='block';balEl.innerHTML=`<span style="color:${p.current_balance>0?'var(--rust)':'var(--sage)'}">Outstanding: ${fmt(Math.abs(p.current_balance))} ${p.current_balance>0?'(owes you)':'(credit)'}</span>`;}else balEl.style.display='none';}
function setBCat(c,el){bCat=c;document.querySelectorAll('#cat-pills .pill').forEach(p=>p.classList.remove('on'));el.classList.add('on');srchProds();}

function srchProds(){
  const q=($('b-srch')?.value||'').toLowerCase().trim();
  const res=$('b-results');if(!res)return;
  const filtered=products.filter(p=>{
    const mc=!bCat||p.category===bCat;
    const mq=!q||(p.sku||'').toLowerCase().includes(q)||(p.name||'').toLowerCase().includes(q)||(p.colour||'').toLowerCase().includes(q)||(p.size||'').toLowerCase().includes(q);
    return mc&&mq&&(p.stock||0)>0;
  });
  if(!filtered.length){res.innerHTML='<div class="empty"><div class="empty-ico">🔍</div><p class="t-sm">No items in stock</p></div>';return;}
  res.innerHTML=filtered.map(p=>`<div class="prod-card" onclick="addToCart('${p.id}')"><div class="prod-thumb">${p.photo_url?`<img src="${p.photo_url}">`:(emo(p.category))}</div><div style="flex:1;min-width:0"><div class="prod-sku">${p.sku}</div><div class="prod-name">${p.name}</div><div class="prod-attrs">${p.category}${p.colour?' · '+p.colour:''}${p.size?' · '+p.size:''} · Stock: <strong style="color:${(p.stock||0)<=2?'var(--red)':'var(--sage)'}">${p.stock||0}</strong></div><div class="prod-cost">Cost: ${fmt(p.purchase_price)} 🔒 ${ageBadge(p.age_days||0)}</div></div><div class="prod-add">+</div></div>`).join('');
}

function addToCart(id){
  const p=products.find(p=>p.id===id);if(!p)return;
  const inCart=cart.filter(c=>c.id===id).reduce((s,c)=>s+c.qty,0);
  if(inCart>=(p.stock||0)){toast(`Only ${p.stock||0} in stock!`,'err');return;}
  const ex=cart.find(c=>c.id===id);
  if(ex)ex.qty++;else cart.push({id,sku:p.sku,name:p.name,category:p.category,colour:p.colour,size:p.size,cost:p.purchase_price,price:0,qty:1,photo:p.photo_url||''});
  renderCart();toast(`✅ ${p.name}`,'ok');
}
function remCart(id){cart=cart.filter(c=>c.id!==id);renderCart();}
function updQty(id,d){const it=cart.find(c=>c.id===id);if(!it)return;const p=products.find(p=>p.id===id);const nq=it.qty+d;if(nq<=0){remCart(id);return;}if(p&&nq>(p.stock||0)){toast('Not enough stock!','err');return;}it.qty=nq;renderCart();}
function updPrice(id,v){const it=cart.find(c=>c.id===id);if(it){it.price=Number(v)||0;}updBillSum();}

function renderCart(){
  const badge=$('cart-badge');if(badge)badge.textContent=cart.length;
  const items=$('cart-items');if(!items)return;
  if(!cart.length){items.innerHTML='<div class="empty"><div class="empty-ico">🛒</div><p class="t-sm">Search and tap a product</p></div>';const s=$('bill-sum');if(s)s.style.display='none';const a=$('bill-acts');if(a)a.style.display='none';return;}
  items.innerHTML=cart.map(it=>{
    const mg=it.price>0?(it.price-it.cost)*it.qty:null;
    const mgp=it.price>0&&it.cost>0?Math.round(((it.price-it.cost)/it.cost)*100):null;
    const mc=mg===null?'var(--cream2)':mg>=0?'#E8F5E8':'#FDEAEA';
    const mtc=mg===null?'var(--ink3)':mg>=0?'var(--sage)':'var(--red)';
    return`<div class="cart-item"><div class="cart-top"><div class="cart-thumb">${it.photo?`<img src="${it.photo}">`:(emo(it.category))}</div><div style="flex:1"><div class="cart-name">${it.name}</div><div class="cart-var">${it.category}${it.colour?' · '+it.colour:''}${it.size?' · '+it.size:''}</div></div><button class="cart-rm" onclick="remCart('${it.id}')">✕</button></div><div class="cart-bot"><div class="qty-ctrl"><button class="qty-btn" onclick="updQty('${it.id}',-1)">−</button><span class="qty-num">${it.qty}</span><button class="qty-btn" onclick="updQty('${it.id}',1)">+</button></div><input class="price-inp" type="number" placeholder="Sale ₨" value="${it.price||''}" oninput="updPrice('${it.id}',this.value)"><div class="margin-pill" style="background:${mc};color:${mtc}">${mg===null?'—':fmt(mg)}</div></div><div class="cost-row"><span class="t-xs c-ink3">🔒 Cost: <strong>${fmt(it.cost)}</strong></span>${mgp!==null?`<span class="t-xs fw-7" style="color:${mgp>=0?'var(--sage)':'var(--red)'}">${mgp>=0?'▲':'▼'} ${Math.abs(mgp)}%</span>`:''}<span class="t-xs c-ink3">Internal</span></div></div>`;
  }).join('');
  updBillSum();
}

function updBillSum(){
  const tot=cart.reduce((s,c)=>s+c.price*c.qty,0);
  const cst=cart.reduce((s,c)=>s+c.cost*c.qty,0);
  const mg=tot-cst;
  const bs=$('bill-sum');const ba=$('bill-acts');
  if(!bs||!ba)return;
  if(!cart.length){bs.style.display='none';ba.style.display='none';return;}
  bs.style.display='block';
  bs.innerHTML=`<div class="bill-sum-box"><div class="bill-row"><span>Subtotal</span><span>${fmt(tot)}</span></div><div class="bill-row total"><span>Total</span><span>${fmt(tot)}</span></div><div class="bill-row profit"><span>💰 Margin</span><span>${fmt(mg)}</span></div></div>`;
  ba.style.display='block';
  ba.innerHTML=`<button class="btn btn-sage btn-full" id="comp-btn" onclick="completeSale()" style="margin-bottom:8px">✅ Complete Sale</button><div class="g2"><button class="btn btn-ghost btn-full" onclick="openReturnModal()">🔄 Return</button><button class="btn btn-ghost btn-full" onclick="openExpModal()">💸 Expense</button></div>`;
}

async function completeSale(){
  if(!cart.length){toast('Cart empty','err');return;}
  const mp=cart.find(c=>!c.price||c.price<=0);if(mp){toast(`Enter price: ${mp.name}`,'err');return;}
  for(const it of cart){if(it.price<it.cost){if(!confirm(`⚠️ ${it.name} ₨${it.price} below cost ₨${it.cost}. Loss! Continue?`))return;}}
  const cust=($('b-cust')?.value||'').trim()||'Walk-in Customer';
  if((payMode==='credit'||payMode==='split')&&cust==='Walk-in Customer'){toast('Enter customer name','err');$('b-cust')?.focus();return;}
  const btn=$('comp-btn');if(btn){btn.innerHTML='<div class="spin"></div>';btn.disabled=true;}
  const tot=cart.reduce((s,c)=>s+c.price*c.qty,0);
  const cst=cart.reduce((s,c)=>s+c.cost*c.qty,0);
  const mg=tot-cst;
  const isAcq=$('is-acq')?.checked||false;
  const bankId=$('b-bank')?.value||null;
  const emoneyId=$('b-emoney')?.value||null;
  const splitCash=Number($('split-cash')?.value||0);
  const cashAcc=accounts.find(a=>a.name==='Cash Drawer');
  // ── PAYMENT VALIDATION ──
  if(payMode==='bank'){
    if(!bankId){toast('Select a bank account','err');if(btn){btn.innerHTML='✅ Complete Sale';btn.disabled=false;}return;}
    const acc=accounts.find(a=>a.id===bankId);
    if(!acc){toast('Bank account not found','err');if(btn){btn.innerHTML='✅ Complete Sale';btn.disabled=false;}return;}
  }
  if(payMode==='emoney'){
    if(!emoneyId){toast('Select an e-money account','err');if(btn){btn.innerHTML='✅ Complete Sale';btn.disabled=false;}return;}
  }
  if(payMode==='split'&&splitCash>tot){toast(`Split cash ₨${splitCash} cannot exceed total ₨${tot}`,'err');if(btn){btn.innerHTML='✅ Complete Sale';btn.disabled=false;}return;}
  if(payMode==='credit'||payMode==='split'){
    let p=parties.find(p=>p.name===cust&&p.party_type==='customer');
    if(!p){const{data:np}=await sb.from('parties').insert({party_type:'customer',name:cust,created_by:CUP?.id}).select().single();if(np){parties.push(np);p=np;}}
    custPartyId=p?.id||null;
  }
  try{
    const{data:billNo}=await sb.rpc('generate_transaction_no',{p_prefix:'BILL'});

function renderInvList(){
  const fcat=$('if-cat')?.value||'',fst=$('if-st')?.value||'',fcol=$('if-col')?.value||'',fsrch=($('if-srch')?.value||'').toLowerCase();
  const c=$('inv-list');if(!c)return;
  let prods=products.filter(p=>{if((p.stock||0)<=0)return false;if(fcat&&p.category!==fcat)return false;if(fst&&p.status!==fst)return false;if(fcol&&p.colour!==fcol)return false;if(fsrch&&!p.name.toLowerCase().includes(fsrch)&&!p.sku.toLowerCase().includes(fsrch))return false;return true;});
  if(!prods.length){c.innerHTML='<div class="empty"><div class="empty-ico">📦</div><p class="t-sm">No items match</p></div>';return;}
  const cats={};prods.forEach(p=>{if(!cats[p.category])cats[p.category]={items:[],qty:0,val:0};cats[p.category].items.push(p);cats[p.category].qty+=p.stock||0;cats[p.category].val+=(p.stock||0)*p.purchase_price;});
  const tv=prods.reduce((s,p)=>s+(p.stock||0)*p.purchase_price,0);
  c.innerHTML=Object.entries(cats).map(([cat,d])=>`<div style="margin-bottom:14px"><div class="rpt-hdr"><div>${emo(cat)} ${cat}</div><div>Qty: ${d.qty} · ${fmt(d.val)}</div></div><div style="border:1px solid var(--border2);border-top:none;border-radius:0 0 10px 10px"><div class="inv-hdr"><div>Item</div><div style="text-align:center">Qty</div><div style="text-align:right">Age</div><div style="text-align:right">Value</div></div>${d.items.map(p=>`<div class="inv-row" onclick="showMovModal('${p.id}')"><div><div class="t-sm fw-6">${p.name}</div><div class="t-xs c-ink3">${p.colour||''}${p.size?' · '+p.size:''}</div><div style="font-family:monospace;font-size:.52rem;color:var(--ink3)">${p.sku}</div></div><div style="text-align:center"><span class="t-base fw-7" style="color:${(p.stock||0)<=2?'var(--red)':'var(--sage)'}">${p.stock||0}</span>${(p.stock||0)<=2?'<div class="t-xs" style="color:var(--red)">LOW</div>':''}</div><div style="text-align:right">${ageBadge(p.age_days||0)}<div class="t-xs c-ink3">${p.last_purchase_date||''}</div></div><div style="text-align:right" class="t-sm fw-6">${fmt((p.stock||0)*p.purchase_price)}</div></div>`).join('')}<div class="inv-foot"><div class="t-xs fw-7 c-ink2">Total</div><div style="text-align:center" class="t-sm fw-7 c-ink2">${d.qty}</div><div></div><div style="text-align:right" class="t-sm fw-7 c-ink2">${fmt(d.val)}</div></div></div></div>`).join('')+`<div style="background:var(--ink);color:white;border-radius:10px;padding:12px 15px;display:grid;grid-template-columns:1.8fr .6fr .8fr .8fr"><div class="t-sm fw-7">GRAND TOTAL</div><div style="text-align:center" class="t-sm fw-7">${prods.reduce((s,p)=>s+(p.stock||0),0)}</div><div></div><div style="text-align:right" class="t-sm fw-7">${fmt(tv)}</div></div>`;
}

function openStockTake(){
  const ps=products.filter(p=>(p.stock||0)>0);
  openMo('🔍 Physical Verification',`<div class="info-box">Enter physical count per item.</div>${ps.map((p,i)=>`<div style="display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--cream2)"><div><div class="t-sm fw-6">${p.name}</div><div class="t-xs c-ink3">${p.sku} · Book: <strong style="color:var(--gold)">${p.stock||0}</strong></div></div><input type="number" id="st-${i}" placeholder="Physical" style="width:70px;border:1.5px solid var(--border);border-radius:8px;padding:6px 8px;font-size:.8rem;text-align:center" oninput="updStDiff(${i})"><div id="std-${i}" style="font-size:.72rem;font-weight:700;min-width:34px;text-align:right"></div></div>`).join('')}<button class="btn btn-ink btn-full" style="margin-top:14px" onclick="saveStockTake()">✅ Save</button>`);
}
function updStDiff(i){const inp=$(`st-${i}`);const d=$(`std-${i}`);if(!inp||!d)return;const ps=products.filter(p=>(p.stock||0)>0);const ph=Number(inp.value);const bk=ps[i]?.stock||0;const df=ph-bk;if(inp.value===''){d.textContent='';return;}d.textContent=df===0?'✅':(df>0?`+${df}`:String(df));d.style.color=df===0?'var(--sage)':'var(--red)';}
async function saveStockTake(){
  const ps=products.filter(p=>(p.stock||0)>0);let adj=0;
  for(let i=0;i<ps.length;i++){const inp=$(`st-${i}`);if(!inp||inp.value==='')continue;const ph=Number(inp.value);const p=ps[i];if(ph===(p.stock||0))continue;await sb.from('inventory').update({qty_available:ph,updated_at:new Date().toISOString()}).eq('variant_id',p.id);await sb.from('inventory_movements').insert({variant_id:p.id,movement_type:'stock_take',qty_change:ph-(p.stock||0),qty_before:p.stock||0,qty_after:ph,reason:`Physical:${ph} Book:${p.stock||0}`,performed_by:CUP?.id});adj++;}
  closeMo();await loadMasterData();renderInvList();toast(`✅ ${adj} adjusted`,'ok');
}

function rBuy(){return`<div style="display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;margin-bottom:14px"><div class="pill on" onclick="showBuyTab('new',this)">➕ New</div><div class="pill" onclick="showBuyTab('ret',this)">🔄 Return</div><div class="pill" onclick="showBuyTab('dmg',this)">💥 Damaged</div><div class="pill" onclick="showBuyTab('lst',this)">❌ Lost</div><div class="pill" onclick="showBuyTab('agd',this)">🏷️ Aged</div></div><div id="buy-tab">${rNewPur()}</div>`;}
function showBuyTab(t,el){document.querySelectorAll('.pill').forEach(p=>p.classList.remove('on'));el.classList.add('on');const c=$('buy-tab');if(!c)return;switch(t){case'new':c.innerHTML=rNewPur();break;case'ret':c.innerHTML=rPurRet();break;case'dmg':c.innerHTML=rDmg();break;case'lst':c.innerHTML=rLst();break;case'agd':c.innerHTML=rAgd();break;}}

function rNewPur(){return`<div class="card"><div class="card-title">📦 New Purchase</div><div class="fg"><label class="lbl">📸 Product Photo</label><div class="photo-up" onclick="document.getElementById('p-photo').click()"><input type="file" id="p-photo" accept="image/*" onchange="hPhoto(this,'prod')" style="display:none"><div style="font-size:2rem" id="ppi">📸</div><div class="t-xs c-ink3">Tap to upload</div><div id="ppn" class="t-xs" style="color:var(--sage);margin-top:4px"></div></div></div><div class="fg"><label class="lbl">Product Name *</label><input class="inp" id="p-nm" placeholder="e.g. Embroidered Lawn 3PC"></div><div class="g2"><div class="fg"><label class="lbl">Category *</label><select class="sel" id="p-cat" onchange="updSKUPrev()"><option value="">Select...</option>${CATS.map(c=>`<option>${c}</option>`).join('')}</select></div><div class="fg"><label class="lbl">Size</label><input class="inp" id="p-sz" placeholder="S/M/L/XL" oninput="updSKUPrev()"></div></div><div class="g2"><div class="fg"><label class="lbl">No. Designs</label><input class="inp" id="p-ds" type="number" placeholder="5"></div><div class="fg"><label class="lbl">No. Colours</label><input class="inp" id="p-nc" type="number" placeholder="3"></div></div><div class="fg"><label class="lbl">Colour</label><input class="inp" id="p-cl" placeholder="Navy Blue, Red..." oninput="updSKUPrev()"></div><div class="sku-prev"><div class="t-xs c-ink3 upper" style="margin-bottom:4px">🏷️ SKU Preview</div><div class="sku-code" id="sku-prev">Select category...</div></div><div class="g2"><div class="fg"><label class="lbl">Quantity *</label><input class="inp" id="p-qt" type="number" placeholder="0" oninput="updPayPrev()"></div><div class="fg"><label class="lbl">Cost ₨ *</label><input class="inp" id="p-cs" type="number" placeholder="0" oninput="updPayPrev()"></div></div><div class="fg"><label class="lbl">Supplier</label><div class="flex gap-2"><input class="inp flex-1" id="pur-sup" placeholder="Supplier name"><button class="btn btn-ghost btn-sm" onclick="pickParty('supplier')">📋</button><button class="btn btn-ghost btn-sm" onclick="newPartyModal('supplier')">➕</button></div></div><div class="info-box">💡 Sale price negotiated at billing — not entered here.</div><div class="fg"><label class="lbl">Payment</label><div class="pill-row" id="pp-pills"><div class="pill on" onclick="setPurPay('cash',this)">💵 Cash</div><div class="pill" onclick="setPurPay('credit',this)">📋 Credit</div><div class="pill" onclick="setPurPay('partial',this)">⚡ Partial</div><div class="pill" onclick="setPurPay('owner',this)">👑 Owner</div><div class="pill" onclick="setPurPay('loan',this)">🤝 Loan</div></div></div><div id="pp-det"></div><div id="pp-prev" class="payable-prev" style="display:none"></div><div class="fg"><label class="lbl">📎 Bill Photo</label><div class="photo-up" onclick="document.getElementById('p-bill').click()"><input type="file" id="p-bill" accept="image/*" onchange="hPhoto(this,'bill')" style="display:none"><div style="font-size:1.5rem">🧾</div><div class="t-xs c-ink3">Attach bill</div><div id="pbn" class="t-xs" style="color:var(--sage);margin-top:4px"></div></div></div><button class="btn btn-gold btn-full" onclick="savePurchase()">✅ Save Purchase</button></div>`;}

function updSKUPrev(){const cat=$('p-cat')?.value||'';const cl=$('p-cl')?.value||'';const sz=$('p-sz')?.value||'';const p=$('sku-prev');if(!p)return;if(!cat){p.textContent='Select category...';return;}p.textContent=`${CCOD[cat]||cat.substring(0,3).toUpperCase()}-${colCode(cl)}-${szCode(sz)}-###`;}
function setPurPay(m,el){purPayMode=m;document.querySelectorAll('#pp-pills .pill').forEach(p=>p.classList.remove('on'));el.classList.add('on');const d=$('pp-det');if(!d)return;const cashAcc=accounts.find(a=>a.name==='Cash Drawer');if(m==='cash'){d.innerHTML=`<div class="info-box">💵 Cash Drawer: <strong>${fmt(cashAcc?.current_balance||0)}</strong></div>`;}else if(m==='credit'){d.innerHTML=`<div class="info-box" style="border-color:var(--rust);color:var(--rust)">📋 Posted to Supplier Payable.</div>`;}else if(m==='partial'){d.innerHTML=`<div class="fg"><label class="lbl">Amount Paid ₨</label><input class="inp" id="pp-pd" type="number" placeholder="0" oninput="updPayPrev()"></div><div class="fg"><label class="lbl">Source</label><select class="sel" id="pp-src">${accounts.map(a=>`<option value="${a.id}">${a.name}</option>`).join('')}</select></div>`;}else if(m==='owner'){d.innerHTML=`<div class="info-box">👑 Posted to Owner Payable.</div>`;}else if(m==='loan'){d.innerHTML=`<div class="fg"><label class="lbl">Shopkeeper</label><input class="inp" id="pp-loan" placeholder="Party name"></div>`;}updPayPrev();}
function updPayPrev(){const qty=Number($('p-qt')?.value||0);const cst=Number($('p-cs')?.value||0);const tot=qty*cst;const pd=purPayMode==='partial'?Number($('pp-pd')?.value||0):purPayMode==='cash'?tot:0;const pay=Math.max(0,tot-pd);const p=$('pp-prev');if(!p)return;if(tot>0){p.style.display='block';p.innerHTML=`<div class="flex just-b"><span class="t-sm">Total</span><span class="t-sm fw-7">${fmt(tot)}</span></div><div class="flex just-b" style="color:var(--sage)"><span class="t-sm">Paid</span><span class="t-sm fw-6">- ${fmt(pd)}</span></div><div class="flex just-b fw-7" style="border-top:1px dashed var(--border2);margin-top:5px;padding-top:5px;color:var(--red)"><span class="t-sm">Payable</span><span class="t-sm">${fmt(pay)}</span></div>`;}else p.style.display='none';}

function hPhoto(inp,type){const file=inp.files[0];if(!file)return;const r=new FileReader();r.onload=e=>{const img=new Image();img.onload=()=>{const cv=document.createElement('canvas');const MAX=type==='prod'?300:400;let w=img.width,h=img.height;if(w>MAX){h=Math.round(h*MAX/w);w=MAX;}cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);const b64=cv.toDataURL('image/jpeg',.7);if(type==='prod'){pPhoto=b64;if($('ppi'))$('ppi').textContent='✅';if($('ppn'))$('ppn').textContent=file.name;}else{bPhoto=b64;if($('pbn'))$('pbn').textContent='✅ '+file.name;}};img.src=e.target.result;};r.readAsDataURL(file);}

async function savePurchase(){
  const nm=$('p-nm')?.value?.trim();const cat=$('p-cat')?.value;const qty=Number($('p-qt')?.value||0);const cst=Number($('p-cs')?.value||0);const sup=$('pur-sup')?.value?.trim()||'Unknown';const sz=$('p-sz')?.value?.trim()||'';const cl=$('p-cl')?.value?.trim()||'';
  if(!nm||!cat||!qty||!cst){toast('Fill: Name, Category, Qty, Cost','err');return;}
  const tot=qty*cst;
  const catCode=CCOD[cat]||cat.substring(0,3).toUpperCase();const clCode=colCode(cl);const sCode=szCode(sz);const prefix=`${catCode}-${clCode}-${sCode}`;
  const{data:purNo}=await sb.rpc('generate_transaction_no',{p_prefix:'PUR'});
  let supParty=parties.find(p=>p.name===sup&&p.party_type==='supplier');
  if(!supParty){const{data:sp}=await sb.from('parties').insert({party_type:'supplier',name:sup,created_by:CUP?.id}).select().single();if(sp){parties.push(sp);supParty=sp;}}
  const{data:catRow}=await sb.from('categories').select('id').eq('name',cat).single();
  const cashAcc=accounts.find(a=>a.name==='Cash Drawer');
  let pd=0,pybl=0,payAccId=null;
  if(purPayMode==='cash'){
    pd=tot;payAccId=cashAcc?.id;
    const cashBal=cashAcc?.current_balance||0;
    if(cashBal<tot){
      const proceed=confirm(`⚠️ Insufficient Cash!\n\nCash Drawer: ${fmt(cashBal)}\nRequired: ${fmt(tot)}\nShortfall: ${fmt(tot-cashBal)}\n\nSwitch to Credit or Partial payment instead.\n\nForce proceed anyway?`);
      if(!proceed){toast('Purchase cancelled — insufficient cash','warn');return;}
    }
  }
  else if(purPayMode==='credit'){pybl=tot;}
  else if(purPayMode==='partial'){
    pd=Number($('pp-pd')?.value||0);pybl=Math.max(0,tot-pd);payAccId=$('pp-src')?.value;
    const srcAcc=accounts.find(a=>a.id===payAccId);
    const srcBal=srcAcc?.current_balance||0;
    if(pd>0&&srcBal<pd){
      const proceed=confirm(`⚠️ Insufficient Balance!\n\n${srcAcc?.name||'Account'}: ${fmt(srcBal)}\nRequired: ${fmt(pd)}\n\nForce proceed anyway?`);
      if(!proceed){toast('Purchase cancelled — insufficient balance','warn');return;}
    }
  }
  else if(purPayMode==='owner'){pybl=tot;}
  else if(purPayMode==='loan'){pybl=tot;}
  try{
    let photoUrl=null;
    if(pPhoto){try{const blob=await(await fetch(pPhoto)).blob();const fname=`${Date.now()}-${prefix}.jpg`;const{data:up}=await sb.storage.from('product-photos').upload(fname,blob,{contentType:'image/jpeg'});if(up){const{data:url}=sb.storage.from('product-photos').getPublicUrl(fname);photoUrl=url.publicUrl;}}catch(e){console.warn('Photo upload failed:',e.message);}}
    let billPhotoUrl=null;
    if(bPhoto){try{const blob=await(await fetch(bPhoto)).blob();const fname=`${Date.now()}-bill.jpg`;await sb.storage.from('bill-photos').upload(fname,blob,{contentType:'image/jpeg'});const{data:url}=sb.storage.from('bill-photos').getPublicUrl(fname);billPhotoUrl=url?.publicUrl;}catch(e){console.warn('Bill photo upload failed:',e.message);}}
    const{data:prod,error:pe}=await sb.from('products').insert({name:nm,category_id:catRow?.id,created_by:CUP?.id}).select().single();if(pe)throw pe;
    const{data:skuNo}=await sb.rpc('generate_transaction_no',{p_prefix:prefix});
    const{data:variant,error:ve}=await sb.from('product_variants').insert({product_id:prod.id,sku:skuNo,colour:cl,colour_code:clCode,size:sz,size_code:sCode,no_of_designs:Number($('p-ds')?.value||1),no_of_colours:Number($('p-nc')?.value||1),purchase_price:cst,photo_url:photoUrl,created_by:CUP?.id}).select().single();if(ve)throw ve;
    const{data:txn,error:te}=await sb.from('transactions').insert({transaction_no:purNo,transaction_type:'purchase',transaction_date:today(),party_id:supParty?.id,total_amount:tot,paid_amount:pd,payment_status:purPayMode==='credit'?'credit':purPayMode==='partial'?'partial':'paid',performed_by:CUP?.id}).select().single();if(te)throw te;
    const{data:pur,error:pre}=await sb.from('purchases').insert({transaction_id:txn.id,supplier_party_id:supParty?.id,purchase_date:today(),total_amount:tot,paid_amount:pd,payment_mode:purPayMode,payment_source_account_id:payAccId,bill_photo_url:billPhotoUrl}).select().single();if(pre)throw pre;
    const{error:pie}=await sb.from('purchase_items').insert({purchase_id:pur.id,transaction_id:txn.id,variant_id:variant.id,qty,purchase_price:cst});if(pie)throw pie;
    const le=[];
    le.push({transaction_id:txn.id,entry_date:today(),entry_type:'debit',account_category:'asset',amount:tot,description:`Purchase ${skuNo}`,created_by:CUP?.id});
    if(purPayMode==='cash'&&cashAcc)le.push({transaction_id:txn.id,entry_date:today(),entry_type:'debit',account_category:'cashflow',cashflow_account_id:cashAcc.id,amount:tot,description:`Purchase ${skuNo}`,created_by:CUP?.id});
    else if(purPayMode==='credit'&&supParty)le.push({transaction_id:txn.id,entry_date:today(),entry_type:'credit',account_category:'party',party_id:supParty.id,amount:tot,description:`Purchase Credit ${skuNo}`,created_by:CUP?.id});
    else if(purPayMode==='partial'){if(pd>0&&payAccId)le.push({transaction_id:txn.id,entry_date:today(),entry_type:'debit',account_category:'cashflow',cashflow_account_id:payAccId,amount:pd,description:`Purchase partial ${skuNo}`,created_by:CUP?.id});if(pybl>0&&supParty)le.push({transaction_id:txn.id,entry_date:today(),entry_type:'credit',account_category:'party',party_id:supParty.id,amount:pybl,description:`Purchase payable ${skuNo}`,created_by:CUP?.id});}
    else if(purPayMode==='owner'){const ownerP=parties.find(p=>p.name==='Owner Account');if(ownerP)le.push({transaction_id:txn.id,entry_date:today(),entry_type:'credit',account_category:'party',party_id:ownerP.id,amount:tot,description:`Owner paid ${skuNo}`,created_by:CUP?.id});}
    else if(purPayMode==='loan'){const lname=$('pp-loan')?.value||'Market Loan';let lp=parties.find(p=>p.name===lname&&p.party_type==='loan');if(!lp){const{data:nlp}=await sb.from('parties').insert({party_type:'loan',name:lname,created_by:CUP?.id}).select().single();if(nlp){parties.push(nlp);lp=nlp;}}if(lp)le.push({transaction_id:txn.id,entry_date:today(),entry_type:'credit',account_category:'party',party_id:lp.id,amount:tot,description:`Loan for ${skuNo}`,created_by:CUP?.id});}
    if(le.length)await sb.from('ledger_entries').insert(le);
    await loadMasterData();
    showSKUBanner(skuNo,nm,cat,sz,cl);
    toast(`✅ SKU: ${skuNo} | Stock: ${qty}${pybl>0?` | Payable: ${fmt(pybl)}`:''}`,'ok',5000);
    resetPurForm();pPhoto=null;bPhoto=null;
  }catch(e){toast('Error: '+e.message,'err');console.error(e);}
}

function showSKUBanner(sku,nm,cat,sz,cl){const b=document.createElement('div');b.style.cssText='position:fixed;top:80px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;border-radius:16px;padding:14px 22px;z-index:500;text-align:center;box-shadow:var(--shadow2);min-width:250px';b.innerHTML=`<div style="font-size:.58rem;opacity:.6;text-transform:uppercase;letter-spacing:.1em;margin-bottom:5px">✅ SKU Generated</div><div style="font-family:monospace;font-size:1.4rem;font-weight:700;color:var(--gold3);letter-spacing:.08em">${sku}</div><div style="font-size:.7rem;opacity:.75;margin-top:4px">${nm} · ${cat}${sz?' · '+sz:''}${cl?' · '+cl:''}</div><button onclick="this.parentElement.remove()" style="margin-top:9px;background:rgba(255,255,255,.12);color:white;border:none;border-radius:7px;padding:5px 14px;font-size:.66rem;cursor:pointer">Got it ✓</button>`;document.body.appendChild(b);setTimeout(()=>{if(b.parentElement)b.remove();},9000);}

function resetPurForm(){['p-nm','p-sz','p-ds','p-nc','p-cl','p-qt','p-cs','pur-sup'].forEach(id=>{const e=$(id);if(e)e.value='';});if($('p-cat'))$('p-cat').value='';if($('ppi'))$('ppi').textContent='📸';if($('ppn'))$('ppn').textContent='';if($('pbn'))$('pbn').textContent='';if($('sku-prev'))$('sku-prev').textContent='Select category...';if($('pp-prev'))$('pp-prev').style.display='none';if($('pp-det'))$('pp-det').innerHTML='';const pp=$('pp-pills');if(pp){pp.querySelectorAll('.pill').forEach((p,i)=>p.classList.toggle('on',i===0));}purPayMode='cash';}

function rPurRet(){const opts=products.map(p=>`<option value="${p.id}">${p.name} (${p.sku})</option>`).join('');return`<div class="card"><div class="card-title">🔄 Purchase Return</div><div class="fg"><label class="lbl">Product</label><select class="sel" id="pr-p">${opts}</select></div><div class="g2"><div class="fg"><label class="lbl">Qty</label><input class="inp" id="pr-q" type="number" placeholder="0"></div><div class="fg"><label class="lbl">Cost ₨</label><input class="inp" id="pr-c" type="number" placeholder="0"></div></div><div class="fg"><label class="lbl">Supplier</label><input class="inp" id="pr-s" placeholder="Supplier name"></div><div class="fg"><label class="lbl">Reason</label><input class="inp" id="pr-r" placeholder="Defective..."></div><button class="btn btn-ink btn-full" onclick="savePurRet()">✅ Process</button></div>`;}
async function savePurRet(){const varId=$('pr-p')?.value;const qty=Number($('pr-q')?.value||0);const cst=Number($('pr-c')?.value||0);const sup=$('pr-s')?.value||'';const rsn=$('pr-r')?.value||'';if(!varId||!qty||!cst){toast('Fill all','err');return;}const p=products.find(p=>p.id===varId);if(!p)return;const supParty=parties.find(p=>p.name===sup&&p.party_type==='supplier');const amt=qty*cst;const cashAcc=accounts.find(a=>a.name==='Cash Drawer');const{data:retNo}=await sb.rpc('generate_transaction_no',{p_prefix:'PRET'});try{const{data:txn}=await sb.from('transactions').insert({transaction_no:retNo,transaction_type:'purchase_return',transaction_date:today(),party_id:supParty?.id,total_amount:amt,paid_amount:amt,payment_status:'paid',performed_by:CUP?.id,notes:rsn}).select().single();const{data:ret}=await sb.from('purchase_returns').insert({transaction_id:txn.id,original_purchase_transaction_id:txn.id,supplier_party_id:supParty?.id||parties[0].id,return_date:today(),total_return_amount:amt,reason:rsn}).select().single();await sb.from('purchase_return_items').insert({purchase_return_id:ret.id,variant_id:varId,qty,purchase_price:cst});await sb.from('inventory').update({qty_available:Math.max(0,(p.stock||0)-qty)}).eq('variant_id',varId);await sb.from('inventory_movements').insert({variant_id:varId,transaction_id:txn.id,movement_type:'purchase_return',qty_change:-qty,qty_before:p.stock||0,qty_after:Math.max(0,(p.stock||0)-qty),purchase_price:cst,reason:rsn,performed_by:CUP?.id});if(supParty)await sb.from('ledger_entries').insert({transaction_id:txn.id,entry_date:today(),entry_type:'debit',account_category:'party',party_id:supParty.id,amount:amt,description:`Return: ${p.name} x${qty}`,created_by:CUP?.id});await loadMasterData();toast(`✅ Return done! Stock -${qty}`,'ok');}catch(e){toast('Error: '+e.message,'err');}}

function rDmg(){const opts=products.filter(p=>(p.stock||0)>0).map(p=>`<option value="${p.id}">${p.name} (${p.sku})</option>`).join('');return`<div class="card"><div class="card-title" style="color:var(--red)">💥 Damaged</div><div class="fg"><label class="lbl">Product</label><select class="sel" id="dm-p" onchange="const p=products.find(p=>p.id===this.value);if(p&&$('dm-c'))$('dm-c').value=p.purchase_price;">${opts}</select></div><div class="g2"><div class="fg"><label class="lbl">Qty</label><input class="inp" id="dm-q" type="number" placeholder="0"></div><div class="fg"><label class="lbl">Cost ₨</label><input class="inp" id="dm-c" type="number" placeholder="0"></div></div><div class="fg"><label class="lbl">Description</label><input class="inp" id="dm-d" placeholder="Water damage, torn..."></div><button class="btn btn-red btn-full" onclick="saveDmg()">💾 Record</button></div>`;}
async function saveDmg(){const varId=$('dm-p')?.value;const qty=Number($('dm-q')?.value||0);const cst=Number($('dm-c')?.value||0);const desc=$('dm-d')?.value||'';if(!varId||!qty)return;const p=products.find(p=>p.id===varId);if(!p)return;await sb.from('inventory').update({qty_available:Math.max(0,(p.stock||0)-qty),qty_damaged:qty}).eq('variant_id',varId);await sb.from('inventory_movements').insert({variant_id:varId,movement_type:'damaged',qty_change:-qty,qty_before:p.stock||0,qty_after:Math.max(0,(p.stock||0)-qty),purchase_price:cst,reason:desc,performed_by:CUP?.id});await loadMasterData();toast(`💥 Stock -${qty}. Loss: ${fmt(qty*cst)}`,'ok');}

function rLst(){const opts=products.filter(p=>(p.stock||0)>0).map(p=>`<option value="${p.id}">${p.name} (${p.sku})</option>`).join('');return`<div class="card"><div class="card-title">❌ Lost Items</div><div class="fg"><label class="lbl">Lost By</label><div class="pill-row"><div class="pill on" id="lb-own" onclick="setLB('owner',this)">👑 Owner</div><div class="pill" id="lb-stf" onclick="setLB('staff',this)">👤 Staff</div></div></div><div class="fg"><label class="lbl" id="lb-lbl">Name</label><input class="inp" id="lb-nm" placeholder="Name"></div><div class="fg"><label class="lbl">Product</label><select class="sel" id="lb-p">${opts}</select></div><div class="g2"><div class="fg"><label class="lbl">Qty</label><input class="inp" id="lb-q" type="number" placeholder="0"></div><div class="fg"><label class="lbl">Cost ₨</label><input class="inp" id="lb-c" type="number" placeholder="0"></div></div><div class="fg"><label class="lbl">Notes</label><input class="inp" id="lb-nt" placeholder="Details..."></div><div class="info-box" id="lb-inf">👑 Posted to Owner Payable.</div><button class="btn btn-ink btn-full" onclick="saveLost()">💾 Record</button></div>`;}
function setLB(b,el){lostBy=b;document.querySelectorAll('#lb-own,#lb-stf').forEach(p=>p.classList.remove('on'));el.classList.add('on');if($('lb-lbl'))$('lb-lbl').textContent=b==='owner'?'Owner Name':'Staff Name';if($('lb-inf'))$('lb-inf').textContent=b==='owner'?'👑 Posted to Owner Payable.':'👤 Posted to Employee ledger.';}
async function saveLost(){const varId=$('lb-p')?.value;const qty=Number($('lb-q')?.value||0);const cst=Number($('lb-c')?.value||0);const per=$('lb-nm')?.value||lostBy;const nts=$('lb-nt')?.value||'';if(!varId||!qty)return;const p=products.find(p=>p.id===varId);if(!p)return;await sb.from('inventory').update({qty_available:Math.max(0,(p.stock||0)-qty)}).eq('variant_id',varId);await sb.from('inventory_movements').insert({variant_id:varId,movement_type:lostBy==='owner'?'lost_owner':'lost_staff',qty_change:-qty,qty_before:p.stock||0,qty_after:Math.max(0,(p.stock||0)-qty),purchase_price:cst,reason:`${per}: ${nts}`,performed_by:CUP?.id});await loadMasterData();toast(`❌ Stock -${qty}`,'ok');}

function rAgd(){const opts=products.filter(p=>(p.stock||0)>0).map(p=>`<option value="${p.id}">${p.name} (${p.sku})</option>`).join('');return`<div class="card"><div class="card-title">🏷️ Aged Sale</div><div class="fg"><label class="lbl">Product</label><select class="sel" id="ag-p" onchange="const p=products.find(p=>p.id===this.value);if(p&&$('ag-c'))$('ag-c').value=p.purchase_price;calcAgd();">${opts}</select></div><div class="g2"><div class="fg"><label class="lbl">Qty</label><input class="inp" id="ag-q" type="number" placeholder="0" oninput="calcAgd()"></div><div class="fg"><label class="lbl">Cost ₨</label><input class="inp" id="ag-c" type="number" placeholder="0" oninput="calcAgd()"></div></div><div class="fg"><label class="lbl">Sale Price ₨</label><input class="inp" id="ag-pr" type="number" placeholder="0" oninput="calcAgd()"></div><div id="ag-prev" class="payable-prev" style="display:none"></div><div class="fg"><label class="lbl">Reason</label><input class="inp" id="ag-r" placeholder="Old season..."></div><button class="btn btn-gold btn-full" onclick="saveAgd()">✅ Record</button></div>`;}
function calcAgd(){const q=Number($('ag-q')?.value||0);const c=Number($('ag-c')?.value||0);const pr=Number($('ag-pr')?.value||0);const p=$('ag-prev');if(!p)return;if(q>0&&c>0&&pr>0){const ls=(c-pr)*q;p.style.display='block';p.innerHTML=`<div class="flex just-b"><span>Cost</span><span>${fmt(c*q)}</span></div><div class="flex just-b" style="color:var(--sage)"><span>Sale</span><span>${fmt(pr*q)}</span></div><div class="flex just-b fw-7" style="border-top:1px dashed var(--border2);margin-top:5px;padding-top:5px;color:${ls>0?'var(--red)':'var(--sage)'}"><span>${ls>0?'Loss':'Gain'}</span><span>${fmt(Math.abs(ls))}</span></div>`;}else p.style.display='none';}
async function saveAgd(){const varId=$('ag-p')?.value;const qty=Number($('ag-q')?.value||0);const cst=Number($('ag-c')?.value||0);const pr=Number($('ag-pr')?.value||0);const rsn=$('ag-r')?.value||'';if(!varId||!qty||!pr)return;const p=products.find(p=>p.id===varId);if(!p)return;const cashAcc=accounts.find(a=>a.name==='Cash Drawer');const{data:saleNo}=await sb.rpc('generate_transaction_no',{p_prefix:'AGD'});const tot=pr*qty;const mg=(pr-cst)*qty;try{const{data:txn}=await sb.from('transactions').insert({transaction_no:saleNo,transaction_type:'sale',transaction_date:today(),total_amount:tot,paid_amount:tot,payment_status:'paid',performed_by:CUP?.id,notes:'Aged: '+rsn}).select().single();const{data:sale}=await sb.from('sales').insert({transaction_id:txn.id,customer_name:'Aged Stock',sale_date:today(),total_amount:tot,paid_amount:tot,payment_mode:'cash',primary_account_id:cashAcc?.id,gross_profit:mg}).select().single();await sb.from('sale_items').insert({sale_id:sale.id,transaction_id:txn.id,variant_id:varId,qty,purchase_price:cst,sale_price:pr});if(cashAcc)await sb.from('ledger_entries').insert({transaction_id:txn.id,entry_date:today(),entry_type:'credit',account_category:'cashflow',cashflow_account_id:cashAcc.id,amount:tot,description:`Aged Sale: ${p.name}`,created_by:CUP?.id});await loadMasterData();toast(`🏷️ ${mg<0?'Loss':'Margin'}: ${fmt(Math.abs(mg))}`,'ok');}catch(e){toast('Error: '+e.message,'err');}}

const LTABS={customer:{label:'👤 Customers',ptype:'customer'},supplier:{label:'🏭 Suppliers',ptype:'supplier'},owner:{label:'👑 Owner',ptype:'owner'},bank:{label:'🏦 Banks',ptype:null,acct:'bank'},emoney:{label:'📱 E-Money',ptype:null,acct:'emoney'},loan:{label:'🤝 Loans',ptype:'loan'},employee:{label:'👥 Staff',ptype:'employee'}};
function rLed(){return`<div style="display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-bottom:14px">${Object.entries(LTABS).map(([k,v])=>`<div class="pill ${k===lTab?'on':''}" onclick="setLTab('${k}',this)" style="white-space:nowrap">${v.label}</div>`).join('')}</div><div id="led-content"></div><button class="btn btn-ink btn-full" onclick="openAddLedEntry()">➕ Add Entry</button>`;}

async function renderLedContent(){
  const c=$('led-content');if(!c)return;
  const cfg=LTABS[lTab];
  const items=cfg.ptype?parties.filter(p=>p.party_type===cfg.ptype):accounts.filter(a=>a.account_type===cfg.acct);
  if(!items.length){c.innerHTML='<div class="empty"><div class="empty-ico">📒</div><p>No entries yet.</p></div>';return;}
  const total=items.reduce((s,it)=>s+(it.current_balance||0),0);
  c.innerHTML=`<div class="card" style="background:var(--ink);border:none;margin-bottom:12px"><div class="t-xs upper" style="color:rgba(255,255,255,.5)">Total Balance</div><div style="font-size:1.4rem;font-weight:700;color:white;font-family:'Cormorant Garamond',serif;margin-top:4px">${fmt(Math.abs(total))}</div><div class="t-xs" style="color:rgba(255,255,255,.4);margin-top:2px">${items.length} ${cfg.ptype||'accounts'}</div></div>${items.map(it=>`<div class="party-card" onclick="showStatement('${it.id}','${cfg.ptype?'party':'account'}')"><div class="flex just-b items-c"><div><div class="t-sm fw-7">${it.name}</div><div class="t-xs c-ink3">Tap for statement</div></div><div style="text-align:right"><div class="party-bal" style="color:${(it.current_balance||0)>0?'var(--rust)':'var(--sage)'}">${fmt(Math.abs(it.current_balance||0))}</div><div class="t-xs c-ink3">Balance</div></div></div></div>`).join('')}`;
}

async function showStatement(id,type){
  let stmt=[];
  if(type==='party'){const{data}=await sb.rpc('get_party_statement',{p_party_id:id});stmt=data||[];}
  else{const{data}=await sb.rpc('get_cashflow_statement',{p_account_id:id,p_from:new Date(Date.now()-90*864e5).toISOString().split('T')[0],p_to:today()});stmt=data||[];}
  const item=[...parties,...accounts].find(x=>x.id===id);
  const bal=stmt.length?stmt[stmt.length-1].running_balance:0;
  openMo(item?.name||'Statement',`<div style="background:var(--cream2);border-radius:10px;padding:12px;margin-bottom:14px;display:flex;justify-content:space-between"><div><div class="t-xs c-ink3 upper">Balance</div><div style="font-size:1.2rem;font-weight:700;color:var(--rust);font-family:'Cormorant Garamond',serif">${fmt(Math.abs(bal||0))}</div></div><div style="text-align:right"><div class="t-xs c-ink3">Transactions</div><div class="t-lg fw-7">${stmt.length}</div></div></div><div style="border:1px solid var(--border2);border-radius:10px;overflow:hidden"><div class="stmt-row stmt-hdr"><div class="t-xs fw-7">Date</div><div class="t-xs fw-7" style="text-align:right">DR</div><div class="t-xs fw-7" style="text-align:right">CR</div><div class="t-xs fw-7" style="text-align:right">Bal</div></div>${stmt.map(r=>`<div class="stmt-row"><div><div class="t-xs fw-6">${r.entry_date||''}</div><div class="t-xs c-ink3">${r.description||''}</div></div><div style="text-align:right;color:var(--red)" class="t-xs">${(r.debit||r.money_out||0)>0?fmt(r.debit||r.money_out):''}</div><div style="text-align:right;color:var(--sage)" class="t-xs">${(r.credit||r.money_in||0)>0?fmt(r.credit||r.money_in):''}</div><div style="text-align:right;font-weight:700" class="t-xs">${fmt(Math.abs(r.running_balance||0))}</div></div>`).join('')}</div>`);
}

function openAddLedEntry(){const cfg=LTABS[lTab];openMo(`➕ Entry`,`<div class="fg"><label class="lbl">Party/Account</label><input class="inp" id="le-p" placeholder="Name"></div><div class="fg"><label class="lbl">Date</label><input class="inp" id="le-d" type="date" value="${today()}"></div><div class="fg"><label class="lbl">Type</label><select class="sel" id="le-t"><option>Payment Received</option><option>Payment Made</option><option>Sale Credit</option><option>Purchase Credit</option><option>Loan Received</option><option>Repayment Made</option><option>Owner Withdrawal</option><option>Owner Deposit</option><option>Salary Paid</option><option>Advance Given</option></select></div><div class="fg"><label class="lbl">Amount ₨</label><input class="inp" id="le-a" type="number" placeholder="0"></div><div class="fg"><label class="lbl">Notes</label><input class="inp" id="le-n" placeholder="Optional"></div><button class="btn btn-ink btn-full" onclick="saveLedEntry()">💾 Save</button>`);}
async function saveLedEntry(){
  const pname=$('le-p')?.value?.trim();const dt=$('le-d')?.value;const type=$('le-t')?.value;const amt=Number($('le-a')?.value||0);const notes=$('le-n')?.value||'';
  if(!pname||!amt){toast('Fill party and amount','err');return;}
  const cfg=LTABS[lTab];const isCr=['Payment Received','Sale Credit','Loan Received','Owner Deposit','Salary Paid'].includes(type);
  const{data:txNo}=await sb.rpc('generate_transaction_no',{p_prefix:'MAN'});
  try{
    let pId=null;
    if(cfg.ptype){let p=parties.find(p=>p.name===pname&&p.party_type===cfg.ptype);if(!p){const{data:np}=await sb.from('parties').insert({party_type:cfg.ptype,name:pname,created_by:CUP?.id}).select().single();if(np){parties.push(np);p=np;}}pId=p?.id;}
    const{data:txn}=await sb.from('transactions').insert({transaction_no:txNo,transaction_type:'payment_received',transaction_date:dt||today(),party_id:pId,total_amount:amt,paid_amount:amt,payment_status:'paid',performed_by:CUP?.id,notes:`${type}: ${notes}`}).select().single();
    await sb.from('ledger_entries').insert({transaction_id:txn.id,entry_date:dt||today(),entry_type:isCr?'credit':'debit',account_category:cfg.ptype?'party':'cashflow',party_id:pId,amount:amt,description:`${type}: ${notes}`,created_by:CUP?.id});
    closeMo();toast(`✅ Entry saved!`,'ok');renderLedContent();
  }catch(e){toast('Error: '+e.message,'err');}
}

function rRep(){return`<div style="display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-bottom:14px"><div class="pill on" onclick="setRTab('sales',this)">📊 Sales</div><div class="pill" onclick="setRTab('purchase',this)">📦 Purchase</div><div class="pill" onclick="setRTab('stock',this)">📋 Stock</div><div class="pill" onclick="setRTab('ageing',this)">⏳ Ageing</div><div class="pill" onclick="setRTab('cash',this)">💵 Cash</div><div class="pill" onclick="setRTab('pl',this)">📈 P&L</div><div class="pill" onclick="setRTab('seasonal',this)">🗓️ Seasonal</div><div class="pill" onclick="setRTab('ledger',this)">📒 Ledger</div></div><div class="date-flt"><input class="inp" id="r-from" type="date" value="${today()}"><input class="inp" id="r-to" type="date" value="${today()}"><button class="btn btn-ink btn-sm" onclick="genRep()">Go</button></div><div class="flex gap-2" style="margin-bottom:12px"><button class="btn btn-ghost btn-sm" onclick="exportRep()">📥 CSV</button><button class="btn btn-ghost btn-sm" onclick="printRep()">🖨️ Print</button></div><div id="rep-content"></div>`;}

function setRTab(t,el){rTab=t;document.querySelectorAll('.pill').forEach(p=>p.classList.remove('on'));el.classList.add('on');genRep();}
function exportRep(){if(!lastRepData.length){toast('No data','warn');return;}const hdr=Object.keys(lastRepData[0]);const rows=[hdr.join(','),...lastRepData.map(r=>hdr.map(h=>`"${String(r[h]||'').replace(/"/g,'""')}"`).join(','))];const blob=new Blob([rows.join('\n')],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=lastRepTitle+'.csv';a.click();toast(`✅ ${lastRepTitle}.csv`,'ok');}
