<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SL Collection POS</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--ink:#1A0A00;--ink2:#3D1F08;--ink3:#6B3E1A;--cream:#FAF6F0;--cream2:#F2E9DC;--gold:#B8860B;--sage:#2D4A2D;--red:#8B1A1A;--border:#D4C4A8;--r:12px;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:'Segoe UI',sans-serif;}
html,body{height:100%;background:var(--cream);color:var(--ink);max-width:480px;margin:0 auto;}
#ls{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px;background:linear-gradient(150deg,#1A0A00,#3D1F08 60%,#8B3A1A);}
.lb1{text-align:center;margin-bottom:36px;color:white;}
.lb1 h1{font-size:2.4rem;font-weight:300;letter-spacing:.04em;}
.lb1 p{font-size:.6rem;letter-spacing:.3em;opacity:.4;margin-top:6px;}
.lc{background:white;border-radius:20px;padding:28px 22px;width:100%;max-width:320px;box-shadow:0 24px 60px rgba(0,0,0,.4);}
.lc h2{font-size:.68rem;font-weight:600;color:#6B3E1A;margin-bottom:20px;text-align:center;letter-spacing:.15em;text-transform:uppercase;}
.le{color:#8B1A1A;font-size:.68rem;text-align:center;margin-top:8px;display:none;}
#app{display:none;}
#tb{background:var(--ink);padding:10px 14px 0;position:sticky;top:0;z-index:100;}
.tbr{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.brand{color:white;font-size:1rem;font-weight:600;}
.brand small{display:block;font-size:.52rem;color:rgba(255,255,255,.35);font-weight:300;}
.uc{background:rgba(255,255,255,.1);color:white;font-size:.6rem;padding:4px 10px;border-radius:16px;border:1px solid rgba(255,255,255,.1);}
.xb{background:none;border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.6);border-radius:6px;padding:4px 9px;font-size:.6rem;cursor:pointer;margin-left:6px;}
.nt{display:flex;gap:1px;overflow-x:auto;scrollbar-width:none;}
.nt::-webkit-scrollbar{display:none;}
.ni{color:rgba(255,255,255,.4);font-size:.57rem;font-weight:500;text-transform:uppercase;padding:8px 11px;border-radius:8px 8px 0 0;cursor:pointer;white-space:nowrap;flex-shrink:0;}
.ni.on{background:var(--cream);color:var(--ink);font-weight:700;}
#ct{padding:14px;padding-bottom:80px;}
.fg{margin-bottom:11px;}
.lb{font-size:.58rem;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px;display:block;}
.ip,.sl{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:10px 12px;font-size:.85rem;color:var(--ink);background:white;outline:none;}
.ip:focus,.sl:focus{border-color:var(--gold);}
.btn{border:none;border-radius:10px;padding:11px 16px;font-size:.76rem;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;width:100%;}
.btn:active{transform:scale(.97);}
.bi{background:var(--ink);color:white;}.bg{background:var(--gold);color:white;}.bs{background:var(--sage);color:white;}.br{background:var(--red);color:white;}.bh{background:var(--cream2);color:var(--ink2);border:1px solid var(--border);}
.bsm{width:auto;padding:7px 12px;font-size:.66rem;border-radius:8px;}
.card{background:white;border-radius:var(--r);padding:14px;margin-bottom:12px;border:1px solid #E8D8C0;box-shadow:0 2px 12px rgba(26,10,0,.06);}
.ct{font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--ink3);margin-bottom:11px;padding-bottom:8px;border-bottom:1px solid #E8D8C0;}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.sc{background:white;border-radius:var(--r);padding:12px 13px;border-left:3px solid var(--ink3);box-shadow:0 2px 12px rgba(26,10,0,.06);}
.sc.go{border-left-color:var(--gold);}.sc.sg2{border-left-color:var(--sage);}.sc.rd{border-left-color:var(--red);}
.sl2{font-size:.54rem;text-transform:uppercase;letter-spacing:.1em;color:var(--ink3);font-weight:600;}
.sv{font-size:1.05rem;font-weight:700;color:var(--ink);margin-top:3px;}
.pr{display:flex;gap:5px;flex-wrap:wrap;}
.pl{border:1.5px solid var(--border);border-radius:18px;padding:5px 12px;font-size:.63rem;font-weight:600;cursor:pointer;color:var(--ink3);background:white;white-space:nowrap;}
.pl.on{background:var(--ink);color:white;border-color:var(--ink);}
.pc{background:white;border:1.5px solid #E8D8C0;border-radius:var(--r);padding:10px 11px;margin-bottom:8px;cursor:pointer;display:flex;align-items:center;gap:9px;}
.pc:active{border-color:var(--gold);}
.pt{width:46px;height:46px;border-radius:8px;background:var(--cream2);display:flex;align-items:center;justify-content:center;font-size:1.4rem;flex-shrink:0;}
.psk{font-size:.53rem;font-weight:700;font-family:monospace;background:var(--ink);color:white;padding:2px 5px;border-radius:3px;display:inline-block;margin-bottom:2px;}
.pn{font-size:.76rem;font-weight:600;color:var(--ink);}
.pa{font-size:.56rem;color:var(--ink3);margin-top:1px;}
.pp{font-size:.55rem;background:var(--cream2);color:var(--ink3);padding:2px 6px;border-radius:3px;margin-top:2px;display:inline-block;}
.pad{width:34px;height:34px;border-radius:8px;background:var(--sage);color:white;display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0;font-weight:700;}
.ci{background:white;border:1px solid #E8D8C0;border-radius:var(--r);padding:10px 12px;margin-bottom:8px;}
.qc{display:flex;align-items:center;gap:5px;background:var(--cream2);border-radius:7px;padding:3px 7px;border:1px solid #E8D8C0;}
.qb{background:none;border:none;font-size:.85rem;cursor:pointer;font-weight:700;width:20px;height:20px;display:flex;align-items:center;justify-content:center;}
.qn{font-size:.78rem;font-weight:700;min-width:18px;text-align:center;}
.pi2{flex:1;border:1.5px solid var(--border);border-radius:7px;padding:6px 9px;font-size:.82rem;font-weight:700;color:var(--gold);outline:none;}
.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:white;padding:9px 20px;border-radius:20px;font-size:.74rem;font-weight:500;opacity:0;transition:all .3s;z-index:999;white-space:nowrap;max-width:92vw;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.ok{background:var(--sage);}.toast.err{background:var(--red);}.toast.warn{background:var(--gold);}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:flex-end;}
.mo.show{display:flex;}
.mb{background:white;border-radius:20px 20px 0 0;padding:20px;width:100%;max-height:86vh;overflow-y:auto;}
.mt{font-size:1.05rem;font-weight:600;color:var(--ink);margin-bottom:14px;}
.mx{background:none;border:none;font-size:1.1rem;cursor:pointer;color:var(--ink3);padding:2px 6px;}
.rh{background:var(--ink);color:white;padding:8px 12px;border-radius:9px 9px 0 0;display:flex;justify-content:space-between;}
.rh div{font-size:.6rem;font-weight:700;}
.rr{display:flex;justify-content:space-between;padding:7px 12px;border-bottom:1px solid var(--cream2);background:white;font-size:.7rem;}
.rf{display:flex;justify-content:space-between;padding:8px 12px;background:var(--cream2);border-radius:0 0 9px 9px;font-size:.72rem;font-weight:700;color:var(--ink2);}
.em{text-align:center;padding:28px 16px;color:var(--ink3);}
.ei{font-size:2.4rem;margin-bottom:8px;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.sp{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-radius:50%;border-top-color:white;animation:sp .8s linear infinite;}
@keyframes sp{to{transform:rotate(360deg)}}
.sku-prev{background:var(--cream2);border:1.5px solid var(--gold);border-radius:var(--r);padding:11px 13px;margin-bottom:12px;}
.sku-code{font-family:monospace;font-size:.9rem;font-weight:700;color:var(--gold);}
.ih{display:grid;grid-template-columns:1.8fr .6fr .8fr .8fr;background:var(--ink);color:white;padding:6px 11px;border-radius:8px 8px 0 0;}
.ih div{font-size:.54rem;font-weight:700;text-transform:uppercase;}
.ir{display:grid;grid-template-columns:1.8fr .6fr .8fr .8fr;padding:8px 11px;border-top:1px solid var(--cream2);background:white;cursor:pointer;}
.if2{display:grid;grid-template-columns:1.8fr .6fr .8fr .8fr;padding:7px 11px;background:var(--cream2);}
.df{display:flex;gap:8px;margin-bottom:12px;}
.df .ip{font-size:.73rem;padding:7px 10px;flex:1;}
.ib{background:var(--cream2);border:1px solid var(--border);border-radius:9px;padding:9px 12px;margin-bottom:11px;font-size:.66rem;color:var(--ink2);}
</style>
</head>
<body>
<div id="ls">
  <div class="lb1"><h1>SL Collection</h1><p>POINT OF SALE - RAWALPINDI</p></div>
  <div class="lc">
    <h2>Sign In</h2>
    <div class="fg"><label class="lb">Email</label><input class="ip" id="em" type="email" value="owner@slcollection.com"></div>
    <div class="fg"><label class="lb">Password</label><input class="ip" id="pw" type="password" placeholder="Password"></div>
    <button class="btn bi" id="lb2" onclick="login()">Sign In</button>
    <div class="le" id="le"></div>
  </div>
</div>
<div id="app">
  <div id="tb">
    <div class="tbr">
      <div class="brand">SL Collection<small>POS - Rawalpindi</small></div>
      <div style="display:flex;align-items:center;">
        <div class="uc" id="uc">Owner</div>
        <button class="xb" onclick="logout()">Exit</button>
      </div>
    </div>
    <div class="nt" id="nt"></div>
  </div>
  <div id="ct"></div>
</div>
<div class="toast" id="tst"></div>
<div class="mo" id="mo">
  <div class="mb">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:13px;">
      <div class="mt" id="mtitle"></div>
      <button class="mx" onclick="cmo()">X</button>
    </div>
    <div id="mc"></div>
  </div>
</div>
<script>

window.onerror=function(m,s,l){var e=document.getElementById('le');if(e){e.style.display='block';e.textContent='Error line '+l+': '+m;}return false;};
var sb=(function(){var c=supabase.createClient('https://fqubaesqzfmxvbtqconu.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZxdWJhZXNxemZteHZidHFjb251Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxODIwNTMsImV4cCI6MjA5NDc1ODA1M30.vqDRl0LGYOukQBRK7aegaXgCKxi-r65IwyNZKvGnUIk');return c;})();
var $=function(id){return document.getElementById(id);};
var fmt=function(n){return 'Rs'+Number(n||0).toLocaleString();};
var td=function(){return new Date().toISOString().split('T')[0];};
var CATS=['3PC','2PC','Shirt','Jeans','Trouser','Dupatta','Abaya','Scarf','Maxi','Kurti','Shalwar','Palazzo','Skirt','Leggings','Night Suit','Inner Wear','Others'];
var CCOD={'3PC':'3PC','2PC':'2PC','Shirt':'SHT','Jeans':'JNS','Trouser':'TRS','Dupatta':'DPT','Abaya':'ABY','Scarf':'SCF','Maxi':'MAX','Kurti':'KRT','Shalwar':'SHL','Palazzo':'PLZ','Skirt':'SKT','Leggings':'LGG','Night Suit':'NGT','Inner Wear':'INW','Others':'OTH'};
var CEMI={'3PC':'X','2PC':'X','Shirt':'X','Jeans':'X','Trouser':'X','Dupatta':'X','Abaya':'X','Scarf':'X'};
var CU=null,CUP=null,cart=[],payMode='cash',purPayMode='cash',prods=[],accs=[],parties=[],bCat='';

function toast(m,t,d){var el=$('tst');el.textContent=m;el.className='toast show '+(t||'');setTimeout(function(){el.className='toast';},d||3000);}
function omo(t,h){$('mtitle').textContent=t;$('mc').innerHTML=h;$('mo').classList.add('show');}
function cmo(){$('mo').classList.remove('show');}
function emo2(c){var m={'3PC':'3PC','2PC':'2PC','Shirt':'SHT','Jeans':'JNS','Trouser':'TRS','Dupatta':'DPT','Abaya':'ABY','Scarf':'SCF'};return m[c]||c||'?';}

function colCode(c){if(!c)return'CLR';var m={black:'BLK',white:'WHT',blue:'BLU','navy blue':'NVY',navy:'NVY',red:'RED',green:'GRN',pink:'PNK',yellow:'YLW',orange:'ORG',brown:'BRN',maroon:'MRN',grey:'GRY',gray:'GRY',multi:'MLT'};var l=c.toLowerCase().trim();if(m[l])return m[l];var keys=Object.keys(m);for(var i=0;i<keys.length;i++){if(l.indexOf(keys[i])>=0)return m[keys[i]];}return c.replace(/[^a-zA-Z]/g,'').toUpperCase().substring(0,3)||'CLR';}
function szCode(s){if(!s)return'STD';var m={SMALL:'S',MEDIUM:'M',LARGE:'L','EXTRA LARGE':'XL','FREE SIZE':'FRE'};return m[s.toUpperCase().trim()]||s.toUpperCase().substring(0,3);}

async function login(){
  var emailEl=$('em'),pwEl=$('pw'),errEl=$('le'),btn=$('lb2');
  var email=emailEl?emailEl.value.trim():'';
  var pw=pwEl?pwEl.value:'';
  if(!email||!pw){if(errEl){errEl.style.display='block';errEl.textContent='Enter email and password';}return;}
  if(btn){btn.textContent='...';btn.disabled=true;}
  try{
    var r=await sb.auth.signInWithPassword({email:email,password:pw});
    if(r.error){if(errEl){errEl.style.display='block';errEl.textContent=r.error.message;}if(btn){btn.textContent='Sign In';btn.disabled=false;}return;}
    CU=r.data.user;
    var ur=await sb.from('users').select('*').eq('auth_id',CU.id).single();
    CUP=ur.data;
    await loadData();
    $('ls').style.display='none';
    $('app').style.display='block';
    var uc=$('uc');if(uc)uc.textContent=(CUP&&CUP.role==='owner'?'Owner':'Staff')+': '+(CUP&&CUP.full_name||'');
    buildNav();
    if(btn){btn.textContent='Sign In';btn.disabled=false;}
    toast('Welcome '+(CUP&&CUP.full_name||'')+'!','ok');
  }catch(ex){
    if(errEl){errEl.style.display='block';errEl.textContent=''+ex.message;}
    if(btn){btn.textContent='Sign In';btn.disabled=false;}
  }
}

document.getElementById('pw').addEventListener('keypress',function(e){if(e.key==='Enter')login();});

sb.auth.getSession().then(async function(r2){
  try{
    if(r2&&r2.data&&r2.data.session){
      CU=r2.data.session.user;
      var ur2=await sb.from('users').select('*').eq('auth_id',CU.id).single();
      CUP=ur2.data;
      await loadData();
      $('ls').style.display='none';
      $('app').style.display='block';
      var uc2=$('uc');if(uc2)uc2.textContent=(CUP&&CUP.role==='owner'?'Owner':'Staff')+': '+(CUP&&CUP.full_name||'');
      buildNav();
    }
  }catch(ex2){console.error('session err:',ex2);}
});

async function logout(){await sb.auth.signOut();CU=null;CUP=null;cart=[];$('app').style.display='none';$('ls').style.display='flex';}

async function loadData(){
  var p=await sb.from('product_variants').select('*,products(name,categories(name,code))').eq('is_active',true);
  var a=await sb.from('cashflow_accounts').select('*').eq('is_active',true).order('sort_order');
  var pa=await sb.from('parties').select('*').eq('is_active',true).order('name');
  prods=(p.data||[]).map(function(v){return{id:v.id,sku:v.sku,name:v.products&&v.products.name||'',cat:v.products&&v.products.categories&&v.products.categories.name||'',colour:v.colour||'',size:v.size||'',cost:Number(v.purchase_price)||0,stock:0,age:0};});
  accs=a.data||[];parties=pa.data||[];
  // Resilient inventory query - falls back if new columns missing
  var inv=await sb.from('inventory').select('variant_id,qty_available,age_days');
  (inv.data||[]).forEach(function(i){var p2=prods.find(function(p3){return p3.id===i.variant_id;});if(p2){p2.stock=Number(i.qty_available)||0;p2.age=i.age_days||0;}});
  // Try to load extra columns (only available after schema migration)
  try{
    var inv2=await sb.from('inventory').select('variant_id,qty_damaged,qty_sales_return,qty_purchase_return,qty_other,qty_with_customer,qty_reserved');
    (inv2.data||[]).forEach(function(i){var p2=prods.find(function(p3){return p3.id===i.variant_id;});if(p2){p2.damaged=i.qty_damaged||0;p2.salesRet=i.qty_sales_return||0;p2.purRet=i.qty_purchase_return||0;p2.other=i.qty_other||0;p2.withCustomer=i.qty_with_customer||0;p2.reserved=i.qty_reserved||0;}});
  }catch(e){/* columns not yet migrated */}
}

function buildNav(){
  var tabs=CUP&&CUP.role==='owner'
    ?[{id:'dash',l:'Dashboard'},{id:'bill',l:'Bill'},{id:'inv',l:'Stock'},{id:'buy',l:'Buy'},{id:'led',l:'Ledger'},{id:'rep',l:'Reports'},{id:'cash',l:'Cash'}]
    :[{id:'bill',l:'Bill'},{id:'inv',l:'Stock'},{id:'buy',l:'Buy'},{id:'led',l:'Ledger'},{id:'cash',l:'Cash'}];
  var html='';for(var i=0;i<tabs.length;i++)html+='<div class="ni'+(i===0?' on':'')+'" onclick="showTab(\''+tabs[i].id+'\',this)">'+tabs[i].l+'</div>';
  $('nt').innerHTML=html;
  showTab(tabs[0].id,null);
  // Add PW button once
  if(!document.getElementById('pw-btn')){
    var xb=document.querySelector('.xb');
    if(xb&&xb.parentNode){
      var pb=document.createElement('button');
      pb.id='pw-btn';pb.className='xb';pb.textContent='PW';
      pb.title='Change Password';pb.onclick=openChangePW;
      xb.parentNode.insertBefore(pb,xb);
    }
  }
}

function showTab(id,el){
  if(el){var ns=document.querySelectorAll('.ni');for(var i=0;i<ns.length;i++)ns[i].classList.remove('on');el.classList.add('on');}
  var c=$('ct');
  if(id==='dash'){c.innerHTML=rDash();iDash();}
  else if(id==='bill'){c.innerHTML=rBill();iBill();}
  else if(id==='inv'){c.innerHTML=rInv();iInv();}
  else if(id==='buy'){c.innerHTML=rBuy();}
  else if(id==='led'){c.innerHTML=rLed();iLed();}
  else if(id==='rep'){c.innerHTML=rRep();iRep();}
  else if(id==='cash'){c.innerHTML=rCash();iCash();}
}


function rDash(){return '<div id="ob" class="ib" style="display:none;border-color:var(--gold)"><div class="ct">Opening Balance</div><div style="display:flex;gap:8px"><input class="ip" id="ob-v" type="number" placeholder="Cash in drawer"><button class="btn bg bsm" onclick="setOB()">Set</button></div></div><div class="sg" id="ds"></div><div class="card" id="dr"></div><div style="font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--ink3);margin-bottom:8px">Today Sales</div><div id="dd"></div>';}
async function iDash(){
  var ca=accs.find(function(a){return a.name==='Cash Drawer';});
  if(ca){var ob=await sb.from('opening_balances').select('id').eq('balance_date',td()).eq('account_id',ca.id).maybeSingle();if(!ob.data){var obEl=$('ob');if(obEl)obEl.style.display='block';}}
  var s=await sb.rpc('get_dashboard_summary',{p_date:td()});
  var ds=$('ds');var dr=$('dr');
  if(s.data&&ds){
    ds.innerHTML='<div class="sc"><div class="sl2">Today Sales</div><div class="sv">'+fmt(s.data.today_sales)+'</div></div><div class="sc sg2"><div class="sl2">Profit</div><div class="sv">'+fmt(s.data.today_profit)+'</div></div><div class="sc go"><div class="sl2">Cash</div><div class="sv">'+fmt(s.data.cash_balance)+'</div></div><div class="sc rd"><div class="sl2">Expenses</div><div class="sv">'+fmt(s.data.today_expenses)+'</div></div><div class="sc"><div class="sl2">Monthly</div><div class="sv">'+fmt(s.data.monthly_sales)+'</div></div><div class="sc sg2"><div class="sl2">M.Profit</div><div class="sv">'+fmt(s.data.monthly_profit)+'</div></div><div class="sc" style="border-left-color:var(--ink3)"><div class="sl2">Receivables</div><div class="sv">'+fmt(s.data.total_receivables)+'</div></div><div class="sc rd"><div class="sl2">Payables</div><div class="sv">'+fmt(s.data.total_payables)+'</div></div>';
    if(dr){var ob2=ca?ca.opening_balance:0;dr.innerHTML='<div class="ct" style="color:var(--gold)">Cash Reconciliation</div><div style="display:flex;justify-content:space-between;font-size:.72rem;margin-bottom:5px"><span>Opening</span><span>'+fmt(ob2)+'</span></div><div style="display:flex;justify-content:space-between;font-size:.72rem;margin-bottom:5px"><span>+ Sales</span><span>'+fmt(s.data.today_sales)+'</span></div><div style="display:flex;justify-content:space-between;font-size:.72rem;margin-bottom:5px"><span>- Expenses</span><span>- '+fmt(s.data.today_expenses)+'</span></div><div style="display:flex;justify-content:space-between;font-size:.75rem;font-weight:700;border-top:1px dashed var(--border);padding-top:7px;margin-top:5px;color:var(--sage)"><span>Expected</span><span>'+fmt(ob2+Number(s.data.today_sales)-Number(s.data.today_expenses))+'</span></div>';}
  }
  var sl=await sb.from('sales').select('*,transactions(transaction_no)').eq('sale_date',td()).order('created_at',{ascending:false}).limit(10);
  var dd=$('dd');if(!dd)return;

function updSum(){

async function completeSale(){
  if(!cart.length){toast('Cart empty','err');return;}
  var mp=cart.find(function(c){return!c.price||c.price<=0;});
  if(mp){toast('Enter price for: '+mp.name,'err');return;}
  var cust=($('bc')&&$('bc').value||'').trim()||'Walk-in';
  if((payMode==='credit'||payMode==='split')&&cust==='Walk-in'){toast('Enter customer name','err');return;}
  var btn=$('cb3');if(btn){btn.textContent='...';btn.disabled=true;}
  var subtotal=cart.reduce(function(s,c){return s+c.price*c.qty;},0);
  var disc=Number(document.getElementById('disc')&&document.getElementById('disc').value||0);
  var tot=Math.max(0,subtotal-disc);
  var cst2=cart.reduce(function(s,c){return s+c.cost*c.qty;},0);
  var mg=tot-cst2;
  // FIX 5: Cash balance check before processing
  var ca0=accs.find(function(a){return a.name==='Cash Drawer';});
  if(payMode==='cash'){
    // For sales we RECEIVE cash, no balance check needed
  }
  var bankId=$('bnk')&&$('bnk').value||null;
  var emId=$('em2')&&$('em2').value||null;
  var splitCash=Number($('sc2')&&$('sc2').value||0);
  var ca=accs.find(function(a){return a.name==='Cash Drawer';});
  var custId=null;
  if(payMode==='credit'||payMode==='split'){
    var cp=parties.find(function(p){return p.name===cust&&p.party_type==='customer';});
    if(!cp){var nr=await sb.from('parties').insert({party_type:'customer',name:cust,created_by:CUP&&CUP.id}).select().single();if(nr.data){parties.push(nr.data);cp=nr.data;}}
    custId=cp&&cp.id||null;
  }
  try{
    var bn=await sb.rpc('generate_transaction_no',{p_prefix:'BILL'});
    var tr=await sb.from('transactions').insert({transaction_no:bn.data,transaction_type:'sale',transaction_date:td(),party_id:custId,total_amount:tot,paid_amount:payMode==='credit'?0:tot,payment_status:payMode==='credit'?'credit':payMode==='split'?'partial':'paid',performed_by:CUP&&CUP.id}).select().single();
    if(tr.error)throw tr.error;
    var accId2=payMode==='cash'?ca&&ca.id:payMode==='bank'?bankId:payMode==='emoney'?emId:ca&&ca.id;
    var sr2=await sb.from('sales').insert({transaction_id:tr.data.id,customer_party_id:custId,customer_name:cust,sale_date:td(),subtotal:tot,total_amount:tot,paid_amount:payMode==='credit'?0:payMode==='split'?splitCash:tot,payment_mode:payMode,primary_account_id:accId2,gross_profit:mg}).select().single();
    if(sr2.error)throw sr2.error;
    await sb.from('sale_items').insert(cart.map(function(it){return{sale_id:sr2.data.id,transaction_id:tr.data.id,variant_id:it.id,qty:it.qty,purchase_price:it.cost,sale_price:it.price};}));
    await sb.rpc('post_transaction_ledger',{p_txn_id:tr.data.id,p_txn_type:'sale',p_payment_mode:payMode,p_total:tot,p_paid:payMode==='credit'?0:tot,p_party_id:custId,p_account_id:accId2,p_split_cash:splitCash,p_user_id:CUP&&CUP.id});
    await sb.from('ledger_entries').insert({transaction_id:tr.data.id,entry_date:td(),entry_type:'debit',account_category:'expense',amount:cst2,description:'COGS '+bn.data,created_by:CUP&&CUP.id});
    await loadData();
    toast('Done: '+bn.data+' | '+fmt(tot)+' | Margin: '+fmt(mg),'ok',5000);
    cart=[];if($('bc'))$('bc').value='';renderCart();srch();
  }catch(ex){toast('Error: '+ex.message,'err');}
  if(btn){btn.textContent='Complete Sale';btn.disabled=false;}
}

async function processReturn(){
  var bn=($('sr-b')&&$('sr-b').value||'').trim();
  var vid=$('sr-s')&&$('sr-s').value;
  var qty=Number($('sr-q')&&$('sr-q').value||0);
  var pr=Number($('sr-p')&&$('sr-p').value||0);
  var rsn=($('sr-r')&&$('sr-r').value||'').trim();
  var costVal=Number($('sr-cost')&&$('sr-cost').value||0);
  if(!vid){toast('Select a product','err');return;}
  if(!qty||qty<=0){toast('Enter quantity','err');return;}
  if(!pr||pr<=0){toast('Enter refund amount','err');return;}
  if(!rsn){toast('Enter reason','err');return;}
  // FIX 1: Validate sale exists for this product (if bill no provided)
  var refTxnId=null;
  if(bn){
    var ot=await sb.from('transactions').select('id').eq('transaction_no',bn).single();
    if(ot.error||!ot.data){toast('Bill '+bn+' not found','err');return;}
    // Verify item was in this sale
    var si=await sb.from('sale_items').select('qty').eq('transaction_id',ot.data.id).eq('variant_id',vid).single();
    if(si.error||!si.data){toast('This product was not in bill '+bn,'err');return;}
    if(qty>(si.data&&si.data.qty||0)){toast('Return qty ('+qty+') exceeds sold qty ('+(si.data&&si.data.qty||0)+')','err');return;}
    refTxnId=ot.data.id;
  } else {
    // No bill number — verify item was ever sold (check sale_items)
    var anyS=await sb.from('sale_items').select('qty').eq('variant_id',vid).limit(1);
    if(!(anyS.data&&anyS.data.length)){toast('No sales record found for this product','err');return;}

  if(!p.length){c.innerHTML='<div class="em"><div class="ei">-</div><p style="font-size:.72rem">No items</p></div>';return;}
  var cats={};p.forEach(function(pr){if(!cats[pr.cat])cats[pr.cat]={items:[],qty:0,val:0};cats[pr.cat].items.push(pr);cats[pr.cat].qty+=pr.stock||0;cats[pr.cat].val+=(pr.stock||0)*pr.cost;});

    for(var pi=0;pi<d.items.length;pi++){
      var pr=d.items[pi];

      var vid=pr.id;
      html+='<div class="ir" id="row-'+vid+'" onclick="showStockDetail(\''+vid+'\')">';
      html+='<div><div style="font-size:.7rem;font-weight:600">'+pr.name+'</div>';
      html+='<div style="font-size:.55rem;color:var(--ink3)">'+(pr.colour||'')+(pr.size?' - '+pr.size:'')+'</div>';
      html+='<div style="font-family:monospace;font-size:.5rem;color:var(--ink3)">'+pr.sku+'</div></div>';

      if(pr.stock<=2)html+='<div style="font-size:.48rem;color:var(--red)">LOW</div>';
      html+='</div>';
      html+='<div style="text-align:right;font-size:.6rem;font-weight:700;color:'+ac2+'">'+pr.age+'d</div>';
      html+='<div style="text-align:right;font-size:.68rem;font-weight:600">'+fmt((pr.stock||0)*pr.cost)+'</div></div>';
    }
    html+='<div class="if2"><div style="font-size:.63rem;font-weight:700;color:var(--ink2)">Total</div><div style="text-align:center;font-size:.7rem;font-weight:700;color:var(--ink2)">'+d.qty+'</div><div></div><div style="text-align:right;font-size:.7rem;font-weight:700;color:var(--ink2)">'+fmt(d.val)+'</div></div>';
    html+='</div></div>';
  }
  html+='<div style="background:var(--ink);color:white;border-radius:9px;padding:11px 13px;display:flex;justify-content:space-between"><div style="font-size:.72rem;font-weight:700">TOTAL</div><div style="font-size:.72rem;font-weight:700">'+p.reduce(function(s,pr){return s+(pr.stock||0);},0)+' pcs - '+fmt(tv2)+'</div></div>';
  c.innerHTML=html;
}

function updSKU(){var cat=$('pc2')&&$('pc2').value||'';var cl=$('pcl')&&$('pcl').value||'';var sz=$('pz')&&$('pz').value||'';var sk=$('sku');if(!sk)return;if(!cat){sk.textContent='Select category...';return;}sk.textContent=(CCOD[cat]||cat.substring(0,3).toUpperCase())+'-'+colCode(cl)+'-'+szCode(sz)+'-###';}
function setPurPM(m,el){purPayMode=m;var ps=document.querySelectorAll('#ppm .pl');for(var i=0;i<ps.length;i++)ps[i].classList.remove('on');el.classList.add('on');var d=$('ppd');if(!d)return;var ca=accs.find(function(a){return a.name==='Cash Drawer';});if(m==='cash')d.innerHTML='<div class="ib">Cash: '+fmt(ca&&ca.current_balance||0)+'</div>';else if(m==='credit')d.innerHTML='<div class="ib" style="border-color:var(--gold)">Posted to Supplier Payable</div>';else if(m==='partial')d.innerHTML='<div class="fg"><label class="lb">Paid Now Rs</label><input class="ip" id="ppd2" type="number" placeholder="0" oninput="updPP()"></div>';else if(m==='owner')d.innerHTML='<div class="ib">Posted to Owner Payable</div>';updPP();}
function updPP(){var q=Number($('pq')&&$('pq').value||0);var c=Number($('pcs')&&$('pcs').value||0);var t=q*c;var pd=purPayMode==='partial'?Number($('ppd2')&&$('ppd2').value||0):purPayMode==='cash'?t:0;var pay=Math.max(0,t-pd);var p=$('pprev');if(!p)return;if(t>0){p.style.display='block';p.innerHTML='<div style="display:flex;justify-content:space-between;font-size:.72rem;margin-bottom:4px"><span>Total</span><span style="font-weight:700">'+fmt(t)+'</span></div><div style="display:flex;justify-content:space-between;font-size:.72rem;color:var(--sage)"><span>Paid</span><span>'+fmt(pd)+'</span></div><div style="display:flex;justify-content:space-between;font-size:.75rem;font-weight:700;border-top:1px dashed var(--border);padding-top:6px;margin-top:5px;color:var(--red)"><span>Payable</span><span>'+fmt(pay)+'</span></div>';}else p.style.display='none';}
async function savePur(){
  var nm=$('pn')&&$('pn').value.trim();var cat=$('pc2')&&$('pc2').value;var qty=Number($('pq')&&$('pq').value||0);var cst=Number($('pcs')&&$('pcs').value||0);var sup=$('ps2')&&$('ps2').value.trim()||'';
  if(!nm||!cat||!qty||!cst){toast('Fill Name, Category, Qty, Cost','err');return;}
  if(purPayMode!=='owner'&&!sup){toast('Enter supplier name','err');return;}
  var tot=qty*cst;
  var catCode=CCOD[cat]||cat.substring(0,3).toUpperCase();
  var cl=$('pcl')&&$('pcl').value.trim()||'';var sz=$('pz')&&$('pz').value.trim()||'';
  var clC=colCode(cl);var szC=szCode(sz);var prefix=catCode+'-'+clC+'-'+szC;
  var purNo=await sb.rpc('generate_transaction_no',{p_prefix:'PUR'});
  var sp=null;
  if(sup){sp=parties.find(function(p){return p.name===sup&&p.party_type==='supplier';});if(!sp){var nsp=await sb.from('parties').insert({party_type:'supplier',name:sup,created_by:CUP&&CUP.id}).select().single();if(nsp.data){parties.push(nsp.data);sp=nsp.data;}}}
  if(purPayMode==='owner'&&!parties.find(function(p){return p.party_type==='owner';})){var op=await sb.from('parties').insert({party_type:'owner',name:'Owner Account',opening_balance:0,current_balance:0,created_by:CUP&&CUP.id}).select().single();if(op.data)parties.push(op.data);}
  var cr=await sb.from('categories').select('id').eq('name',cat).single();
  var ca=accs.find(function(a){return a.name==='Cash Drawer';});
  var pd=0,payAccId=null;
  if(purPayMode==='cash'){pd=tot;payAccId=ca&&ca.id;if((ca&&ca.current_balance||0)<tot&&!confirm('Insufficient cash. Continue?'))return;}
  else if(purPayMode==='partial'){pd=Number($('ppd2')&&$('ppd2').value||0);payAccId=ca&&ca.id;}
  try{
    // Check if product with same name+category already exists — reuse it
    var existProd=await sb.from('products').select('id').eq('name',nm).eq('category_id',cr.data&&cr.data.id).maybeSingle();
    var prodId=null;
    if(existProd.data&&existProd.data.id){
      prodId=existProd.data.id;
    } else {
      var prod=await sb.from('products').insert({name:nm,category_id:cr.data&&cr.data.id,created_by:CUP&&CUP.id}).select().single();
      if(prod.error)throw prod.error;
      prodId=prod.data.id;
    }
    var skuN=await sb.rpc('generate_transaction_no',{p_prefix:prefix});
    // Each purchase always creates a new variant (new SKU) even for same product
    var variant=await sb.from('product_variants').insert({product_id:prodId,sku:skuN.data,colour:cl,colour_code:clC,size:sz,size_code:szC,purchase_price:cst,created_by:CUP&&CUP.id}).select().single();
    if(variant.error)throw variant.error;
    var txn=await sb.from('transactions').insert({transaction_no:purNo.data,transaction_type:'purchase',transaction_date:td(),party_id:sp&&sp.id||null,total_amount:tot,paid_amount:pd,payment_status:purPayMode==='credit'?'credit':purPayMode==='partial'?'partial':'paid',performed_by:CUP&&CUP.id}).select().single();
    if(txn.error)throw txn.error;
    var pur=await sb.from('purchases').insert({transaction_id:txn.data.id,supplier_party_id:sp&&sp.id||null,purchase_date:td(),total_amount:tot,paid_amount:pd,payment_mode:purPayMode,payment_source_account_id:payAccId}).select().single();
    if(pur.error)throw pur.error;
    await sb.from('purchase_items').insert({purchase_id:pur.data.id,transaction_id:txn.data.id,variant_id:variant.data.id,qty:qty,purchase_price:cst});
    var ownerP=parties.find(function(p){return p.party_type==='owner';});
    var postParty=purPayMode==='credit'||purPayMode==='partial'?sp&&sp.id:purPayMode==='owner'?ownerP&&ownerP.id:null;
    await sb.rpc('post_transaction_ledger',{p_txn_id:txn.data.id,p_txn_type:'purchase',p_payment_mode:purPayMode,p_total:tot,p_paid:pd,p_party_id:postParty,p_account_id:payAccId,p_user_id:CUP&&CUP.id});
    // FIX 1: Update inventory stock on purchase
    var smResult=await sb.rpc('process_stock_movement',{p_variant_id:variant.data.id,p_movement_type:'purchase',p_qty:qty,p_reason:'Purchase: '+skuN.data,p_cost_impact:cst,p_user_id:CUP&&CUP.id,p_txn_id:txn.data.id});
    if(smResult.data&&!smResult.data.success)toast('Stock update issue: '+(smResult.data.error||''),'warn');
    await loadData();
    toast('SKU: '+skuN.data+' | Stock: '+qty,'ok',6000);
    var flds=['pn','pz','pcl','pq','pcs','ps2'];for(var fi=0;fi<flds.length;fi++){var fe=$(flds[fi]);if(fe)fe.value='';}
    if($('pc2'))$('pc2').value='';if($('sku'))$('sku').textContent='Select category...';if($('pprev'))$('pprev').style.display='none';
  }catch(ex){toast('Error: '+ex.message,'err');}
}

async function saveStockMove(mtype){
  var varId=$('sm-prod')&&$('sm-prod').value;
  var qty=Number($('sm-qty')&&$('sm-qty').value||0);
  var rsn=($('sm-rsn')&&$('sm-rsn').value||'').trim();
  var cost=Number($('sm-cost')&&$('sm-cost').value||0);
  var refNo=($('sm-ref')&&$('sm-ref').value||'').trim();

  // ── STEP 1: Common mandatory fields ──
  if(!varId){toast('Select a product','err');$('sm-prod')&&$('sm-prod').focus();return;}
  if(!qty||qty<=0){toast('Enter quantity greater than 0','err');$('sm-qty')&&$('sm-qty').focus();return;}
  if(!cost||cost<=0){toast('Enter cost price — required for valuation','err');$('sm-cost')&&$('sm-cost').focus();return;}
  if(!rsn||rsn.length<5){toast('Enter reason (min 5 characters) — required for audit','err');$('sm-rsn')&&$('sm-rsn').focus();return;}

  // ── STEP 2: Purchase Return specific mandatory fields ──
  if(mtype==='purchase_return'){
    var supName=($('sm-sup')&&$('sm-sup').value||'').trim();
    if(!supName){toast('Supplier name is required for purchase return','err');$('sm-sup')&&$('sm-sup').focus();return;}
    // Verify supplier exists in ledger
    var spCheck=parties.find(function(p){return p.name===supName&&p.party_type==='supplier';});
    if(!spCheck){
      var ok=confirm('Supplier "'+supName+'" not found in ledger.\nCreate new supplier record?');
      if(!ok){toast('Select a valid supplier from List','err');return;}
    }
  }

  var p=prods.find(function(p){return p.id===varId;});
  if(!p){toast('Product not found','err');return;}

  // ── STEP 3: Stock availability check ──
  if(['purchase_return','damaged','other'].indexOf(mtype)>=0){
    if((p.stock||0)<=0){toast('No stock available for '+p.name,'err');return;}
    if(qty>(p.stock||0)){toast('Cannot exceed available stock ('+p.stock+'). Enter '+p.stock+' or less.','err');$('sm-qty')&&($('sm-qty').value=p.stock);return;}
  }

  // ── STEP 4: Show confirmation summary before processing ──
  var totalVal=qty*cost;
  var summary='Confirm Purchase Return:\n\n'+
    'Product: '+p.name+'\n'+
    'SKU: '+p.sku+'\n'+
    'Qty: '+qty+'\n'+
    'Cost/unit: Rs'+cost.toLocaleString()+'\n'+
    'Total Value: Rs'+totalVal.toLocaleString()+'\n'+
    'Reason: '+rsn+'\n\n'+
    'Stock will decrease by '+qty+'.\nLedger will be updated.\n\nProceed?';
  if(!confirm(summary))return;

  // ── STEP 5: Process stock movement ──
  var result=await sb.rpc('process_stock_movement',{
    p_variant_id:varId,p_movement_type:mtype,p_qty:qty,
    p_reason:rsn,p_reference_no:refNo||null,
    p_cost_impact:cost,p_user_id:CUP&&CUP.id
  });
  if(!result.data||!result.data.success){
    toast('Error: '+(result.data&&result.data.error||'Stock update failed'),'err');return;
  }

  // ── STEP 6: Purchase Return — create transaction + ledger entry ──
  if(mtype==='purchase_return'){
    var supName2=($('sm-sup')&&$('sm-sup').value||'').trim();
    var sp=parties.find(function(p){return p.name===supName2&&p.party_type==='supplier';});
    if(!sp){
      var nsp=await sb.from('parties').insert({party_type:'supplier',name:supName2,created_by:CUP&&CUP.id}).select().single();
      if(nsp.data){parties.push(nsp.data);sp=nsp.data;}
    }
    if(sp){
      var no2=await sb.rpc('generate_transaction_no',{p_prefix:'PRET'});
      var txn2=await sb.from('transactions').insert({
        transaction_no:no2.data,transaction_type:'purchase_return',
        transaction_date:td(),party_id:sp.id,
        total_amount:totalVal,paid_amount:0,
        payment_status:'pending',performed_by:CUP&&CUP.id,
        notes:'Purchase Return: '+p.name+' x'+qty+' @ Rs'+cost+'. '+rsn
      }).select().single();
      if(txn2.data){
        // DR Supplier Payable (reduces what we owe) / CR Inventory
        await sb.from('ledger_entries').insert({
          transaction_id:txn2.data.id,entry_date:td(),
          entry_type:'debit',account_category:'party',
          party_id:sp.id,amount:totalVal,
          description:'Purchase Return: '+p.name+' x'+qty,
          created_by:CUP&&CUP.id
        });
        toast('Purchase Return done: '+no2.data+' | Rs'+totalVal.toLocaleString()+' | Supplier: '+sp.name,'ok',7000);
      }
    }
  }

  // ── STEP 7: Sales Return — optional cash refund ──
  if(mtype==='sales_return'){
    var ca2=accs.find(function(a){return a.name==='Cash Drawer';});
    var doR=confirm('Process cash refund to customer?\nAmount: Rs'+totalVal.toLocaleString());
    if(doR&&ca2){
      var no3=await sb.rpc('generate_transaction_no',{p_prefix:'RET'});
      var txn3=await sb.from('transactions').insert({
        transaction_no:no3.data,transaction_type:'sale_return',
        transaction_date:td(),total_amount:totalVal,
        paid_amount:totalVal,payment_status:'paid',
        performed_by:CUP&&CUP.id,
        notes:'Return: '+p.name+' x'+qty+(refNo?' Ref:'+refNo:'')
      }).select().single();
      if(txn3.data)await sb.from('ledger_entries').insert({
        transaction_id:txn3.data.id,entry_date:td(),
        entry_type:'debit',account_category:'cashflow',
        cashflow_account_id:ca2.id,amount:totalVal,
        description:'Refund: '+p.name,created_by:CUP&&CUP.id
      });
    }
  }

  if(mtype!=='purchase_return'){
    toast((SMOVE_LABELS[mtype]||mtype)+': '+qty+' x '+p.name+' | Rs'+totalVal.toLocaleString()+' logged','ok',5000);
  }
  await loadData();cmo();iInv();
}

function calcDiff(){var rp=Number($('ex-rp')&&$('ex-rp').value||0);var ip=Number($('ex-ip')&&$('ex-ip').value||0);var d2=$('ex-diff');if(d2&&(rp||ip)){var diff=ip-rp;d2.style.display='block';d2.textContent=diff>0?'Customer pays extra: '+fmt(diff):diff<0?'Refund: '+fmt(Math.abs(diff)):'No difference';}}
async function saveExchange(){
  var cust=$('ex-c')&&$('ex-c').value||'Walk-in';var riId=$('ex-ri')&&$('ex-ri').value;var rq=Number($('ex-rq')&&$('ex-rq').value||1);var rp=Number($('ex-rp')&&$('ex-rp').value||0);var iiId=$('ex-ii')&&$('ex-ii').value;var iq=Number($('ex-iq')&&$('ex-iq').value||1);var ip=Number($('ex-ip')&&$('ex-ip').value||0);var dm=$('ex-dm')&&$('ex-dm').value||'none';

    if(!confirm(msg))return;
  }var ca=accs.find(function(a){return a.name==='Cash Drawer';});var exNo=await sb.rpc('generate_transaction_no',{p_prefix:'EXC'});
  try{
    var txn=await sb.from('transactions').insert({transaction_no:exNo.data,transaction_type:'sale',transaction_date:td(),total_amount:Math.max(ip,0),paid_amount:Math.max(ip,0),payment_status:'paid',performed_by:CUP&&CUP.id}).select().single();

    if(issP)await sb.rpc('process_stock_movement',{p_variant_id:iiId,p_movement_type:'sale',p_qty:iq,p_reason:'Exchange issue',p_cost_impact:ip,p_user_id:CUP&&CUP.id});
    if(Math.abs(diff)>0&&ca){if(dm==='cash_in')await sb.from('ledger_entries').insert({transaction_id:txn.data.id,entry_date:td(),entry_type:'credit',account_category:'cashflow',cashflow_account_id:ca.id,amount:diff,description:'Exchange diff: '+exNo.data,created_by:CUP&&CUP.id});else if(dm==='cash_out')await sb.from('ledger_entries').insert({transaction_id:txn.data.id,entry_date:td(),entry_type:'debit',account_category:'cashflow',cashflow_account_id:ca.id,amount:Math.abs(diff),description:'Exchange refund: '+exNo.data,created_by:CUP&&CUP.id});}

function addSwcItem(){
  var n=window._swcCount||0;
  var div=document.getElementById('swc-items');if(!div)return;
  var el=document.createElement('div');
  el.style.cssText='background:var(--cream2);border-radius:9px;padding:10px;margin-bottom:8px';
  var opts=prods.filter(function(p){return(p.stock||0)>0;}).map(function(p){return'<option value="'+p.id+'">'+p.name+' ('+p.sku+') Qty:'+p.stock+'</option>';}).join('');
  el.innerHTML='<div class="fg"><label class="lb">Product '+(n+1)+'</label><select class="sl" id="swc-p'+n+'"><option value="">Select...</option>'+opts+'</select></div><div class="fg"><label class="lb">Qty</label><input class="ip" id="swc-q'+n+'" type="number" placeholder="0"></div>';
  div.appendChild(el);

async function saveSwc(){
  var cust=(document.getElementById('swc-cust')&&document.getElementById('swc-cust').value||'').trim();
  if(!cust){toast('Enter customer name','err');return;}
  var items=[];
  for(var i=0;i<(window._swcCount||0);i++){
    var vid=document.getElementById('swc-p'+i)&&document.getElementById('swc-p'+i).value;
    var qty=Number(document.getElementById('swc-q'+i)&&document.getElementById('swc-q'+i).value||0);
    if(vid&&qty>0){
      var p=prods.find(function(p){return p.id===vid;});
      if(p&&(p.stock||0)<qty){toast('Insufficient stock for '+p.name,'err');return;}
      items.push({variant_id:vid,qty_issued:qty});
    }
  }
  if(!items.length){toast('Add at least one item','err');return;}
  var cp=parties.find(function(p){return p.name===cust&&p.party_type==='customer';});
  if(!cp){var nr=await sb.from('parties').insert({party_type:'customer',name:cust,created_by:CUP&&CUP.id}).select().single();if(nr.data){parties.push(nr.data);cp=nr.data;}}
  var swcNo=await sb.rpc('generate_transaction_no',{p_prefix:'SWC'});
  try{
    var swc=await sb.from('stock_with_customer').insert({transaction_no:swcNo.data,customer_party_id:cp&&cp.id,customer_name:cust,issue_date:td(),expected_return:document.getElementById('swc-date')&&document.getElementById('swc-date').value||null,notes:document.getElementById('swc-notes')&&document.getElementById('swc-notes').value||'',performed_by:CUP&&CUP.id}).select().single();
    if(swc.error)throw swc.error;
    await sb.from('stock_with_customer_items').insert(items.map(function(it){return{swc_id:swc.data.id,variant_id:it.variant_id,qty_issued:it.qty_issued};}));
    for(var k=0;k<items.length;k++){
      var p2=prods.find(function(p){return p.id===items[k].variant_id;});
      if(p2)await sb.from('inventory').update({qty_available:Math.max(0,(p2.stock||0)-items[k].qty_issued),qty_with_customer:((p2.withCustomer||0)+items[k].qty_issued)}).eq('variant_id',items[k].variant_id);
    }
    await loadData();cmo();toast('Issued: '+swcNo.data,'ok',5000);
  }catch(ex){toast(ex.message,'err');}
}

  var h='<div class="ib">Record advance/token money. Creates customer deposit entry (liability).</div>';
  h+='<div class="fg"><label class="lb">Customer *</label><div style="display:flex;gap:6px"><input class="ip" id="res-cust" placeholder="Customer name" style="flex:1"><button class="btn bh bsm" onclick="pickP(\'customer\')">List</button></div></div>';
  h+='<div class="fg"><label class="lb">Product *</label><select class="sl" id="res-prod"><option value="">Select...</option>';
  for(var i=0;i<prods.length;i++){if((prods[i].stock||0)>0)h+='<option value="'+prods[i].id+'">'+prods[i].name+' ('+prods[i].sku+') Qty:'+prods[i].stock+'</option>';}
  h+='</select></div>';
  h+='<div class="g2"><div class="fg"><label class="lb">Qty Reserved</label><input class="ip" id="res-qty" type="number" value="1"></div><div class="fg"><label class="lb">Sale Price Rs</label><input class="ip" id="res-price" type="number" placeholder="0"></div></div>';
  h+='<div class="g2"><div class="fg"><label class="lb">Advance Rs *</label><input class="ip" id="res-adv" type="number" placeholder="Token money"></div><div class="fg"><label class="lb">Received Via</label><select class="sl" id="res-acc">'+accs.map(function(a){return'<option value="'+a.id+'">'+a.name+'</option>';}).join('')+'</select></div></div>';
  h+='<button class="btn bg" onclick="saveReservation()">Save Reservation</button>';
  omo('Stock Reservation',h);
}
async function saveReservation(){
  var cust=(document.getElementById('res-cust')&&document.getElementById('res-cust').value||'').trim();
  var vid=document.getElementById('res-prod')&&document.getElementById('res-prod').value;
  var qty=Number(document.getElementById('res-qty')&&document.getElementById('res-qty').value||1);
  var adv=Number(document.getElementById('res-adv')&&document.getElementById('res-adv').value||0);
  var accId=document.getElementById('res-acc')&&document.getElementById('res-acc').value;
  if(!cust||!vid||!adv){toast('Fill customer, product and advance','err');return;}
  var cp=parties.find(function(p){return p.name===cust&&p.party_type==='customer';});
  if(!cp){var nr=await sb.from('parties').insert({party_type:'customer',name:cust,created_by:CUP&&CUP.id}).select().single();if(nr.data){parties.push(nr.data);cp=nr.data;}}
  var resNo=await sb.rpc('generate_transaction_no',{p_prefix:'RES'});
  try{
    var res=await sb.from('stock_reservations').insert({reservation_no:resNo.data,customer_party_id:cp&&cp.id,customer_name:cust,advance_amount:adv,payment_account_id:accId,performed_by:CUP&&CUP.id}).select().single();
    if(res.error)throw res.error;
    await sb.from('stock_reservation_items').insert({reservation_id:res.data.id,variant_id:vid,qty_reserved:qty,sale_price:Number(document.getElementById('res-price')&&document.getElementById('res-price').value||0)});
    var p3=prods.find(function(p){return p.id===vid;});
    if(p3)await sb.from('inventory').update({qty_reserved:((p3.reserved||0)+qty)}).eq('variant_id',vid);
    var txn=await sb.from('transactions').insert({transaction_no:resNo.data,transaction_type:'receipt',transaction_date:td(),party_id:cp&&cp.id,total_amount:adv,paid_amount:adv,payment_status:'paid',performed_by:CUP&&CUP.id,notes:'Advance/Token: '+cust}).select().single();
    if(txn.data&&accId){
      await sb.from('ledger_entries').insert([
        {transaction_id:txn.data.id,entry_date:td(),entry_type:'credit',account_category:'cashflow',cashflow_account_id:accId,amount:adv,description:'Advance from '+cust,created_by:CUP&&CUP.id},
        {transaction_id:txn.data.id,entry_date:td(),entry_type:'credit',account_category:'party',party_id:cp&&cp.id,amount:adv,description:'Customer Deposit: '+resNo.data,created_by:CUP&&CUP.id}
      ]);
    }
    await loadData();cmo();toast('Reservation '+resNo.data+' - Advance: Rs'+adv.toLocaleString(),'ok',5000);
  }catch(ex){toast(ex.message,'err');}
}
